nt-size="12" font-weight="600" fill="#1B2537">LOW - suggestion only,</text><text x="760.0" y="657.0" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">never auto-accepts</text><line x1="265" y1="676" x2="265" y2="713" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="702.0" font-size="10.5" fill="#4C5C77">nothing fits</text><rect x="80" y="722" width="370" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="749" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">UNROUTED - company triage queue.</text><text x="265.0" y="765" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">Always visible, never cross-tenant</text></svg>
