<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1398" role="img" aria-label="How a Request docs click becomes a sent email" style="width:100%;max-width:960px;height:auto;font-family:'IBM Plex Mono',ui-monospace,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8797B0"/></marker></defs><rect x="0" y="0" width="960" height="1398" fill="#F4F7FC"/><rect x="80" y="14" width="370" height="62" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="265.0" y="41" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">Verification run leaves</text><text x="265.0" y="57" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">findings on the file</text><line x1="265" y1="76" x2="265" y2="113" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="122" width="370" height="46" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="265.0" y="149" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">POST findings/request-docs</text><line x1="265" y1="168" x2="265" y2="205" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="214" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="241" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">Is this finding really a request?</text><line x1="450" y1="237.0" x2="571" y2="237.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="230.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">no</text><rect x="580" y="206.0" width="360" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="760.0" y="233.0" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">unidentified_document - the file is here,</text><text x="760.0" y="249.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">we just cannot type it. Re-classify, LP-801</text><line x1="265" y1="260" x2="265" y2="297" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="286.0" font-size="10.5" fill="#4C5C77">yes</text><rect x="80" y="306" width="370" height="62" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="265.0" y="333" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">Which documents resolve it?</text><text x="265.0" y="349" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">requested_documents, else the spec</text><line x1="265" y1="368" x2="265" y2="405" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="414" width="370" height="62" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="265.0" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">Group by DOCUMENT, not finding</text><text x="265.0" y="457" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">9 findings become 5 documents</text><line x1="265" y1="476" x2="265" y2="513" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="522" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="549" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">Already PENDING on this file?</text><line x1="450" y1="545.0" x2="571" y2="545.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="538.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">yes</text><rect x="580" y="514.0" width="360" height="62" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="760.0" y="541.0" text-anchor="middle" font-size="12" font-weight="600" fill="#5A211B">Skip - a borrower must</text><text x="760.0" y="557.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5A211B">never be asked twice</text><line x1="265" y1="568" x2="265" y2="605" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="594.0" font-size="10.5" fill="#4C5C77">no</text><rect x="80" y="614" width="370" height="62" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="265.0" y="641" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">create_needs_item</text><text x="265.0" y="657" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">PENDING · origin FINDING · titled by document</text><line x1="265" y1="676" x2="265" y2="713" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="722" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="749" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">Who is responsible?  LP-800 lookup</text><line x1="450" y1="745.0" x2="571" y2="745.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="738.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">not the borrower</text><rect x="580" y="714.0" width="360" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="760.0" y="741.0" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">You order it: appraisal, credit report</text><text x="760.0" y="757.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">Title company / employer / CPA</text><line x1="265" y1="768" x2="265" y2="805" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="794.0" font-size="10.5" fill="#4C5C77">borrower</text><rect x="80" y="814" width="370" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="841" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">Borrower section of the pending draft</text><text x="265.0" y="857" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">LP-809</text><line x1="265" y1="876" x2="265" y2="913" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="922" width="370" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="949" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">AI drafts subject, sections, closing</text><text x="265.0" y="965" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">LP-810</text><line x1="265" y1="984" x2="265" y2="1021" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="1030" width="370" height="62" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="1057" text-anchor="middle" font-size="12" font-weight="600" fill="#5B4110">Compliance scanner - deterministic,</text><text x="265.0" y="1073" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">not a prompt instruction</text><line x1="450" y1="1061.0" x2="571" y2="1061.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="1054.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">it trips</text><rect x="580" y="1022.0" width="360" height="78" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="760.0" y="1049.0" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">Blocks rates, APR, approved/denied,</text><text x="760.0" y="1065.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">wire and account numbers. One retry,</text><text x="760.0" y="1081.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">then the plain template</text><line x1="265" y1="1092" x2="265" y2="1129" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="1118.0" font-size="10.5" fill="#4C5C77">clean</text><rect x="80" y="1138" width="370" height="46" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="1165" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">She reviews and edits</text><line x1="265" y1="1184" x2="265" y2="1221" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="1230" width="370" height="46" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="1257" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">Send - Reply-To set to the file address</text><line x1="265" y1="1276" x2="265" y2="1313" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="1322" width="370" height="62" rx="5" fill="#E1F3E9" stroke="#2F9E6E" stroke-width="1.4"/><text x="265.0" y="1349" text-anchor="middle" font-size="12" font-weight="600" fill="#14472F">Needs item becomes REQUESTED</text><text x="265.0" y="1365" text-anchor="middle" font-size="12" font-weight="400" fill="#14472F">requested_at stamped, reminder clock starts</text></svg>
