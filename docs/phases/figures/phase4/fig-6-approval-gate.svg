<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 922" role="img" aria-label="The approval gate: reject, triage, or auto-accept" style="width:100%;max-width:960px;height:auto;font-family:'IBM Plex Mono',ui-monospace,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8797B0"/></marker></defs><rect x="0" y="0" width="960" height="922" fill="#F4F7FC"/><rect x="80" y="14" width="370" height="46" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="265.0" y="41" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">Routed message and its attachments</text><line x1="265" y1="60" x2="265" y2="97" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="86.0" font-size="10.5" fill="#4C5C77">PASS</text><rect x="80" y="106" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="133" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">virus_verdict</text><line x1="450" y1="129.0" x2="571" y2="129.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="122.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">FAIL</text><rect x="580" y="98.0" width="360" height="62" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="760.0" y="125.0" text-anchor="middle" font-size="12" font-weight="600" fill="#5A211B">REJECT - never rendered,</text><text x="760.0" y="141.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5A211B">never extracted, kept for audit</text><line x1="265" y1="152" x2="265" y2="189" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="178.0" font-size="10.5" fill="#4C5C77">PASS or GRAY</text><rect x="80" y="198" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="225" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">dmarc_verdict</text><line x1="450" y1="221.0" x2="571" y2="221.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="214.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">FAIL and p=reject</text><rect x="580" y="198.0" width="360" height="46" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="760.0" y="225.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5A211B">REJECT</text><line x1="265" y1="244" x2="265" y2="281" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="270.0" font-size="10.5" fill="#4C5C77">PASS</text><rect x="80" y="290" width="370" height="62" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#5B4110">Routing CERTAIN, sender a known party,</text><text x="265.0" y="333" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">and auto-accept switched on for this file?</text><line x1="450" y1="321.0" x2="571" y2="321.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="314.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">yes</text><rect x="580" y="298.0" width="360" height="46" rx="5" fill="#E1F3E9" stroke="#2F9E6E" stroke-width="1.4"/><text x="760.0" y="325.0" text-anchor="middle" font-size="12" font-weight="400" fill="#14472F">Auto-accept</text><line x1="265" y1="352" x2="265" y2="389" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="378.0" font-size="10.5" fill="#4C5C77">no - the default</text><rect x="80" y="398" width="370" height="78" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">TRIAGE QUEUE</text><text x="265.0" y="441" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">sender, auth badge, thumbnails,</text><text x="265.0" y="457" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">suggested file / type / need</text><line x1="265" y1="476" x2="265" y2="513" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="522" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="549" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">She chooses</text><line x1="450" y1="545.0" x2="571" y2="545.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="538.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">Reject</text><rect x="580" y="522.0" width="360" height="46" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="760.0" y="549.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5A211B">Rejected - never touches the file</text><line x1="265" y1="568" x2="265" y2="605" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="594.0" font-size="10.5" fill="#4C5C77">Accept or Reassign</text><rect x="80" y="614" width="370" height="62" rx="5" fill="#E1F3E9" stroke="#2F9E6E" stroke-width="1.4"/><text x="265.0" y="641" text-anchor="middle" font-size="12" font-weight="600" fill="#14472F">create_document</text><text x="265.0" y="657" text-anchor="middle" font-size="12" font-weight="400" fill="#14472F">upload_source = borrower_inbox · uploader null</text><line x1="265" y1="676" x2="265" y2="713" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="722" width="370" height="62" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="749" text-anchor="middle" font-size="12" font-weight="600" fill="#5B4110">A current document of this type</text><text x="265.0" y="765" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">already on the file?</text><line x1="450" y1="753.0" x2="571" y2="753.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="746.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">yes</text><rect x="580" y="722.0" width="360" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="760.0" y="749.0" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">possible_duplicate = true</text><text x="760.0" y="765.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">surfaced gently, replaces nothing</text><line x1="265" y1="784" x2="265" y2="821" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="810.0" font-size="10.5" fill="#4C5C77">no</text><rect x="80" y="830" width="370" height="78" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="265.0" y="857" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">Existing pipeline, unchanged:</text><text x="265.0" y="873" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">classify, extract, needs update</text><text x="265.0" y="889" text-anchor="middle" font-size="12" font-weight="400" fill="#1B2537">under the per-file Redis lock</text></svg>
