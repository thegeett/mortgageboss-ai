<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 782" role="img" aria-label="Making an emailed attachment safe to read" style="width:100%;max-width:960px;height:auto;font-family:'IBM Plex Mono',ui-monospace,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8797B0"/></marker></defs><rect x="0" y="0" width="960" height="782" fill="#F4F7FC"/><rect x="80" y="14" width="370" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="41" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">MIME part</text><text x="265.0" y="57" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">recursed into forwards, depth capped at 5</text><line x1="265" y1="76" x2="265" y2="113" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="122" width="370" height="62" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="149" text-anchor="middle" font-size="12" font-weight="600" fill="#5B4110">Magic bytes match the declared</text><text x="265.0" y="165" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">type and the extension?</text><line x1="450" y1="153.0" x2="571" y2="153.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="146.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">no</text><rect x="580" y="122.0" width="360" height="62" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="760.0" y="149.0" text-anchor="middle" font-size="12" font-weight="600" fill="#5A211B">Quarantine</text><text x="760.0" y="165.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5A211B">a .pdf that sniffs as ZIP is an attack</text><line x1="265" y1="184" x2="265" y2="221" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="210.0" font-size="10.5" fill="#4C5C77">yes</text><rect x="80" y="230" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="257" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">Is it an archive?  zip / 7z / rar</text><line x1="450" y1="253.0" x2="571" y2="253.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="246.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">yes</text><rect x="580" y="222.0" width="360" height="62" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="760.0" y="249.0" text-anchor="middle" font-size="12" font-weight="600" fill="#5A211B">Quarantine</text><text x="760.0" y="265.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5A211B">ask for the files individually</text><line x1="265" y1="276" x2="265" y2="313" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="302.0" font-size="10.5" fill="#4C5C77">no</text><rect x="80" y="322" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="349" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">Malware scan result arrived, and clean?</text><line x1="450" y1="345.0" x2="571" y2="345.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="338.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">no</text><rect x="580" y="314.0" width="360" height="62" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="760.0" y="341.0" text-anchor="middle" font-size="12" font-weight="600" fill="#5A211B">Quarantine</text><text x="760.0" y="357.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5A211B">a threat, or no result in N minutes</text><line x1="265" y1="368" x2="265" y2="405" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="394.0" font-size="10.5" fill="#4C5C77">clean</text><rect x="80" y="414" width="370" height="46" rx="5" fill="#FDF1DC" stroke="#C08A24" stroke-width="1.4"/><text x="265.0" y="441" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4110">PDF encrypted?</text><line x1="450" y1="437.0" x2="571" y2="437.0" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="515.0" y="430.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">yes</text><rect x="580" y="398.0" width="360" height="78" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="760.0" y="425.0" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">No AV can read an encrypted PDF.</text><text x="760.0" y="441.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">Ask her for the password,</text><text x="760.0" y="457.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">then re-enter at the top</text><line x1="265" y1="460" x2="265" y2="497" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="276" y="486.0" font-size="10.5" fill="#4C5C77">no</text><rect x="80" y="506" width="370" height="62" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="533" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">pikepdf strips /JS, /OpenAction,</text><text x="265.0" y="549" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">/EmbeddedFile, /Launch, /XFA</text><line x1="265" y1="568" x2="265" y2="605" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="614" width="370" height="46" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="265.0" y="641" text-anchor="middle" font-size="12" font-weight="400" fill="#12244A">Rasterize every page to an image</text><line x1="265" y1="660" x2="265" y2="697" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><rect x="80" y="706" width="370" height="62" rx="5" fill="#E1F3E9" stroke="#2F9E6E" stroke-width="1.4"/><text x="265.0" y="733" text-anchor="middle" font-size="12" font-weight="600" fill="#14472F">OCR and extraction read</text><text x="265.0" y="749" text-anchor="middle" font-size="12" font-weight="400" fill="#14472F">ONLY the rasterized image</text></svg>
