<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" role="img" aria-label="The needs item state machine and the reminder loop" style="width:100%;max-width:960px;height:auto;font-family:'IBM Plex Mono',ui-monospace,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8797B0"/></marker></defs><rect x="0" y="0" width="960" height="336" fill="#F4F7FC"/><rect x="40" y="132" width="168" height="46" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="124.0" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">PENDING</text><rect x="268" y="132" width="168" height="46" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4"/><text x="352.0" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">REQUESTED</text><rect x="496" y="132" width="168" height="46" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="580.0" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">RECEIVED</text><rect x="724" y="132" width="168" height="46" rx="5" fill="#E1F3E9" stroke="#2F9E6E" stroke-width="1.4"/><text x="808.0" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#14472F">VERIFIED</text><line x1="208" y1="155" x2="259" y2="155" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="233.5" y="147.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">sent</text><line x1="436" y1="155" x2="487" y2="155" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="461.5" y="147.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">a document arrives</text><line x1="664" y1="155" x2="715" y2="155" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="689.5" y="147.0" text-anchor="middle" font-size="10.5" fill="#4C5C77">passes</text><text x="233" y="172" text-anchor="middle" font-size="10.5" fill="#4C5C77">LP-811</text><rect x="496" y="230" width="168" height="46" rx="5" fill="#FBE7E4" stroke="#C6564A" stroke-width="1.4"/><text x="580.0" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#5A211B">REJECTED</text><line x1="580" y1="178" x2="580" y2="221" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="590" y="205" font-size="10.5" fill="#4C5C77">doc failed - still open</text><rect x="40" y="230" width="168" height="46" rx="5" fill="#FFFFFF" stroke="#C3CEE0" stroke-width="1.4"/><text x="124.0" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#1B2537">WAIVED</text><line x1="124" y1="178" x2="124" y2="221" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="134" y="205" font-size="10.5" fill="#4C5C77">does not apply</text><rect x="236" y="34" width="264" height="46" rx="5" fill="#E4EDFD" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="4 3"/><text x="368" y="54" text-anchor="middle" font-size="12" font-weight="600" fill="#12244A">Reminder suggestion  LP-814</text><text x="368" y="70" text-anchor="middle" font-size="10.5" fill="#12244A">she clicks it, reviews, sends</text><line x1="320" y1="130" x2="300" y2="89" stroke="#8797B0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="196" y="112" font-size="10.5" fill="#4C5C77">3 days, nothing</text><line x1="420" y1="89" x2="440" y2="130" stroke="#8797B0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="452" y="112" font-size="10.5" fill="#4C5C77">clock restarts</text><path d="M808,178 V312 H16 V155 H31" fill="none" stroke="#8797B0" stroke-width="1.4" marker-end="url(#ar)"/><text x="440" y="304" text-anchor="middle" font-size="10.5" fill="#4C5C77">the document is superseded - the need reopens</text></svg>
