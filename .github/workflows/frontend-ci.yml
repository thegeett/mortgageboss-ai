name: Frontend CI

# The paths outside frontend/ are files the vitest suite reads (LP-900 review):
# a change to one of them alone can turn a frontend test red, so it has to run
# this workflow. Keep the two lists identical, and add to them whenever a test
# starts reading another file from outside frontend/.
#   backend/app/ai/prompts/extraction    lib/loan-files/extraction-contracts.test.tsx
#   backend/app/services/page_render.py  components/file/documents/reviewer/page-budget.test.ts
#   backend/app/schemas/preferences.py   components/file/documents/reviewer/split-agreement.test.ts
#   docs/design/ledger/assets            ledger-assets.test.ts
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "backend/app/ai/prompts/extraction/**"
      - "backend/app/services/page_render.py"
      - "backend/app/schemas/preferences.py"
      - "docs/design/ledger/assets/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "backend/app/ai/prompts/extraction/**"
      - "backend/app/services/page_render.py"
      - "backend/app/schemas/preferences.py"
      - "docs/design/ledger/assets/**"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-build:
    name: Lint, Type Check, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the pnpm major version that generated pnpm-lock.yaml so
          # --frozen-lockfile validates cleanly.
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome (lint + format check)
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

      # LP-900. The suite holds the design-system guards (no palette-scale
      # classes, every colour token defined, no faded text) and the ledger-asset
      # drift check. Before this step they only ran when someone remembered
      # `pnpm test` locally, so a PR could break any of them and still go green.
      # TZ is pinned so this run is reproducible locally with
      # `CI=true TZ=UTC pnpm test` (the runner sets CI, and under it vitest fails
      # a stray `.only` instead of running just that test). It does not make the
      # suite timezone-independent: plain `pnpm test` on a laptop still runs in
      # the laptop's zone.
      - name: Run tests (vitest)
        run: pnpm test
        env:
          TZ: UTC

      - name: Build for production
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
