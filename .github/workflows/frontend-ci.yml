name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-build:
    name: Lint, Type Check, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the pnpm major version that generated pnpm-lock.yaml so
          # --frozen-lockfile validates cleanly.
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome (lint + format check)
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

      # LP-900. The suite holds the design-system guards (no palette-scale
      # classes, every colour token defined, no faded text) and the ledger-asset
      # drift check. Before this step they only ran when someone remembered
      # `pnpm test` locally, so a PR could break any of them and still go green.
      # TZ is pinned so a date-formatting test cannot pass here and fail on a
      # laptop (or the reverse) purely because of the runner's clock.
      - name: Run tests (vitest)
        run: pnpm test
        env:
          TZ: UTC

      - name: Build for production
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
