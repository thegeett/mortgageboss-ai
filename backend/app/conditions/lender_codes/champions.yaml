# Champions Funding condition numbers — printed on a "Conditional Approval Certificate" (LP-910).
#
# Champions numbers its conditions 34, 38, 45 … and those numbers are ITS OWN (ADR-407). `268` here
# is short funds to close, which is `7086` at UWM; `45` means nothing at UWM at all. Matching is
# always (lender, code).
#
# QUOTED FOR THE SAME REASON AS UWM'S, even though none of these carries a leading zero today. The
# loader requires a string, so a future `034` cannot silently become 34, and the rule is one rule
# rather than one per file.
#
# `canonical_type_id` is NULL throughout — see the note in `uwm.yaml`; the taxonomy is not in this
# repository and Stage 3 supplies it.
#
# Several of these are INFORMATION ONLY: the lender is telling the processor something it will do
# itself, or stating a policy, rather than asking for a document. Marking them keeps them off the
# ask list in Stage 3 instead of generating a request nobody can satisfy.

lender_key: champions
lender_label: Champions Funding

codes:
  - code: "34"
    label: Homeownership counseling certificate + invoice
    default_bucket_kind: prior_to_docs
    default_owner_hint: borrower

  - code: "38"
    label: CD / closing request form + invoices
    default_bucket_kind: prior_to_docs
    default_owner_hint: broker

