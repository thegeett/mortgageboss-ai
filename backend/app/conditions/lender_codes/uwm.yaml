# UWM condition codes — the template ids printed on a "Loan Approval Conditions" letter (LP-910).
#
# Codes observed on real sheets. They are UWM's OWN ids and mean nothing at another lender
# (ADR-407), which is why this file is per lender and every row is matched as (lender, code).
#
# CODES ARE STRINGS AND KEEP THEIR LEADING ZEROS. UWM prints `0006`; `6` is a different thing
# that matches nothing. The loader refuses an unquoted code for exactly this reason — YAML would
# read `0006` as the integer 6 and the mistake would surface months later as a failed match.
#
# QUOTE ANY LABEL CONTAINING A COLON, AND THE ERROR YOU GET WILL NOT TELL YOU THAT. `6378`'s
# label is `Title: loan number on checks to lender`; unquoted, YAML reads `Title` as a KEY and the
# label becomes a mapping. The loader then refuses the row for having "no label" — pointing the next
# reader at the label rather than at the punctuation that caused it. That is why this one is quoted
# and why this note exists rather than only the rule.
#
# The same silent retyping happens to a value that starts with `-`, `[`, `{`, `>`, `|`, `*`, `&`,
# `!`, `%` or `@`, and to the bare words yes/no/on/off/true/false. When in doubt, quote it: a quoted
# string is never wrong here, and an unquoted one is wrong in a way that reads as correct.
#
# `canonical_type_id` NAMES A TYPE IN THE CONDITION LIBRARY (LP-918, `app/conditions/library/types.yaml`),
# and every row carries one. Stage 1 left the column null because the taxonomy
# (`phase4.5-appendix-C-condition-taxonomy`) was not in this repository; LP-918's library is now the
# source. The 14 rows spec §6 LP-910's table typed keep exactly those ids (0471 AS-11, 1228 PA-03, 1594
# ID-05, 1741 PA-08, 1812 IE-03, 4235 IE-05, 5868 CR-02, 6132 AS-01, 6140 CR-11, 6178 IN-01, 6457 IN-02,
# 6637 AS-04, 7086 AS-10, 7383 CR-02). They are CONDITION TYPES: `docs/rule-engine.md`'s `AS-11` and
# `IN-7` are verification rule ids, a different vocabulary that happens to look alike.
#
# `default_owner_hint` is a HINT and never a decision — Stage 3 decides who acts. It is the weakest
# of the three hint sources (a `TC:` prefix the lender typed beats it, and the bucket beats it), and
# `owner_hint_source: code_map` is what records that ranking on the condition.

