# UWM condition codes — the template ids printed on a "Loan Approval Conditions" letter (LP-910).
#
# Codes observed on real sheets. They are UWM's OWN ids and mean nothing at another lender
# (ADR-407), which is why this file is per lender and every row is matched as (lender, code).
#
# ⚠️ CODES ARE STRINGS AND KEEP THEIR LEADING ZEROS. UWM prints `0006`; `6` is a different thing
# that matches nothing. The loader refuses an unquoted code for exactly this reason — YAML would
# read `0006` as the integer 6 and the mistake would surface months later as a failed match.
#
# `canonical_type_id` is NULL on every row. The taxonomy it refers to
# (`phase4.5-appendix-C-condition-taxonomy`) is NOT in this repository — the `AS-11`-style ids that
# appear in `docs/rule-engine.md` are VERIFICATION RULE ids, a different vocabulary that happens to
# look alike. Spec §LP-910 anticipates this: leave them null and note it. Stage 3 (LP-918) fills
# them in when the library lands.
#
# `default_owner_hint` is a HINT and never a decision — Stage 3 decides who acts. It is the weakest
# of the three hint sources (a `TC:` prefix the lender typed beats it, and the bucket beats it), and
# `owner_hint_source: code_map` is what records that ranking on the condition.

lender_key: uwm
lender_label: United Wholesale Mortgage

codes:
  - code: "0006"
    label: Credit report invoice
    default_bucket_kind: prior_to_funding
    default_owner_hint: processor

