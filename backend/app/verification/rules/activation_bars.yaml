  # on income.type, which was thinly measured / unscored. LP-422 STRENGTHENED that gate with a DETERMINISTIC
  # Schedule C PRESENCE path (the LP-421 surfaced structure — a FACT, not an AI judgment, ADR-334): Schedule C ->
  # "yes" needs no income.type. ⚠️ BUT income.type is NOT fully removed from the gate (LP-423 review): the recipe
  # STILL needs income.type for the NOT_APPLICABLE path — a W-2 borrower reaches is_self_employed "no" (income
  # documents, none self-employment) ONLY via income.type; without it a non-self-employed borrower resolves to
  # "unknown" -> IN-12 couldnt_check, not not_applicable. income.type == self_employment is ALSO still a secondary
  # "yes" path (a 1003-declared self-employment with no surfaced Schedule C). So income.type IS load-bearing and
  # is RESTORED to load_bearing_ai_tags. What makes IN-12 eligible is the VERDICT tag has_2yr_history — measured
  # 100% (LP-393-6), Priya-validated at 0.9 via IN-11 (SAME tag/evidence, the IN-6 inherit pattern); measured_
  # accuracy (1.0) reflects THAT verdict tag. So calibratable-now, validated, 1.0 >= 0.9 -> is_eligible -> ACTIVE.
  # ⚠️ ACCEPTED RISKS (LP-423 D3, ADR-335): (a) the Schedule-C path rests on the STARTER tax-return extractor
  # (ADR-333, no golden files) — a MISSED Schedule C is a wrong SCOPE (not_applicable), visible, and IN-11 (live)
  # still surfaces the 2-year gap, so nothing is lost. (b) the SCOPE also depends on the UNSCORED income.type —
  # a wage-earner MISCLASSIFIED as self_employment (no Schedule C) makes IN-12 apply and FIRE a spurious
  # self-employment finding when has_2yr_history == "no"; accepted because it is LOW-probability (a clean W-2/pay
  # stub is unambiguous wage income), BOUNDED (it only co-occurs with an IN-11 finding on the same borrower), and
  # never a false VERDICT (has_2yr_history is validated). Geet's call to activate; Priya's view on the real-world
  # Schedule-C miss-rate + income.type accuracy is the follow-up refinement.
  status: calibratable-now
  ships: auto
  threshold: 0.9
  validated: true          # inherits has_2yr_history's Priya sign-off (IN-11, LP-393-6, same tag/evidence) — the
                           # VERDICT bar. The self-employment GATE has a deterministic Schedule-C path (LP-422)
                           # PLUS an income.type path (unscored — the accepted-risk (b) above); no new threshold.
  load_bearing_ai_tags: [income.has_2yr_history, income.type]   # income.type IS load-bearing: the gate's
