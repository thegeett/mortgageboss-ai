    rather than being judged against a blanket three-year test it was never given. TWO NUMBERS SIT ON THIS BAR
    AND THEY DISAGREE IN WEIGHT: income.continuance_3yr is MEASURED at 0.833 (LP-427, 5/6, the one miss a
    child-support hedge to `unknown`) and self-consistent at 1.0 over 5 constructed cases. The measurement is
    the stronger evidence and it is below bar; the rule ships anyway because it RATIFIES every finding, and the
    override records that trade rather than hiding it. income.type remains unscored.

