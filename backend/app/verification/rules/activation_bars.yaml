# ===================== not-calibratable-yet (BLOCKED ON CALIBRATION — no bar, not "bar unmet") ======
AS-2:
  # LP-390-5a: BOTH load-bearing AI tags MEASURED -> calibratable-now. apparent_category re-scored 100% concrete
  # (16/16, n=17) mapped free-text->enum (the LP-390-5 24.5% was a byte-compare artifact); has_identified_source
  # 93.8% (n=16). LP-390-7: Priya SIGNED OFF the 0.90 auto bar (validated:true); the rule is now ACTIVE
  # (registry _LP390_ACTIVATED). 0.938 >= 0.90 -> is_eligible -> LIVE. See the loan_proceeds n=0 caveat below.
  status: calibratable-now
  ships: auto
  threshold: 0.90
  validated: true
  measured_accuracy: 0.938   # the WEAKEST measured load-bearing tag (has_identified_source); apparent_category
                             # is 1.0-concrete but see the loan_proceeds n=0 caveat below — the honest floor.
  load_bearing_ai_tags: [txn.apparent_category, txn.has_identified_source]
  fp_fn: "FN (misses undisclosed loan proceeds funding the deal) >> FP"
  rationale: >-
    LP-390-5a: apparent_category re-scored 100% concrete (16/16, n=17) after the LP-379-F free-text->enum
    mapping (the 24.5% was a scoring artifact, NOT the model); has_identified_source 93.8% (n=16, its one miss
    the SAFE over-flag direction). Both AS-2 gates now measured -> calibratable-now. PROPOSED for Priya: a ~0.90
    AUTO bar, or ratify-only while this is one file; below-bar/unknown -> needs_review (LP-376-B).
    ⚠️ CAVEAT (Priya weighs before sign-off): AS-2 FIRES on apparent_category == loan_proceeds, and LF-6T3N has
    ZERO loan_proceeds transactions (n=17 covered payroll/interest/transfer_own/third_party) — the tag is
    measured broadly but its loan_proceeds VALUE is untested; a file with a loan-proceeds deposit would
    strengthen this. measured_accuracy is set to has_identified_source's 0.938 (the weaker MEASURED gate), not
    apparent_category's 1.0, so the number does not over-read the untested trigger.

