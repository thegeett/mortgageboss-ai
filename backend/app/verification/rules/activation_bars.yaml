# LP-380 — ACTIVATION BARS: the decision surface for which INERT rules may go live.
#
# A rule's activation bar is the accuracy its load-bearing AI tags must reach before the rule ships a TRUSTED
# (auto, non-ratified) verdict. It CANNOT be computed — the height depends on the COST OF ERROR for that rule,
# which is DOMAIN judgment. THIS FILE PROPOSES a defensible default per rule and flags it for Priya
# (validated: false). It sets no real bar and activates nothing (that is LP-389).
#
# Fields per rule:
#   status  — calibratable-now | not-calibratable-yet | needs-producer | no-ai-dependency
#             * calibratable-now      : every load-bearing AI tag has a MEASURED accuracy (LP-379) → a bar can
#                                       be set and met.
#             * not-calibratable-yet  : a load-bearing AI tag is PRODUCED but UNSCORED (or measured only in a
#                                       different context) → BLOCKED ON CALIBRATION, not "bar unmet". No number.
#             * needs-producer        : a load-bearing tag does not materialize at all → blocked on a producer.
#             * no-ai-dependency      : no AI load-bearing tag (parsed/deterministic) → no calibration gate;
#                                       activation is a wiring decision, not a bar (cf. active IN-2 / ID-8).
#   ships   — auto | ratify. From the rule's KIND (rule_kinds.csv): judgmental → ratify (LP-376-B: a judgment
#             rule NEVER auto-ships, a human ratifies); structural/calculative → auto.
#   threshold — the PROPOSED default bar in [0,1], or null when no bar can apply (any status but
#               calibratable-now). A DEFAULT flagged for Priya, never a decision.
#   validated — False by default (proposed). Priya's sign-off flips it (the LP-379 priya_validated pattern).
#               CONFIRMED by Priya: IN-1 (0.98, auto) and IN-5 (0.95, auto). All others remain false. Only a
#               calibratable-now rule may be validated — a blocked rule cannot be signed off as live-able.
#   load_bearing_ai_tags — the AI tags whose accuracy gates the rule (direct, or a noted derived upstream).
#   fp_fn   — the false-positive-vs-false-negative asymmetry (Priya's to confirm) — what sets the bar height.
#   rationale — why this default, from ships + fp_fn + the measured numbers.
#   measured_accuracy — LP-389 eligibility evidence for an AI rule: the load-bearing tags' MEASURED accuracy
#               (LP-379). A calibratable-now rule is ELIGIBLE only when validated AND measured_accuracy >=
#               threshold. Null/absent = unmeasured = held (fail-closed).
#   input_resolves — LP-389 eligibility evidence for a no-ai-dependency rule: True only when the rule's parsed
#               input is VERIFIED to resolve to real values on a real file (LP-381/382). False by default =
#               held. Meaningless (and rejected) for any status but no-ai-dependency.
#
# THE HONEST STATE (report, not a pass): of 23 candidate rules, 5 are calibratable-now (IN-1, IN-5, IN-3, and
# — LP-390-5a — AS-2, AS-12). Priya has signed off FOUR (IN-1, IN-5 in LP-389; AS-2, AS-12 in LP-390-7); IN-3
# awaits her. The rest are blocked on calibration / a producer / a wiring decision — reported so a rule never
# ships on a tag nobody measured.
#
# LP-389 — the FIRST activation pass reads THIS file through activation_bars.is_eligible: IN-1 + IN-5 (AI,
# validated, measured 100% >= bar) pass the gate and go live; the other 21 stay held. ID-5 was PROPOSED but
# HELD: its parsed inputs resolve at the DOCUMENT subject, not the "loan" subject ID-5 reads (a producer/
# consumer mismatch), so input_resolves is false and the gate holds it — the safety working as designed. The
# bars persist after activation as the record of WHY each rule went live (or why it was held).

# ===================== calibratable-now (a bar can be set + met) ===================================
IN-1:
  status: calibratable-now
  ships: auto
  threshold: 0.98
  validated: true
  measured_accuracy: 1.0   # LP-379-D: income.documented_monthly 100% (>= the 0.98 bar) → ELIGIBLE (LP-389)
  load_bearing_ai_tags: [income.documented_monthly]   # via the derived income.documented_income_shortfall_pct
  fp_fn: "FN (misses an income overstatement -> a bad loan ships) >> FP (a false variance -> a human glances)"
  rationale: >-
    documented_monthly measured 100% (LP-379-D). Calculative + FRAUD-adjacent (feeds a deterministic
    variance verdict) -> a HIGH bar; consider RATIFY-ONLY until measured on more files (one file, one label
    set). Priya sets the height + the ratify-vs-auto call.

IN-5:
  status: calibratable-now
