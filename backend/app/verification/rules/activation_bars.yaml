  validated: true
  measured_accuracy: 1.0   # LP-379-D: income.employer_normalized 100% (>= the 0.95 bar) → ELIGIBLE (LP-389)
  load_bearing_ai_tags: [income.employer_normalized]
  fp_fn: "FP (a false employer-mismatch flag -> a human compares two names) > FN, but both low stakes"
  rationale: >-
    employer_normalized measured 100% (LP-379-D). Structural consistency check, low error cost either way ->
