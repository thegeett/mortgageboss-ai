  fp_fn: >-
    FP (a false "needs a pay stub" — the processor uploads / points to the pay stub) > FN (misses a terminated
    job with no current-employment proof). A missing pay stub is a FILE GAP surfaced for a human, low stakes.
  rationale: >-
    no AI load-bearing tag — income.terminated_employment is DERIVED from two parsed date facts (the VOE's
    income.employment_end and the pay stubs' income.pay_date), compared per borrower (LP-385). NO threshold:
    Priya's ruling is exact — ANY employment end date in the past is a termination (no grace period), and ONE
