  measured_accuracy: 1.0   # has_2yr_history 100% (LP-393-6) — the VERDICT tag's measurement, the same live IN-11 rests on
  fp_fn: "FN (self-employment without history) >> FP; a missed Schedule C is a wrong scope IN-11 backstops; an income.type-misclassified scope FP is bounded (co-occurs with IN-11)"
