IN-13:
  # LP-423 — NOT re-scoped, still HELD (two independent reasons). (1) SCOPE: LP-422 proposed re-scoping IN-13
  # onto income.has_rental_income, but IN-13 is "Other income continuance" (rule_kinds.csv) covering ALL
  # non-employment income — child support, alimony, pension, an award, Social Security, notes, AND rental (its
  # spec scope: "every borrower with 'other' income"; LP-420's continuance worksheet built 6 distinct
  # other-income types). Gating it on rental alone would SILENTLY NARROW it, dropping five of six types — a
  # coverage regression disguised as a fix (D1 STOP). The available gate (rental) is narrower than the rule's
  # intent (all other income); the real gate would be a broader "has other income" borrower signal that does NOT
  # exist — a different, larger ticket (ADR-335). (2) VERDICT: even a correct gate leaves IN-13 held on its
  # verdict tag income.continuance_3yr — Priya has now LABELED it (LP-427) and it SCORES 5/6. The single miss is
  # child_support: the AI honestly hedges to `unknown` on the child-age arithmetic Priya computes to `yes` (child
  # age 9 vs a termination age → years-remaining >= 3) — a candidate DETERMINISTIC child-support rule (ADR-337),
  # NOT a prompt bug. 5/6 on a thin/skewed n (5 yes / 1 no, the negative one row) clears no bar, AND the OTHER
  # load-bearing tag income.type is still unscored — so LP-427 removes ONE blocker (the uncalibrated verdict) but
  # IN-13 stays not-calibratable-yet. Both reasons hold IN-13 independently; the LP-422 rental re-scope is abandoned.
  # LP-495b — ACTIVATED on a scenario-fixture self-consistency rate (ADR-378). Both load-bearing tags
  # were derived: income.continuance_3yr 1.0000 over 5 cases and income.type 1.0000 over 3 cases, 0
  # disagreements, us.anthropic.claude-sonnet-4-5-20250929-v1:0, 2026-08-13.
  # LP-495b review — THE 5/6 MEASUREMENT IS NOW ON THE BAR, and it was not before. LP-495b activated this rule
  # with `measured_accuracy` left null while LP-427's 5/6 = 0.833 sat in this comment block and in the
  # rationale. That is precisely the state `is_eligible`'s ratify-pending branch calls out as a rule
  # "measured and failing, not unmeasured" — and the guard was bypassed because the number was never put
  # in the field. The number is recorded below, and the activation now costs an explicit written
  # override rather than an omission. The activation DECISION is unchanged; what changed is that a reader
  # of this bar can see both numbers and the reasoning that chose between them.
  # THE PER-TYPE CONTINUANCE TABLE IS THE REAL WORK OF THIS TICKET. IN-13 previously applied ONE blanket
  # three-year test across every income type; B3-3.4 sets the requirement per type, and an income type
  # outside the researched table now ABSTAINS rather than being judged against a default it was never
  # given. The `uncoverable_type` case proves it: a mineral-royalty statement returns unknown, not "no".
  # A PRODUCER DEFECT WAS FIXED TO MAKE THIS POSSIBLE. income_stability's applies_to was
  # [w2, pay_stub, voe, uniform_residential_loan_application] — ALL EMPLOYMENT DOCUMENTS — so the group
  # producing "other income continuance" could never see an award letter, a pension letter or a lease.
  # Widened; no live verdict moves, because the corpus carries zero of those documents (verified).
  # WHAT THE RATE DOES NOT SHOW, stated plainly: 4 of the 5 cases abstain, so only ONE is answerable, and
  # NO "no" was produced by any case. The child-support-ending-soon case — which should be "no" — returns
  # unknown, because child support has NO catalog document type at all and the letter standing in for it
  # is outside the group's scope. The negative path is unobserved.
  status: ratify-pending
  self_consistency_rate: 1.0
  self_consistency_cases: 5
  self_consistency_disagreements: 0
  self_consistency_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  self_consistency_date: "2026-08-13"
  measured_accuracy: 0.833
  measured_accuracy_override: >-
    LP-427 scored income.continuance_3yr at 5/6 = 0.833 against Priya's labels — BELOW the 0.9 its sibling
    tag income.has_2yr_history was validated at, and this rule activates anyway. The reasoning, stated so a
    reader can disagree with it: (1) THE SINGLE MISS IS A KNOWN, NAMED DIVERGENCE, not a scatter. The AI
    hedges to `unknown` on child support where Priya computes `yes` from child-age arithmetic (age 9 vs a
    termination age -> years-remaining >= 3). It is a candidate DETERMINISTIC rule (ADR-337), not a prompt
    defect, and it errs toward abstention. (2) THE MISS DIRECTION IS THE SAFE ONE. Every scored error is a
    hedge to `unknown`, never a wrong verdict — the tag under-claims. A rule reading it abstains rather than
    asserting. (3) RATIFICATION IS THE WHOLE SAFETY (ADR-378). IN-13 ships `ratify`, so every finding costs a
    processor's attention and none auto-asserts. The 0.9 bar exists for AUTO-SHIP trust, which this rule does
    not take. (4) n = 6 IS THIN AND SKEWED (5 yes / 1 no). 0.833 is not a stable estimate of anything; it is
    one miss on six rows. Held against it: the self-consistency rate is weaker still (see the rate's own
