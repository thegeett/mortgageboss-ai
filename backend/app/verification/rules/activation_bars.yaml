    present VOE is indistinguishable from no-VOE without the AI voe_present tag → not_applicable (the never-accuse
    choice; a documented no-AI limitation, LP-430 D4). The reason ASKS FOR THE DOCUMENT, never asserts the
    borrower is unemployed. OPEN (flagged for Priya): same-employer vs any-employer clearing pay stub; whether a
    VOE/offer letter also clears (she said "pay stub" — not broadened here).

