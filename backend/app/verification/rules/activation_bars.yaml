AS-12:
  # LP-390-5a: both load-bearing AI tags now measured -> calibratable-now. Judgmental -> ships RATIFY, so a
  # human ratifies every verdict regardless of the number (activation_mode returns 'ratify' for ships:ratify);
  # the threshold is the SURFACING floor. LP-390-7: Priya SIGNED OFF (validated:true); ACTIVE (_LP390_ACTIVATED)
  # — it surfaces to needs_review for human ratification, never an auto verdict.
  status: calibratable-now
  ships: ratify
  threshold: 0.90
  validated: true
  measured_accuracy: 0.938   # weakest measured load-bearing tag (has_identified_source); apparent_category 1.0-concrete
  load_bearing_ai_tags: [txn.apparent_category, txn.has_identified_source]
  fp_fn: "FN (misses a borrowed-funds pattern) >> FP — but judgmental, a human ratifies"
  rationale: >-
    LP-390-6 fixed the load-bearing list (dropped txn.counterparty — reasoned_over context + an orphan, not
    load-bearing per the spec). LP-390-5a: apparent_category re-scored 100% concrete (n=17, the 24.5% was an
    artifact) + has_identified_source 93.8% (n=16) -> both gates measured -> calibratable-now. Judgmental ->
    ships RATIFY (a human ratifies EVERY verdict, LP-376-B), so 100%/93.8% is far more than enough for the
    tags to SURFACE a pattern for human judgment; unlike AS-2, AS-12 reasons over apparent_category BROADLY
    (no single trigger value), so the loan_proceeds n=0 caveat does not bind it. PROPOSED 0.90 surfacing floor;
    Priya confirms. Still one-file n — she weighs that before sign-off.

