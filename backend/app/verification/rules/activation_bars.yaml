    ("None", "Gas Logs in fireplace...", "Refrigerator, Washer/Dryer"), and contract wording varies by
    STATE FORM more than a bureau field does — the bench's free reader once projected Texas TREC fields
    onto a North Carolina form, so unrecognised wording abstains.
PC-5:
  # ⚠️ BUILT, NOT ACTIVATED — and LP-493a changed WHY.
  #
  # The FIRST derivation scored 1.0000 over 2 cases with the spread {unknown: 2}, and LP-493's pre-rate
  # check 2 refused it as a uniform abstain. LP-493a then found the cause: the model was shown NEITHER
  # the deposit NOR any transaction — the purchase agreement was dropped by borrower-attribution
  # gathering, and transactions live in the legacy `entry.transactions` attribute that no context
  # serialised. It could not have answered anything else.
  #
  # ⚠️ BOTH DEFECTS ARE NOW FIXED (the include_unattributed_documents / include_transactions opt-ins),
  # and the RE-DERIVATION scores 0.5000 — 2 cases, 1 disagreement, {unknown: 2} against {no: 1,
  # unknown: 1}. THE FIXES WORKED AND THE RULE STILL DOES NOT ACTIVATE: it is no longer "could not see",
  # it is "sees the data and cannot decide consistently". ⚠️ A PERFECT RATE WAS HIDING A COIN-FLIP —
  # the sharpest evidence yet that a self-consistency rate is not an accuracy.
  #
  # ⚠️ THE REMAINING BLOCKER IS A PROMPT/INPUT GAP, now identified: the prompt reserves "no" for when
  # "you can see the statements covering that period", which asks the model to judge COMPLETENESS —
  # and nothing tells it. No statement carries a period (start/end are absent on all five of LF-6T3N's)
  # and there is no account roster. The no/unknown boundary is unjudgeable as written, so the rate will
  # stay near 0.5 whatever the file. Fixing that, and widening the prompt to B3-4.3-09's full evidence
  # list (a cancelled cheque OR the deposit holder's statement), is a build ticket with its own
  # derivation.
  status: not-calibratable-yet
  ships: auto
  threshold: null
  validated: false
  load_bearing_ai_tags: [contract.emd_sourced]
  fp_fn: >-
    FN (an unsourced deposit clears -> a large sum enters the transaction undocumented) >> FP (a
    processor produces a cancelled cheque). ⚠️ The prompt is told that "no" is a CLAIM the money did not
    move from a verified account, to be made only when the statements would have shown it — because the
    likely error here is calling a deposit untraced merely because not every account is in the file.
  rationale: >-
    Blocked on a derivation that produced no usable signal, NOT on a producer: the tag materialises on
    both borrowers of LF-6T3N and the calls succeeded. CALIBRATION WOULD REQUIRE a file where the EMD
    trace is KNOWN to exist, so "unknown" can be distinguished from a correct abstain. ⚠️ ALSO A REPORTED
    INPUT GAP: `earnest_money_amount` is SINGULAR and no `additional_earnest_money_amount` field exists,
    so a contract with an initial AND an additional deposit contributes only the first (doc 183's $204k
    case). The prompt asks the model to name a second deposit in its reasoning; the tag cannot carry it.

# --------------------------------------------------------------------------- #
# LP-494 — CO-4 (HOA reserves) and CO-5 (litigation / delinquency / concentration). Both DETERMINISTIC
# after evidence-backed catalog edits, so there is no AI accuracy to measure and no self-consistency rate
# to derive — and no model call was made for either.
#
# ⚠️ BOTH WERE BUILT INERT on `input_resolves: false`; the LP-494 revision flipped both to true and ACTIVATED them — the entries below are the current state, this paragraph is the history, and that flag is the honest one rather than the
# convenient one. LP-485's DEVELOPMENT-MODE meaning still requires that "the producer resolves it on real
# stored data", and here it does not:
#   * NO LOAN FILE CARRIES A CONDO QUESTIONNAIRE — condo_docs is empty on all 28 stored files, and
#     property_type is null on every file that has documents at all.
#   * The two questionnaires in the BENCH corpus are a CANCELLATION NOTICE and a genuinely UNANSWERED
#     standard form. ⚠️ That was verified AT THE DOCUMENT, not inferred from a fill rate: the standard
#     form is 450 KB and yielded 90 catch-all labels against 1 typed field — the exact signature of the
#     LP-493a plumbing defect — but all 90 carry an EMPTY VALUE. The form asks the questions and nobody
#     answered them. Every substantive field fills 0/4.
#
# ⚠️ THIS IS NOT THE TI-3/4/5 BLOCK, and the difference is why these were built rather than dropped.
# There, four RICHLY EXTRACTED title commitments left the fields null — the documents do not carry the
# data. Here the fields exist, the document type exists and classifies, and the documents on hand are
# blank. The rules work the day a completed questionnaire arrives; nothing is inferred in the meantime.
CO-3:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  # ⚠️ THE STRONGEST-RESOLVING INPUT IN THE CONDO LANE: fidelity_crime_coverage_present and
  # fidelity_crime_coverage_amount both fill 8/8 on the bench's master policies.
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a project with no fidelity coverage closes -> the association's funds are unprotected and the
    project is ineligible above 20 units) >> FP (a processor confirms a unit count with the management
    company). The absent case is needs_review rather than fired precisely to keep the FP direction cheap,
    because a project of 20 units or fewer is exempt and the file never states the count.
  rationale: >-
    No AI tag and no threshold to sign off — the exemption figures are cited primaries (B7-4-02, page
    dated 08/05/2026, fetched). ⚠️ THIS RULE WAS DROPPED EARLIER IN THIS SAME TICKET AND THE DROP WAS
    WRONG: the reasoning was that it duplicates live IH-7, but IH-7's own header excludes fidelity
    explicitly, so this is the gap IH-7 documented rather than a second verdict on the same comparison.
    It is a PRESENCE read, not an adequacy one, and the spec says so: B7-4-02 measures the amount against
    three months of assessments on all units, and neither the unit count nor the assessment base resolves
    on any document in the corpus. The amount rides the finding as evidence so a processor can finish the
    arithmetic the file cannot.
CO-4:
  status: no-ai-threshold-pending
  ships: auto
  threshold: null
  # ⚠️ SELF-CALIBRATED, the CR-13 / PR-6 precedent ("OUR calibration: the window is researched + cited in
  # the spec's reference_values"). Both figures are researched and cited; the 15% step-up is tier S with
  # the failed primary fetch reported in full. Holding a researched, cited threshold for an expert
  # sign-off is the deferral this project does not do.
  validated: true
  # ⚠️ FLIPPED ON EVIDENCE, after a SECOND search found what the first missed. `reserve_percentage` reads
  # from the HOA STATEMENT type — which is where HOA BUDGETS classify (the 2026 budget and a revised 2026
  # budget both extract it). The first pass searched only documents LABELLED condo_questionnaire and
  # concluded no budget document type existed; that was wrong.
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a project with underfunded reserves closes -> a special assessment the borrower cannot absorb, and
    an ineligible project delivered) >> FP (a processor confirms a reserve line against the association's
    budget). The abstain direction is the safe one and is where every real file currently lands.
  rationale: >-
    No AI tag to measure; both thresholds are researched and cited in the spec's reference_values, which
    is the calibration record. B4-2.2-02 (08/05/2026, tier P, FETCHED) gives the 10% floor. The 15%
    step-up for applications dated on or after 2027-01-04 is Lender Letter LL-2026-03 at TIER S:
    fanniemae.com returned HTTP 403 for both the landing page and the PDF, robots.txt allows both paths,
    and circumventing the bot protection was declined; two independent secondary sources confirm it
    verbatim, and the 08/05/2026 Guide page still states 10% with no sunset, which is consistent with a
    Lender Letter not yet incorporated. ⚠️ THE THIN-CORPUS CAVEAT IS THE HONEST WEAKNESS: the input
    resolves on ONE PROJECT. Six bench documents carry reserve_percentage, but they are duplicates of two
    budgets from a SINGLE association, all stating 10% — n=1 project, not six. The rule ships because the
    producer demonstrably reads a real budget and every direction is proven on fixtures, and because 10%
    is exactly the floor: that project is compliant today and SHORT from 2027-01-04, which is the rule's
    whole reason to exist. ⚠️ AND IT WILL ABSTAIN ON EVERY STORED FILE TODAY, because property_type is
    null on all 28 — the same gap CO-1 and IH-7 already live with, logged for Priya rather than hidden.
CO-5:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: false
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (an ineligible project reaches underwriting -> the loan is undeliverable after the borrower has
    paid for an appraisal) >> FP (a processor re-confirms a delinquency or concentration figure with the
    management company, which is worth doing anyway — questionnaires are frequently completed from stale
    records). Litigation is needs_review rather than fired precisely to keep the FP direction cheap.
  rationale: >-
    No AI tag and no threshold to sign off — all four limits are cited PRIMARIES fetched 2026-08-13
    (B4-2.2-02 and B4-2.1-03, both page-dated 08/05/2026), including the single-entity figure the ticket's
    two secondary sources disagreed about, which the primary resolves as a TIER (20% at 21+ units, 2 units
    at 5-20) that neither of them described. Eligibility is therefore input_resolves alone, and it is
    FALSE: every one of the five questionnaire fields fills 0/4 on the bench and no loan file carries a
    questionnaire at all. Built against real fields, held until a completed questionnaire exists.

# --------------------------------------------------------------------------------------------------- #
# LP-495a — the REO reconciliation lane (RE-1 / DT-6) and LOE completeness (LO-2).
# ⚠️ ALL THREE ARE DETERMINISTIC: no AI tag, no threshold, therefore NO self-consistency rate and NO
# ratification. They activate on `input_resolves` alone (no-ai-dependency), which is the LP-485
# development-mode meaning — THE PRODUCER RESOLVES IT ON REAL STORED DATA, verified per rule below.
# --------------------------------------------------------------------------------------------------- #
RE-1:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  # ⚠️ VERIFIED ON REAL STORED DATA, not on the bench: reo.statement_disclosure materialises on 6 mortgage
  # statements across 2 active loan files and resolves on ALL SIX — 4 `undisclosed`, 2 `disclosed`. BOTH
  # branches are exercised by real files, which is rare in this codebase and worth recording.
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    ⚠️ NEITHER DIRECTION IS A FINDING — the rule cannot produce `fired` (pinned by test). An unmatched
    statement routes to needs_review because it is a QUESTION, not a defect: it may be a loan paid off
    since the application, a duplicate under a servicer's other name, or a co-signed debt the borrower is
    not obliged on. The costly direction is the FN (a genuinely undisclosed mortgage never surfaces, and
    the DTI is computed from an incomplete liability list); the FP costs a processor one comparison.
  rationale: >-
    No AI tag and no threshold — a tolerant NAME match, reusing IH-2's `_normalise_lender_name` /
    `_lender_names_agree` rather than cloning a second matcher. ⚠️ ONE MATCHER SERVES RE-1 AND DT-6
    (ADR-375): both read tags produced by the same `_reo_match_statement`, so the two rules can never
    disagree about which stated liability a statement matched.
    ⚠️ THE ABSTAIN RATE IS ~24% AND IS STATED HERE RATHER THAN DISCOVERED LATER: `lender_name` fills 54 of
    71 mortgage statements in the corpus (LP-495a Phase A), so roughly a quarter of statements resolve to
    couldnt_check on the name alone. Abstain is the safe direction — the alternative is reading an unnamed
    statement as an undisclosed debt. The match also abstains when the application states NO mortgage
    liabilities (a file whose 1003 was never imported must not read as a file full of undisclosed debts)
    and when a lender matches MORE THAN ONE stated liability (a first and a second with one servicer is
    ordinary, and picking one would attach DT-6's payment comparison to a liability chosen by list order).
    ⚠️ THE MATCH IS ON NAME BECAUSE THERE IS NO OTHER KEY: MISMO emits no property address on a liability,
    so the statement's `property_address` has nothing to match against.
    ⚠️ THIS RULE ASSERTS NOTHING ABOUT RETENTION and does not read `property.is_retained_reo` or
    `property.retained_pitia` — those stay vocabulary orphans with no producer (pinned by test). RE-2
    stays dropped: it asserted a CONSEQUENCE from the retention inference; this surfaces a DISCREPANCY.
DT-6:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  # ⚠️ VERIFIED ON REAL STORED DATA: reo.statement_payment_coverage materialises on the same 6 statements
  # and resolves on the 2 that MATCHED (both `short`); the 4 unmatched abstain BY DESIGN so DT-6 never
  # double-reports the discrepancy RE-1 already surfaced.
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    ⚠️ NEITHER DIRECTION IS A FINDING — the rule cannot produce `fired` (pinned by test). FN (a retained
    property's full PITIA never reaches the DTI, so the ratio understates the obligation and a file
    qualifies that should not) >> FP (a processor compares two payment figures). The FP direction is real
    and expected: a property under contract legitimately shows a stated payment below the billed one.
  rationale: >-
    No AI tag and no threshold. ⚠️ THE SINGLE MOST IMPORTANT CORRECTNESS POINT, AND IT IS A MEASURED FACT
    ABOUT THE EXTRACTOR RATHER THAN AN ASSUMPTION: the statement's `monthly_payment` IS ALREADY THE PITIA
    and is NOT added to `escrow_amount`. The extraction prompt defines them as "the total monthly payment
    (principal+interest+escrow)" and "the escrow PORTION of the payment" — escrow is a COMPONENT, not an
    addend. Summing them would double-count escrow on all 50 of the 67 corpus statements that fill both
    fields and report a shortfall on nearly every file, which is the CO-5 mistake (a 30-day figure
    compared against a 60-day cap) in a new place. The escrow figure rides the REASONING instead, because
    it is usually the EXPLANATION for a real shortfall — a 1003 commonly carries principal and interest
    only. ⚠️ On the two statements that matched on real stored data, escrow is ABSENT entirely, so both
    `short` verdicts are clean stated-vs-billed comparisons with no escrow arithmetic involved.
    ⚠️ NO TOLERANCE BAND, AND THAT IS A CHECKED CONCLUSION (ADR-361), NOT AN OMISSION: no source
    establishes a de-minimis difference between a stated housing payment and a servicer's billed PITIA, so
    any band would be invented. The comparison is exact and a difference of any size routes to
    needs_review.
    ⚠️ THE CATALOG'S "or net rental" PATH IS UNAVAILABLE AND IS NOT FAKED: the snapshot models
    ScheduleEPropertyRecord but there are ZERO property rows across the 15 real tax returns, so
    B3-3.8-01's 75% factor is not used.
LO-2:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  # ⚠️ VERIFIED ON REAL STORED DATA: loe.is_explanation_letter materialises on 98 documents across 8 loan
  # files and resolves on ALL of them (96 `no`, 2 `yes`); loe.completeness materialises on the 2 letters
  # and resolves on both.
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    ⚠️ THE RULE CANNOT PRODUCE `fired` — an incomplete letter routes to needs_review, deliberately. On the
    ONE document type that carries the three legs, `referenced_date` fills 6/9 and
    `borrower_signature_present` 7/9, so an empty extracted field cannot be distinguished from a field the
    extraction missed; a `fired` verdict would assert a defect on a letter that may well state its date on
    the page. FN (an unsigned letter of explanation reaches underwriting) vs FP (a processor opens a letter
    that was fine) — the FP is cheap and the extraction uncertainty makes it likely, so needs_review is the
    honest routing.
  rationale: >-
    No AI tag and no threshold — a three-way presence check on typed extractor fields.
    ⚠️ THE APPROVED DIRECTIVE SAID "all six LOX types" AND THE THREE FIELDS EXIST ON EXACTLY ONE OF THEM.
    Verified against every extractor in app/ai/extraction/ AND the bench corpus: only
    `letter_of_explanation` (9 docs) carries explanation_summary / referenced_date /
    borrower_signature_present. `_misc` (9), `_asset` (7), `_property` (7), `_income` (2) and
    `_child_care` (0) carry DIFFERENT fields (letter_date, reason_or_cause, signature_date,
    borrower_certification); `credit_explanation_letter` (4) has NO EXTRACTOR AT ALL (the bench records
    status `no_extractor`); `application_loe` carries the signature field only.
    ⚠️ PHASE A'S "9/34 · 6/34 · 7/34" ARE CORRECT BUT THEIR DENOMINATOR IS THE WHOLE FAMILY WHILE THEIR
    NUMERATOR CAN ONLY COME FROM THE 9 BASE LETTERS — they are really 9/9, 6/9 and 7/9 on the only type
    with the fields. Building "across all six" on them would have reported 25 of 34 letters incomplete.
    ⚠️ THE OTHER TYPES' FIELDS ARE NOT ALIASED ONTO THE LEGS: `letter_date` is when the letter was
    WRITTEN and `referenced_date` is the date of the EVENT; `borrower_certification` is a prose attestation
    and `borrower_signature_present` is whether a signature is on the page. Different facts.
    ⚠️ EVERY LOE TYPE IS STILL IN SCOPE — none is silently skipped. THREE distinct states, proven by test:
    "no letter exists" -> not_applicable and NO finding; "a letter exists but its type carries no
    completeness fields" -> couldnt_check; "a letter exists and is incomplete" -> needs_review.
    ⚠️ `applicability_expected` IS FALSE, and that is LO-1's held question showing through: declaring a
    missing letter a gap needs the list of conditions that REQUIRE one, which is lender- and AUS-driven
    and enumerated nowhere in the file.
    ⚠️ THE AMOUNT LEG IS DELIBERATELY ABSENT — `referenced_amount` fills 0/34 across the family and 0/9 on
    the one type that declares it (the TI-3/4/5 block). Only `letter_of_explanation_asset` produces list
    rows; the base type's `explanation_items` produces none, so no per-item read exists.
    ⚠️ `borrower_signature_present` IS A TYPED FIELD, so the catalog's "signature (AI for scans)" is STALE
    — LP-487's question answering yes a SIXTH time. REPORTED, NOT RE-KINDED (rule_kinds.csv stays 135).

# --------------------------------------------------------------------------------------------------- #
# LP-495b — the judgmental cohort. All four are ai_judgment, so judgment.py sets ratification_pending
# unconditionally and none can ever ship auto: ratify is the destination, not a waypoint.
# --------------------------------------------------------------------------------------------------- #
OC-3:
  # LP-495b — ACTIVATED on a self-consistency rate (ADR-378), derived over CONSTRUCTED scenario cases
  # rather than the stored corpus. No loaded loan file carries an investment occupancy, so a corpus
  # derivation would have returned the same abstain on every case and pre-rate check 3 would have
  # refused the rate. The constructed cases exercise all three branches and cost $0.06.
  status: ratify-pending
  self_consistency_rate: 1.0
  self_consistency_cases: 4
  self_consistency_disagreements: 0
  self_consistency_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  self_consistency_date: "2026-08-13"
  input_resolves: true
  ships: ratify
  threshold: null
  validated: false
  load_bearing_ai_tags: [occupancy.rental_support]
  fp_fn: >-
    FN (an investment property's rental income is counted with nothing supporting it) >> FP (a processor
    confirms a lease is on file). Judgmental, so a human ratifies either way.
  rationale: >-
    Rate 1.0000 over 4 constructed cases with a FULL THREE-VALUE SPREAD — adequate (lease + proof of
    receipt), adequate (lease alone), inadequate (investment occupancy, no rental document) and n/a
    (a lease on a PRIMARY residence). Every branch reachable and every answer correct on a case whose
    right answer is known by construction, which is more than a rate alone can show.
    THE DERIVATION FOUND AND FIXED A REAL DEFECT, and the first run is why the rate is worth having: on
    `rental_primary_residence` the two derivations DISAGREED (adequate vs n/a). A lease on a
    primary-residence file is the borrower's own housing, not rental income they are claiming, and
    calling it "adequate" invents a claim the file never made. The prompt now scopes on occupancy BEFORE
    reading any document, and the disagreement is gone.
    A SECOND, OLDER DEFECT was found by printing the context (pre-rate check 1): this group is
    LOAN-subject, and the loan context carried MISMO facts ONLY — so a prompt telling the model to
    consider "a lease agreement, Schedule E, an appraisal rent schedule" was handed ZERO documents and
    answered from 1003 facts alone. That is PC-5's failure shape and it has been latent since LP-418
    declared this group. Fixed by the `include_documents` opt-in, default off, so live OC-2's
    `occupancy` group is byte-identical.
    input_resolves is TRUE on the producer's own terms — the tag resolves on constructed data and on any
    file carrying the documents. NO loaded loan file carries an investment occupancy (0 of 24 stored
    properties), so on today's corpus OC-3 is not_applicable everywhere; the raw corpus does carry the
    material (21 lease agreements, lease checks, Verification of Rent) and it is simply not attached.
DT-7:
  # LP-495b — BUILT AND MEASURED, HELD ON THE ENUM GAP. Self-consistency 1.0000 over 4 constructed
  # cases with a full three-value spread (complete / incomplete / unknown), 0 disagreements, model
  # us.anthropic.claude-sonnet-4-5-20250929-v1:0, 2026-08-13. Those numbers are ready to use.
  # WHY IT IS NOT ACTIVATED: dti.atr_factors_documented is declared enum ["complete","incomplete"] with
  # no abstain. The prompt sanctions "unknown" and ai.py coerces it to an unknown tag — but a coerced
  # tag carries confidence=None, which IS the fail-closed marker the orchestrator's degradation scan
  # matches on, so every run where ATR cannot be determined is flagged `degraded`. Degradation is meant
  # to mean a broken pipeline, not a legitimate abstain, and test_full_run_end_to_end catches it.
  # The txn.is_nsf_or_overdraft precedent does NOT cover this: AS-7 is INERT, so that pattern has never
  # run through the orchestrator. It was taken as validation without checking it had been exercised.
  # LP-495c — UNBLOCKED AND ACTIVATED. The reconciliation happened: docs/snapshot-fact-tags.xlsx now
  # declares enum "complete | incomplete | unknown" and fact_tags.csv was regenerated from it. Proven at
  # the mechanism rather than asserted — _build_tag on a model "unknown" with confidence 0.9 now returns
  # a tag carrying that 0.9, so it no longer matches the degradation scan's marker (value=="unknown" AND
  # produced_by==AI AND confidence is None). income.voe_present, whose prompt genuinely offers no
  # abstain, still fail-closes — the control that shows the fix is targeted, not a blanket disabling.
  # The rate below was measured in LP-495b and is used unchanged; nothing was re-derived.
  status: ratify-pending
  self_consistency_rate: 1.0000
  self_consistency_cases: 4
  self_consistency_disagreements: 0
  self_consistency_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  self_consistency_date: "2026-08-13"
  input_resolves: true
  measured_accuracy: null
  ships: ratify
  threshold: null
  validated: false
  load_bearing_ai_tags: [dti.atr_factors_documented]
  fp_fn: >-
    FN ("all ATR factors are documented" on a file that is missing one — the worst false all-clear in
    this cohort) >> FP (a processor re-checks a folder that was in fact complete).
  rationale: >-
    Rate 1.0000 over 4 constructed cases with a FULL THREE-VALUE SPREAD — complete (all eight factors
    supported), incomplete (credit report absent, naming factors vi and viii), incomplete (pay stub
    only) and unknown (EMPTY FILE). The empty-file case is the one that matters: it returns `unknown`,
    never `complete`, which is the false all-clear this rule exists to avoid.
    THE DERIVATION FOUND A DESIGN DEFECT AND THE FIRST RUN RETURNED `incomplete` ON THE COMPLETE FILE.
    The model's reasoning named the cause precisely: factors (iv) simultaneous loan and (vii)
    debt-to-income / residual income have NO supporting document by nature — a simultaneous loan that
    does not exist needs no document, and DTI is a CALCULATION the lender performs, not a document a
    borrower supplies. Left uncorrected, DT-7 would have returned `incomplete` on every file in the
    world: a rule that always says the same thing (ADR-330's vacuity). The prompt now handles both
    factors explicitly. This is exactly what a self-consistency rate CANNOT show on its own — both
    derivations agreed on the wrong answer at 1.0000 — and it was caught by reading the reasoning.
    THE DECLARED ENUM HAS NO ABSTAIN: fact_tags.csv says ["complete","incomplete"]. The prompt sanctions
    "unknown" explicitly and ai.py coerces it to an unknown tag (the txn.is_nsf_or_overdraft precedent,
    LP-418); the empty-file case above proves the path works end to end. Recorded as value-space drift
    for the next docs/snapshot-fact-tags.xlsx reconciliation — the generated CSV cannot be hand-edited.
    SCOPE: this rule checks DOCUMENT PRESENCE per factor, not the ability-to-repay determination, which
    is a creditor obligation assessed at underwriting. See the spec header.
    LP-495b review — "HELD" DOES NOT MEAN "COSTS NOTHING", and this bar previously implied it did. DT-7 has a bar
    and is not in ACTIVE_RULE_IDS, which makes it a BLOCKED CANDIDATE — so `blocked_candidate_rule_ids()`
    includes it, `_pending_check_ai_groups()` therefore includes its producer `atr_documentation`, and with
    `pending_checks_enabled` (ON by default) that group is materialized on EVERY verification run. Two
    consequences, both intended by LP-391 and neither previously written down here: (1) a real model call
    over the file's whole document set per run — the `include_documents` loan context, so the largest
    context in this cohort; the RULE's own judgment is stubbed (`_discarded_judgment_stub`) and costs
    nothing, but the TAG is not. (2) Where the tag materializes and DT-7 reaches a surfaceable verdict, a
    PENDING_AUTOMATION flag ships to the processor — "manual review needed", never the uncalibrated verdict.
    That is the honest-middle behaviour LP-391 was built for and it is left ON deliberately: silence on a
    file that qualifies reads as "checked, clean". Recorded so the cost is a decision, not a surprise.

PE-1:
  status: no-ai-dependency
  ships: auto
  threshold: null
  # `validated: false` is NOT a hold here — it is the only legal value. `validated` is Priya's
  # THRESHOLD sign-off, and the loader permits it only on calibratable-now / no-ai-threshold-pending.
  # This rule has no threshold pending: every value is researched, cited and TIER P from FHFA's own
  # 2026 release, so rule_kinds carries threshold_needs_signoff=false and the gate runs on
  # `input_resolves` alone. The eligibility path is no-ai-dependency + input_resolves (is_eligible).
  validated: false
  # The inputs resolve: `program.type` reads MISMO loan.program and `loan.amount` reads
  # TERMS_OF_LOAN/BaseLoanAmount, both already-live parsed tags. What does NOT resolve is the property
  # COUNTY, and that is a DESIGN input rather than a missing one — the rule abstains in the band where
  # the county decides, instead of guessing it. See PE-1.yaml.
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a jumbo is processed as conforming -> re-pricing, re-disclosure and a delayed closing late in
    the file) >> FP (a processor confirms a loan amount against a published county limit). The rule is
    built so the FN cannot happen through the band: an amount between the baseline and the high-cost
    ceiling ABSTAINS rather than clearing, because only the county resolves it.
  rationale: >-
    No AI tag to measure — the rule is one numeric comparison against declared reference values, which
    is why rule_kinds.csv moved from deterministic_bookend+ai to the AI-free bookend (the CO-4
    precedent). The 2026 one-unit baseline ($832,750), the high-cost ceiling ($1,249,125) and the
    Alaska / Hawaii / Guam / USVI pair ($1,249,125 / $1,873,675) are TIER P from FHFA's release dated
    2025-11-25, fetched 2026-08-13. The 2-4 unit limits were NOT verified against a primary (FHFA's
    release states one-unit figures only; the multi-unit table ships inside a downloadable county
    file), so a multi-unit property abstains rather than being judged against an unverified number.
    THE CORPUS DOES NOT EXERCISE THE FIRED BRANCH: no conventional loan file carries an amount near
    the limit, so the verdicts below are proven on constructed scenario cases whose right answer is
    known by construction, not on observed data.

PE-3:
  status: no-ai-dependency
  ships: auto
  threshold: null
  # `validated: false` is the only legal value for a no-ai-dependency bar, and nothing is pending:
  # the 3.5% / 10% rates, the 580 / 500 tiers and the Adjusted Value definition are all TIER P, read
  # directly from HUD Handbook 4000.1 this ticket, so threshold_needs_signoff=false.
  validated: false
  # input_resolves is TRUE on the GUIDELINE inputs and the rule is honest about the two it lacks:
  # inducements to purchase are not representable anywhere in the snapshot (0/19 loan files), and the
  # Minimum Decision Credit Score reaches 1/19. Neither is defaulted — the first is omitted in the
  # ONE-DIRECTIONAL safe sense (it can only raise the requirement, never clear a failing file) and the
  # second ABSTAINS. Both are stated on the finding.
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (an FHA file closes short of the minimum required investment -> the loan is not insurable, found
    at underwriting after the file has been worked) >> FP (a processor re-checks a down payment against
    the appraisal). The missing-inducement approximation errs toward FP by construction.
  rationale: >-
    No AI tag to measure — one arithmetic comparison against a cited percentage. HUD Handbook 4000.1
    (Effective 09/14/2015, Last Revised 08/14/2019), read directly from HUD's hosted PDF on 2026-08-13:
    the MRI is "at least 3.5 percent of the Adjusted Value"; for purchases "the Adjusted Value is the
    lesser of: purchase price less any inducements to purchase; or the Property Value"; an MDCS "at or
    above 580" gets maximum financing (96.5% LTV on a purchase), "between 500 and 579" is capped at 90%
    LTV, and below 500 the borrower "is not eligible for FHA-insured financing".
    THE CATALOG RATIONALE SAID "3.5% OF PRICE" AND THAT IS WRONG — the basis is Adjusted Value, and
    on a low appraisal the two differ in the direction that CLEARS a failing file. The divergence is
    recorded in the spec and pinned by a scenario test.
    THE CORPUS CANNOT EXERCISE THIS RULE AT ALL: four FHA loan files exist, three carry ZERO
    documents and the fourth carries two, and none carries a purchase contract, appraisal or credit
    report. Every verdict below is proven on constructed scenario cases, not on observed data.

FR-3:
  status: ratify-pending
  self_consistency_rate: 1.0000
  self_consistency_cases: 4
  self_consistency_disagreements: 0
  self_consistency_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  self_consistency_date: "2026-08-14"
  ships: ratify
  threshold: null
  validated: false
  input_resolves: true
  measured_accuracy: null
  load_bearing_ai_tags: [contract.unusual_credits]
  fp_fn: >-
    INVERTED FOR THIS COHORT, and the inversion is the point. Everywhere else FN >> FP ("never clear on
    a missing document"). A fraud-adjacent finding names a person: a false "these terms look unusual"
    costs a borrower and a processor real time and trust, while a missed one costs a review a human was
    going to do anyway at underwriting. So FP > FN here, and the rule is built to surface rather than
    assert — no auto-fire, no threshold, needs_review only, and an unreadable contract abstains instead
    of being read as clean.
  rationale: >-
    THE ONLY RULE IN THE FRAUD COHORT WHOSE EVIDENCE EXISTS (LP-498 Phase A). Its input is a first-class
    typed field set on the purchase-contract extractor — seller_credit_amount, seller_credit_purpose,
    other_concessions_amount and side_agreements_referenced — not an inference. The other five are held:
    FR-1's tag cannot see its subject (an AI group receives extracted values, never a rendering, and the
    only viable reshape duplicates LP-474's deterministic zero-false-positive consistency layer); FR-2's
    two inputs have no producer and one is deliberately undeclared (LP-493); FR-4 asks a bank-transaction
    tag about a pay-stub deduction line; FR-5's declared "pattern across statements" is unanswerable from
    a context that shows one transaction; FR-6 would be the first list-producing tag in the system.
    NO THRESHOLD, deliberately. "Side agreement" has none, and the IPC cap is PC-4's question
    (agency-gated to LP-509) — FR-3 asks whether the terms merit review, not whether a percentage was
    exceeded, so there is nothing for an expert to sign off and threshold_needs_signoff is false.
    CORPUS: the loaded corpus has TWO purchase agreements and 0/2 fill on every one of the four fields,
    so this rule abstains on every stored file today. The raw corpus DOES carry real credits — 13 lines
    with non-zero amounts — so the signal exists in documents that never reach a loan file. The rate
    below is therefore measured on CONSTRUCTED cases, and what that does and does not establish is
    recorded here rather than implied.
    THE RATE: 1.0000 over 4 constructed cases, 0 disagreements, with a FULL THREE-VALUE SPREAD —
    "no" (a routine $3,000 closing-cost credit with a stated purpose), "yes" twice by two DIFFERENT
    routes (a referenced side agreement; a $45,000 credit whose purpose is only "per addendum"), and
    "unknown" (a contract whose credit fields did not extract). Two "yes" routes deliberately, so the
    branch does not rest entirely on the side-agreement field. Call 2 re-derives from the same source
    data with the document's field dict REVERSED, so the prompt is not byte-identical — at temperature
    0 an identical prompt measures determinism, not consistency (LP-495a).
    WHAT THE RATE DOES NOT SHOW, and this matters more here than the number: it establishes that the
    plumbing works and every branch is reachable. It establishes NOTHING about detecting a real unusual
    credit, because the fixtures' author knows the intended answer — scoring self-authored cases against
    self-authored logic measures self-consistency, not correctness (ADR-332 / LP-487).
    THE FIRST DERIVATION SCORED 0.7500 AND THE DISAGREEMENT WAS A PROMPT DEFECT, not model noise —
    caught by reading the reasoning, which is the LP-495b/DT-7 lesson applied. On the ordinary
    $3,000 credit one call answered "no" ("routine closing-cost credit, clearly stated purpose") and
    the other "yes" ("routine credit type BUT should be reviewed to verify terms align with loan
    guidelines"). The second was answering COMPLIANCE — PC-4's question — not unusualness, and on the
    commonest real contract that flips the tag to "yes" half the time, which is exactly the
    false-positive direction this cohort exists to avoid. The prompt now says explicitly that the tag
    is not asked whether a credit complies, and that "should be verified" is true of every credit and
    would make the tag say "yes" on every contract. Re-derived to 1.0000 after the fix.
