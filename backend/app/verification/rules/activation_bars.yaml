    FP is why the mismatch routes to NEEDS_REVIEW, not fired (ADR-325) — a human confirms, the rule never
    falsely asserts a different property. A missed genuine mismatch still SURFACES (as needs_review).
  rationale: >-
    no AI load-bearing tag; a DETERMINISTIC enum branch on property.address_normalized_match (LP-407-4), which
    compares the purchase contract's property_address against the MISMO SUBJECT-property address (never the
    borrower's mailing address, never a retained-property tax bill — the D1 trap) after the consistency
    normalizers. Because those normalizers cannot expand "St"->"Street", a mismatch is routed to NEEDS_REVIEW
    (ADR-325, the second instance after IN-6) — surfaced for a human, never auto-fired as a "different property".
    The input resolves on the address scenarios (build_address_*), so it is eligible; no Priya threshold.
    ⚠️ CAVEAT: LF-6T3N has no MISMO subject-property address (LP-414 added only property.purchase_price) → PC-3
    COULDNT_CHECKS there — an honest absence, not a bug; the branches are proven on the address scenarios
    (LP-407-4 tests). The AI-tolerant match (property.address_normalized_match's fact_tags design) is the future
    refinement that reduces the needs_review noise — a calibration ticket, deferred.

PC-2:
  # LP-407-3 — the ONE surviving Bucket 2.5 wire-and-write rule. It compares two INDEPENDENT loan-level tags
  # (contract.loan_sales_price ← the purchase agreement; property.purchase_price ← the 1003/MISMO) — NOT the
  # DT-5/DT-2 self-source vacuity trap. NO AI dependency (both parsed/derived) and NO threshold (EXACT compare,
  # rule_kinds threshold_needs_signoff=false) → the AS-8 no-ai-dependency path, eligible on input_resolves alone.
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true    # LP-414: both prices are 365000 on the repaired LF-6T3N → PC-2 SATISFIED → ELIGIBLE
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (misses a contract/1003 price discrepancy — a data-entry error or a stale/renegotiated price) vs FP (a
    false flag — a human re-checks two stated figures). Exact compare, so no tolerance tunes this today.
  rationale: >-
    no AI load-bearing tag; an EXACT equality compare of two parsed/derived stated prices (the contract sale
    price vs the 1003/MISMO purchase price), computed with zero Priya threshold (rule_kinds exact / no-signoff).
    LP-414 repaired the fixture field names so both tags materialize on the BASE LF-6T3N (contract.loan_sales_
    price == property.purchase_price == 365000 → PC-2 SATISFIED). The input resolves — eligible (registry
    _LP407_ACTIVATED). PRIYA REFINEMENT (optional, non-blocking): whether a sub-dollar rounding tolerance should
    ever be allowed — today exact, per the classification. ⚠️ CAVEAT (the AS-8/PC-7 one-sided-trigger shape):
    LF-6T3N's prices MATCH (SATISFIED), so PC-2's FIRED (mismatch) path ships UNEXERCISED on real data; a
    mismatched-price fixture would exercise it — the branch is proven on a constructed snapshot (LP-407-3 tests).
    A refinance (no purchase agreement → contract.loan_sales_price "unknown") couldnt_checks, not not_applicable
    (no loan.purpose tag — the PC-7 gap). PC-2 must not falsely fire when the prices agree — Phase-2 verified.

ID-5:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true    # LP-389-A: the subject mismatch is FIXED (per-borrower) — the input now resolves → ELIGIBLE
  load_bearing_ai_tags: []
  fp_fn: "n/a — deterministic (per-borrower ID expiration vs the loan's closing date)"
  rationale: >-
    no AI load-bearing tag; a wiring decision (cf. active ID-8, parsed-only). LP-389 HELD ID-5: a producer/
    consumer subject mismatch (inputs on the DOCUMENT subject, rule read at "loan") → couldnt_check on every
    file. LP-389-A FIXED it — ID-5 is now PER BORROWER, reading the borrower's belongs_to-attributed ID
    expiration (id.borrower_id_expiration, derived) against the loan's closing date (contract.loan_closing_date,
    derived). The input now RESOLVES at the subject the rule reads (verified on LF-6T3N: SATISFIED for both
    borrowers), so input_resolves is true and the gate lets ID-5 through.

IN-3:
  # RECLASSIFIED (LP-384 review fix): IN-3 is an AI rule, NOT no-ai. income.ytd_annualized_shortfall_pct is
  # derived, but its recipe reads income.documented_monthly (AI, income_amounts) alongside the parsed
  # ytd_gross/pay_date — the SAME transitive AI dependency as IN-1. Encoding it as no-ai left a latent trap:
  # a future input_resolves:true would ADMIT it via the no-AI gate, and — its bar declaring no AI tag — the
  # income_amounts group would never fold into _required_ai_groups, so IN-3 would couldnt_check FOREVER,
  # invisible to the LP-389 guard (which only inspects declared load_bearing_ai_tags). As calibratable-now the
  # loader now REJECTS any input_resolves on it (that gate is no-ai-only), and the declared AI tag makes the
  # fold-in + guard see the real dependency. LP-390-9: Priya SIGNED OFF the 0.98 auto bar (validated:true);
  # documented_monthly is measured 100% (LP-379-D, the same evidence IN-1 rests on) >= 0.98 -> is_eligible ->
  # ACTIVE (registry _LP390_9_ACTIVATED).
  status: calibratable-now
  ships: auto
  threshold: 0.98
  validated: true
  load_bearing_ai_tags:
    - income.documented_monthly
  measured_accuracy: 1.0
  fp_fn: "false-fire if documented monthly income is over-read; the YTD-annualized comparison is deterministic"
  rationale: >-
    an AI rule (transitive dependency on income.documented_monthly, the SAME shape as IN-1), not the no-ai it
    was first filed as (LP-384 review finding). It abstains on "documented monthly income is absent" until the
    income_amounts wave runs; its shortfall bar (0.98, via documented_monthly's 100% measurement) is signed off
    by Priya (LP-390-9) — the same tag + evidence as IN-1. ACTIVE.

IN-6:
  # LP-406-3b — written on the derived income.employer_coverage tag (LP-410, unblocking the LP-406-3/ADR-323
  # set-coverage stop). A TRANSITIVE AI dependency, the IN-3 shape: employer_coverage is derived, but it reads
  # income.employer_normalized (AI, income_employer group) to build the pay-stub vs W-2 employer sets — so this
  # is calibratable-now (NOT no-ai; the declared AI tag folds income_employer into _required_ai_groups and the
  # LP-389 guard sees the real dependency; the loader rejects input_resolves here). PROPOSED for Priya: a 0.95
  # AUTO bar — IN-5's exact precedent (SAME tag income.employer_normalized, measured 100% LP-379-D, the 0.95
  # height she already signed off for IN-5). validated:false — HELD pending her sign-off; ACTIVE stays 25.
  status: calibratable-now
  ships: auto
  threshold: 0.95
  validated: true          # LP-412: PRIYA SIGNED OFF — "approve at 0.95, same as IN-5". 1.0 >= 0.95 -> is_eligible -> ACTIVE.
  load_bearing_ai_tags:
    - income.employer_normalized
  measured_accuracy: 1.0   # LP-379-D: income.employer_normalized 100% (the same measurement live IN-5 rests on)
  fp_fn: >-
    FP (a short-form employer name reads as an uncovered gap) is the KNOWN residue — so `uncovered` routes to
    needs_review, NOT fired (a human confirms). FN (a genuine missing W-2/pay stub) still reaches the human via
    needs_review. So the error cost is a human confirmation, not a false auto-verdict either way.
  rationale: >-
    an AI rule (transitive dependency on income.employer_normalized, the IN-3 shape), not no-ai. The coverage
    matching reuses IN-5's MEASURED normalizers (100%, LP-379-D) — no new judgment — so the bar is IN-5's own
    0.95 (same tag, same evidence). LP-412: PRIYA SIGNED OFF at 0.95 — HER RULING was "same as IN-5" (the same
    tag income.employer_normalized and the same 100% measurement she already approved for IN-5's 0.95 bar); NOT
    an unreviewed default. 1.0 >= 0.95 -> is_eligible -> ACTIVE (registry _LP412_ACTIVATED). ⚠️ The `uncovered`
    branch ships NEEDS_REVIEW, not fired (LP-406-3b D2 / ADR-325): the deterministic normalizer cannot resolve
    every short-form employer name, so a reported gap is surfaced for human confirmation rather than asserted —
    the honest routing until the AI fuzzy-residue is closed (a refinement, a caveat IN-6 ships live with).

IN-4:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true    # LP-384: build_lf6t3n_plus adds 2 VOEs (77-day gap) → the gap producer resolves → ELIGIBLE
  load_bearing_ai_tags: []
  fp_fn: "n/a — deterministic (employment gap from parsed dates)"
  rationale: >-
    no AI load-bearing tag; a wiring decision. LP-382 proved the chain computes given >= 2 dated records;
    LP-384 adds them to the fixture (build_lf6t3n_plus: two VOEs with a deliberate 77-day gap → IN-4 FIRES;
    a no-gap variant satisfies). The input resolves — eligible.

CR-4:
  # LP-444 — CR-4 (undisclosed tradeline, report vs app), the FIRST consumer of list visibility (LP-437/443).
  # WRITTEN this ticket, HELD here. CR-4 is deterministic (structural) reading credit.undisclosed_tradeline,
  # a BRAND-NEW AI tag the credit_profile borrower group produces by comparing the report's tradelines (a
  # generic list) against the app's stated liabilities. Deterministic → ships AUTO, but the tag is UNSCORED
  # (no measured accuracy, no Priya bar) → not-calibratable-yet, threshold null, validated false →
  # is_eligible=false → NOT activated. Calibrating the tag against Priya's labels + her bar is a separate
  # ticket; until then CR-4 is written + inert. (Mirrors OC-1 — a deterministic rule on an unscored AI tag.)
  status: ratify-pending
  self_consistency_rate: 1.0
  self_consistency_cases: 13
  self_consistency_disagreements: 0
  self_consistency_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  self_consistency_date: "2026-08-13"
  input_resolves: true
  ships: auto
  threshold: null
  validated: false
  load_bearing_ai_tags: [credit.undisclosed_tradeline]
  fp_fn: "FP (flags a disclosed debt the fuzzy match missed -> a human re-checks) vs FN (misses a genuinely undisclosed debt -> DTI understated). Calibration must bound both before it ships a trusted verdict."
  rationale: >-
    CR-4 reads credit.undisclosed_tradeline (AI, credit_profile) — a per-borrower verdict comparing the credit
    report's tradelines to the app's stated liabilities. The tag is a NEW AI judgment with no measured accuracy
    and no Priya bar. CR-4 would auto-ship (deterministic), so it cannot go live until the tag is scored against
    Priya's report-vs-app labels and she sets a bar. Blocked on calibration, not a producer — the inputs (the
    credit report's tradelines and the MISMO liabilities) already materialize; list visibility (LP-444) feeds them.

# --------------------------------------------------------------------------- #
# LP-485 — the date-compare family. All three read PARSED dates through DERIVED numbers; no AI tag is in
# any chain, so none can be blocked on calibration.
#
# ⚠️ WHERE OUR CALIBRATION LIVES, and why `validated` is NOT the place today. Each window is researched
# and cited to the publisher's live guide — the value, section and page date sit in the SPEC's
# reference_values, which is the calibration artifact and is authoritative now. The BAR's `validated` flag
# is narrower: parse_bar REJECTS `validated: true` with `input_resolves: false` outright ("a threshold
# sign-off cannot activate a rule whose parsed input does not resolve", LP-411). Since no file carries
# these documents yet, `validated` stays false and flips WITH input_resolves on the same day. Setting it
# true now would not activate anything — it would fail to load. The threshold is not in question; only the
# activation flag is. See docs/domain/priya-open-questions.md.
#
# ⚠️ `input_resolves: true` is a DEVELOPMENT-MODE assertion (LP-485 policy): the parsed inputs are declared
# and their extraction fields exist, so the chain resolves whenever the documents are present. It is NOT a
# claim that a loan file carries them today — end-to-end verification against real files is deferred to the
# testing phase by explicit decision. Recorded here so a later reader does not mistake it for a measurement.
# --------------------------------------------------------------------------- #
CL-1:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  load_bearing_ai_tags: []
  input_resolves: true
  fp_fn: >-
    FN (a lock silently expiring before closing -> the borrower's rate and pricing change at the table) >>
    FP (a false expiry warning -> a processor checks one date).
  rationale: >-
    No AI tag and NO domain threshold (a date ordering), so nothing awaits calibration — eligibility is
    input_resolves alone. ⚠️ input_resolves here is a DEVELOPMENT-MODE ASSERTION, not measured evidence:
    ZERO loan_estimate documents exist on any loan file today, so rate_lock.expiration does not resolve
    anywhere (verified 2026-08-12). The rule is live because the build-first policy ships rules ahead of
    the corpus; on a file with no loan estimate it fail-closes to couldnt_check, which is the honest
    outcome. Re-confirm against real loan estimates when the corpus arrives.
CR-13:
  status: no-ai-threshold-pending
  ships: auto
  threshold: null
  validated: true           # OUR calibration: the window is researched + cited in the spec's reference_values
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a stale credit report clears -> the file closes on credit that no longer reflects the borrower) >>
    FP (a false staleness flag -> a processor checks a pull date).
  rationale: >-
    No AI to measure; the window is a DOMAIN number, researched and cited: Fannie Mae Selling Guide
    B1-1-03, page dated 04/02/2025 — four months on the note date; the value + citation live in the spec's
    reference_values, which is the calibration record. LIVE at LP-485 under the development-mode policy.
PR-6:
  status: no-ai-threshold-pending
  ships: auto
  threshold: null
  validated: true           # OUR calibration: the window is researched + cited in the spec's reference_values
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a stale appraisal clears -> the loan closes against a value the investor will not accept) >> FP (a
    false staleness flag -> a processor checks an effective date). The MIDDLE band is neither: an update
    requirement is a condition to satisfy, not an error to dispute.
  rationale: >-
    No AI to measure; both bounds are DOMAIN numbers, researched and cited: Fannie Mae Selling Guide
    B4-1.2-04, page dated 06/04/2025 — 12 months to the note date, an update required beyond 4; the values
    + citation live in the spec's reference_values, which is the calibration record. LIVE at LP-485 under
    the development-mode policy.

# --------------------------------------------------------------------------- #
# LP-486 / ADR-376 — CR-12 (disputed accounts). Deterministic: no AI tag in the chain, no threshold (a
# closed VOCABULARY, not a number), so eligibility is input_resolves alone.
#
# ⚠️ `input_resolves: true` here is the LP-485 DEVELOPMENT-MODE meaning: the input is declared, its
# extraction field exists, and the producer resolves it on real stored data (verified on the two bench
# credit reports AND on LF-96SV's free-text format). It is NOT the older meaning the 11 pre-LP-485 bars
# use ("verified end-to-end on a live loan file"). ONE FIELD, TWO SEMANTICS — this bar asserts the former.
#
# ⚠️ SHIPS `auto`, forced by kind (structural). There is no human in the loop, which is exactly why the
# closed-vocabulary ABSTAIN is the rule's safety: an unrecognised bureau encoding couldnt_checks rather
# than silently reading as "not disputed".
CR-12:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a genuine open dispute reads as undisputed -> the file closes on suppressed bureau data) >> FP (a
    flagged dispute a processor confirms in seconds). The abstain guard exists to keep the FN direction
    closed on an unfamiliar encoding.
  rationale: >-
    No AI tag and no threshold — a closed vocabulary recorded in the spec's reference_values (Priya's
    ruling). The producer recognises it and abstains on anything else, so the rule never classifies open
    bureau text. Resolves on real stored data in BOTH known encodings (Y/N and free text).

# --------------------------------------------------------------------------- #
# LP-487 — IH-2 (mortgagee clause) and IH-7 (condo master policy). Both deterministic; no AI tag is in
# either chain.
#
# ⚠️ IH-2 CARRIES A CATALOG EDIT, not just a bar. rule_kinds.csv moved it from `ai_fuzzy_match` to
# `deterministic_only` (the row count stays 135). That kind predates typed extraction: the perception
# step is already spent by the extractor, which lands the mortgagee in `mortgagee_name` on 14 of 15
# binders, so what remains is a normalised string compare. See the spec header and LP-487.md.
#
# ⚠️ `input_resolves: true` on both bars is the LP-485 DEVELOPMENT-MODE meaning — the inputs are declared,
# their extraction fields exist, and the producers resolve them on real stored data. It is NOT the older
# "verified end-to-end on a live loan file" meaning that the 11 pre-LP-485 bars use.
IH-2:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    ⚠️ THE FP DIRECTION IS THE DANGEROUS ONE HERE, which is why this rule cannot fire. A correspondent's
    creditor and the investor who will hold the loan legitimately differ — the corpus's one binder+CD
    pairing reads "Sistar Mortgage Company" against "United Wholesale Mortgage" — so a firing rule would
    be WRONG ON A CORRECT FILE, repeatedly, and train a processor to dismiss it. A mismatch therefore
    routes to needs_review ("confirm"), where both the true mismatch and the legitimate difference get
    the same cheap human glance. The residual FN (a wrong mortgagee reads as matching) is bounded by the
    2-token prefix tolerance, which is recorded in the recipe as the known false-satisfied direction.
  rationale: >-
    No AI tag and no threshold — a declared normalisation vocabulary (truncation markers, corporate
    suffixes, a token-prefix tolerance) recorded in the spec's reference_values, mirrored by the recipe
    and pinned identical by test. Resolves on real stored data: mortgagee_name fills on 14/15 bench
    binders, closing_disclosure.lender_name on 8/9 and loan_estimate.lender_name on 3/3.
IH-7:
  status: no-ai-threshold-pending
  ships: auto
  threshold: null
  validated: true           # OUR calibration: both values researched + cited in the spec's reference_values
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a condo closes with no master policy, or a thin one -> the building securing the loan is
    effectively uninsured and the investor will not accept it) >> FP (a processor requests a certificate
    the HOA can produce). The unrecognised-basis abstain keeps the FN direction closed on carrier wording
    we have not seen.
  rationale: >-
    No AI to measure; both bounds are DOMAIN numbers, researched and cited: Fannie Mae Selling Guide
    B7-4-01, page dated 08/05/2026 — general liability of at least $1 million for any single occurrence;
    B7-3-03, page dated 08/05/2026 — master property coverage of at least 100% of replacement cost. Both
    values + citations live in the spec's reference_values, which is the calibration record. ⚠️ The
    liability floor is in B7-4-01, NOT B7-3-03 — the catalog rationale names no section and the two live
    in different chapters. The fidelity/crime requirement (B7-4-02) is deliberately NOT evaluated: its
    unit-count input never resolves, and building on it would make IH-7 permanently couldnt_check. Logged
    in docs/domain/priya-open-questions.md.
    ⚠️ input_resolves here is a DEVELOPMENT-MODE ASSERTION, not measured evidence — the same caveat CL-1
    carries, recorded because the flag otherwise reads as verified. IH-7's applicability input
    property.type does NOT resolve today: tag_production.yaml records MISMO property_type as null on all
    three fixtures, and app/mismo has no property_type mapping at all, so IH-7 returns couldnt_check on
    every MISMO-imported file. That is the SAME condition the paragraph above gives as the reason for not
    building the fidelity leg — stated here so the two do not read as contradicting each other. The rule
    ships under the build-first policy and fail-closes honestly; re-confirm when property.type has a
    producer.

# --------------------------------------------------------------------------- #
# LP-488 — MI-1 (conventional MI requirement). Deterministic: no AI tag in the chain.
#
# ⚠️ `validated` IS NOT READ FOR THIS BAR. `is_eligible()` reads `input_resolves` ALONE for
# `no-ai-dependency`; `validated` is only consulted on `calibratable-now` / `no-ai-threshold-pending`.
# MI-1 DOES carry a researched threshold (80% LTV), but the threshold is not what gates it — there is no
# AI accuracy to measure. Setting `validated: true` here would be DECORATIVE, so it stays false and this
# comment says why. (CL-1 is the precedent; LP-485 recorded the same reasoning.)
#
# ⚠️ THE THRESHOLD IS NOW TIER P — Fannie Mae Selling Guide B7-1-01, page dated 04/02/2025, READ
# 2026-08-13 (LP-491 follow-up). It shipped at LP-488 as tier S with the page date marked NOT OBTAINED;
# the page has since been fetched and the wording confirmed verbatim, so the caveat is lifted rather
# than left to rot. The value and its citation live in the spec's reference_values.
MI-1:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    ⚠️ NEITHER DIRECTION IS A FIRING RISK, because MI-1 cannot fire. An LTV above 80% routes to
    needs_review ("confirm the file carries MI") because the PRESENCE of mortgage insurance has no
    deterministic source in the system — no document type carries an MI certificate. The residual FN is
    a file whose LTV is understated by a missing appraisal, which the couldnt_check path catches
    instead: a rule that cannot compute an LTV abstains rather than clearing the MI requirement.
  rationale: >-
    No AI tag and no calibration to measure. The 80% threshold is a DOMAIN number recorded in the spec's
    reference_values with its provenance tier (P — B7-1-01, page dated 04/02/2025, read 2026-08-13). The inputs are MISMO
    facts that were present in the snapshot all along but never declared: loan.amount (BaseLoanAmount),
    property.purchase_price, and the appraisal's appraised_value. The LTV arithmetic is not
    reimplemented — the recipe calls app/verification/ltv.py (LP-77), so the rule path and the display
    path cannot drift.

# --------------------------------------------------------------------------- #
# LP-488 — MI-4 (FHA upfront MIP). Deterministic: no AI tag in the chain.
#
# ⚠️ `validated` IS NOT READ FOR THIS BAR either (no-ai-dependency → is_eligible reads input_resolves
# alone). MI-4's threshold IS tier-P — HUD ML 2023-05, published 2023-02-22, read this pass — but that is
# recorded in the spec's reference_values, which is the calibration record. Setting `validated: true`
# here would be decorative, so it stays false and this comment says why.
MI-4:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a wrong upfront premium closes -> the loan is short of, or over-charged for, mandatory FHA
    insurance and the endorsement is at risk) >> FP (a processor checks two numbers on the note). The
    "nothing financed" case is deliberately NOT a failure: the premium may have been paid in cash, and a
    Section 248 mortgage is exempt — neither is detectable from any field, so that row asks rather than
    asserts.
  rationale: >-
    No AI tag. The rate is a DOMAIN number at the strongest provenance available — HUD Mortgagee Letter
    2023-05, the publisher's own document, published 2023-02-22, effective for case numbers assigned on
    or after 2023-03-20 — recorded with its citation in the spec's reference_values. The inputs are two
    DIFFERENT MISMO elements (TERMS_OF_LOAN/BaseLoanAmount and TERMS_OF_LOAN/NoteAmount), so the check is
    not an ADR-330 vacuity. ⚠️ Only the UPFRONT premium is evaluated: no document type in the system
    carries a monthly MIP figure, so the annual leg — and ML 2023-05's per-cell annual rate matrix, which
    was NOT obtained — is deliberately unbuilt rather than invented.

# --------------------------------------------------------------------------- #
# LP-488 — CO-1 (condo questionnaire present). Deterministic document-type presence; no AI tag, no
# threshold, so eligibility is input_resolves alone and `validated` is not read.
#
# ⚠️ PRESENCE ONLY, deliberately. Warrantability (CO-3/CO-5) is NOT decided here and is not buildable:
# property.is_warrantable_condo has no source field in any of the 121 schema specs, because it is a
# project-review conclusion (Form 1076 / PERS), not a readable datum. Logged for Priya.
CO-1:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
    FN (a condo closes with no project review -> the loan is undeliverable) >> FP (a processor confirms a
    questionnaire that is already in the file). The empty-file abstain keeps the FP direction closed on a
    file nobody has uploaded to yet: no documents is not the same as a missing questionnaire.
  rationale: >-
    No AI tag and no threshold. A document-type PRESENCE read — the classifier's type label, never
    extracted fields (the IN-8/IN-9/IN-16 discipline), which matters because the one questionnaire in the
    bench corpus fills 0 of its unit-count fields and is still genuinely present. property.type is an
    already-declared MISMO enum; the presence read resolves on any file carrying documents.

# --------------------------------------------------------------------------- #
# LP-488 — AU-3 (AUS recommendation status). Deterministic: no AI tag, no threshold (a closed
# VOCABULARY, not a number), so eligibility is input_resolves alone and `validated` is not read.
#
# ⚠️ THE THIN-CORPUS CAVEAT IS THE HONEST WEAKNESS HERE. n=1 across 303 documents, and that one is an
# LPA. The DU spellings in the vocabulary are RESEARCHED, not observed — no DU file has ever exercised
# them. They ABSTAIN rather than misfire if wrong, which is why this is shippable at all, but whether a
# rule calibrated on one document is worth shipping is logged for Priya.
AU-3:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  input_resolves: true
  load_bearing_ai_tags: []
  fp_fn: >-
