    that puts a WRONG VERDICT (not a hedge) in the errors, or the child-support determination moving to a
    deterministic rule — after which this override should be deleted, not re-argued.
  input_resolves: true
  ships: ratify
  threshold: null
  validated: false
  load_bearing_ai_tags: [income.continuance_3yr, income.type]
