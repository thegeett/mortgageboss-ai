# LP-380 — ACTIVATION BARS: the decision surface for which INERT rules may go live.
#
# A rule's activation bar is the accuracy its load-bearing AI tags must reach before the rule ships a TRUSTED
# (auto, non-ratified) verdict. It CANNOT be computed — the height depends on the COST OF ERROR for that rule,
# which is DOMAIN judgment. THIS FILE PROPOSES a defensible default per rule and flags it for Priya
# (validated: false). It sets no real bar and activates nothing (that is LP-389).
#
# Fields per rule:
#   status  — calibratable-now | not-calibratable-yet | needs-producer | no-ai-dependency | no-ai-threshold-pending
#             * calibratable-now      : every load-bearing AI tag has a MEASURED accuracy (LP-379) → a bar can
#                                       be set and met.
#             * not-calibratable-yet  : a load-bearing AI tag is PRODUCED but UNSCORED (or measured only in a
#                                       different context) → BLOCKED ON CALIBRATION, not "bar unmet". No number.
#             * needs-producer        : a load-bearing tag does not materialize at all → blocked on a producer.
#             * no-ai-dependency      : no AI load-bearing tag (parsed/deterministic) AND no threshold to sign off
#                                       → eligible on input_resolves alone (cf. active AS-8 / IN-2 / ID-8).
#             * no-ai-threshold-pending: no AI to calibrate, but a Priya THRESHOLD (a window/limit, not an AI
#                                       accuracy) still needs sign-off → eligible on input_resolves AND validated
#                                       (LP-411, the third case; cf. PC-7's closing window). Uses `validated` as
#                                       the sign-off because the spec/CSV threshold_needs_signoff flag is
#                                       calculative-only (kinds.py rejects it on a structural rule).
#   ships   — auto | ratify. From the rule's KIND (rule_kinds.csv): judgmental → ratify (LP-376-B: a judgment
#             rule NEVER auto-ships, a human ratifies); structural/calculative → auto.
#   threshold — the PROPOSED default bar in [0,1], or null when no bar can apply (any status but
#               calibratable-now). A DEFAULT flagged for Priya, never a decision.
#   validated — False by default (proposed). Priya's sign-off flips it (the LP-379 priya_validated pattern).
#               CONFIRMED by Priya: IN-1 (0.98, auto) and IN-5 (0.95, auto). All others remain false. Only a
#               calibratable-now rule may be validated — a blocked rule cannot be signed off as live-able.
#   load_bearing_ai_tags — the AI tags whose accuracy gates the rule (direct, or a noted derived upstream).
#   fp_fn   — the false-positive-vs-false-negative asymmetry (Priya's to confirm) — what sets the bar height.
#   rationale — why this default, from ships + fp_fn + the measured numbers.
#   measured_accuracy — LP-389 eligibility evidence for an AI rule: the load-bearing tags' MEASURED accuracy
#               (LP-379). A calibratable-now rule is ELIGIBLE only when validated AND measured_accuracy >=
#               threshold. Null/absent = unmeasured = held (fail-closed).
#   input_resolves — LP-389 eligibility evidence for a no-ai-dependency rule: True only when the rule's parsed
#               input is VERIFIED to resolve to real values on a real file (LP-381/382). False by default =
#               held. Meaningless (and rejected) for any status but no-ai-dependency.
#
# THE HONEST STATE (report, not a pass): of 23 candidate rules, 10 are calibratable-now. 9 are SIGNED OFF +
# live: IN-1, IN-5 (LP-389); AS-2, AS-12 (LP-390-7); IN-3 (LP-390-9); and IN-7, IN-10, IN-11, AS-11 (LP-393-6 —
# scored on the LP-393-1 scenario fixture, Priya signed off her heights + chose AUTO, overriding the ratify-only
# recommendation on a synthetic-only basis). 1 is PROPOSED but NOT yet signed off (LP-397: AS-6 — its tag now
# produces after LP-390-8a, scored 100% but ONE-SIDED n=5; validated:false pending Priya). NOTE: IN-7 is
# JUDGMENTAL, so despite her AUTO request it ships RATIFY (LP-376-B armor in judgment.py) — surfaces to
# needs_review; truly-auto needs a kind reclassification (a separate ticket, ADR-316). The rest are blocked on
# calibration / a producer / a wiring decision — reported so a rule never ships on a tag nobody measured.
#
# LP-389 — the FIRST activation pass reads THIS file through activation_bars.is_eligible: IN-1 + IN-5 (AI,
# validated, measured 100% >= bar) pass the gate and go live; the other 21 stay held. ID-5 was PROPOSED but
# HELD: its parsed inputs resolve at the DOCUMENT subject, not the "loan" subject ID-5 reads (a producer/
# consumer mismatch), so input_resolves is false and the gate holds it — the safety working as designed. The
# bars persist after activation as the record of WHY each rule went live (or why it was held).
#
# LP-495b review — HOW TO READ THE SECTION HEADERS BELOW: a section records where an entry STARTED, not where it is
# now. `status` on the entry is the only authority. Fifteen bars are now `ratify-pending` (ADR-378) and they
# sit scattered across every section, because a rule that later gained a producer or a self-consistency rate
# was re-statused in place rather than moved. Trust the field, not the heading it happens to sit under.

# ===================== calibratable-now (a bar can be set + met) ===================================
IN-1:
  status: calibratable-now
  ships: auto
  threshold: 0.98
  validated: true
  measured_accuracy: 1.0   # LP-379-D: income.documented_monthly 100% (>= the 0.98 bar) → ELIGIBLE (LP-389)
  load_bearing_ai_tags: [income.documented_monthly]   # via the derived income.documented_income_shortfall_pct
  fp_fn: "FN (misses an income overstatement -> a bad loan ships) >> FP (a false variance -> a human glances)"
  rationale: >-
    documented_monthly measured 100% (LP-379-D). Calculative + FRAUD-adjacent (feeds a deterministic
    variance verdict) -> a HIGH bar; consider RATIFY-ONLY until measured on more files (one file, one label
    set). Priya sets the height + the ratify-vs-auto call.

IN-5:
  status: calibratable-now
  ships: auto
  threshold: 0.95
  validated: true
  measured_accuracy: 1.0   # LP-379-D: income.employer_normalized 100% (>= the 0.95 bar) → ELIGIBLE (LP-389)
  load_bearing_ai_tags: [income.employer_normalized]
  fp_fn: "FP (a false employer-mismatch flag -> a human compares two names) > FN, but both low stakes"
  rationale: >-
    employer_normalized measured 100% (LP-379-D). Structural consistency check, low error cost either way ->
    a moderate bar. Priya confirms.

# ===================== not-calibratable-yet (BLOCKED ON CALIBRATION — no bar, not "bar unmet") ======
AS-2:
  # LP-390-5a: BOTH load-bearing AI tags MEASURED -> calibratable-now. apparent_category re-scored 100% concrete
  # (16/16, n=17) mapped free-text->enum (the LP-390-5 24.5% was a byte-compare artifact); has_identified_source
  # 93.8% (n=16). LP-390-7: Priya SIGNED OFF the 0.90 auto bar (validated:true); the rule is now ACTIVE
  # (registry _LP390_ACTIVATED). 0.938 >= 0.90 -> is_eligible -> LIVE. See the loan_proceeds n=0 caveat below.
  status: calibratable-now
  ships: auto
  threshold: 0.90
  validated: true
  measured_accuracy: 0.938   # the WEAKEST measured load-bearing tag (has_identified_source); apparent_category
                             # is 1.0-concrete but see the loan_proceeds n=0 caveat below — the honest floor.
  load_bearing_ai_tags: [txn.apparent_category, txn.has_identified_source]
  fp_fn: "FN (misses undisclosed loan proceeds funding the deal) >> FP"
  rationale: >-
    LP-390-5a: apparent_category re-scored 100% concrete (16/16, n=17) after the LP-379-F free-text->enum
    mapping (the 24.5% was a scoring artifact, NOT the model); has_identified_source 93.8% (n=16, its one miss
    the SAFE over-flag direction). Both AS-2 gates now measured -> calibratable-now. PROPOSED for Priya: a ~0.90
    AUTO bar, or ratify-only while this is one file; below-bar/unknown -> needs_review (LP-376-B).
    ⚠️ CAVEAT (Priya weighs before sign-off): AS-2 FIRES on apparent_category == loan_proceeds, and LF-6T3N has
    ZERO loan_proceeds transactions (n=17 covered payroll/interest/transfer_own/third_party) — the tag is
    measured broadly but its loan_proceeds VALUE is untested; a file with a loan-proceeds deposit would
    strengthen this. measured_accuracy is set to has_identified_source's 0.938 (the weaker MEASURED gate), not
    apparent_category's 1.0, so the number does not over-read the untested trigger.

AS-4:
  status: no-ai-dependency
  ships: auto
  threshold: null
  validated: false
  # LP-497 — CORRECTED, and the correction is the reason this rule could activate. The prior bar named
  # stmt.is_reserve_eligible load-bearing "via the reserves calculator". IT IS NOT IN THIS CHAIN AT ALL:
  # build_reserves_view sums assets from the DB (_sum_assets / _sum_assets_excluding) and takes its PITI
  # divisor from the DTI calculator's housing line; reserves.required_months reads MISMO occupancy and
  # financed unit count. Nothing AI-produced feeds either operand. The tag was blocking a rule it does
  # not touch — the LP-495b shape (occupancy.rental_support had a producer its own bar denied), inverted.
  load_bearing_ai_tags: []
  input_resolves: true
  fp_fn: "FN (clears a file with insufficient reserves) >> FP (a false shortfall -> a human re-checks)"
  rationale: >-
    NO AI tag to measure — the whole chain is deterministic, so the 0/5 that blocked this rule was
    measuring a tag it never reads. That 0/5 is itself diagnosed rather than inherited (LP-497): the
    stmt_facts prompt asks about ACCOUNT TYPE ("a normal checking/savings balance"), while Priya was
    answering whether those funds count as reserves for THIS loan — they do not, because they are the
    funds to close. Both answers are correct to their own question, which is why the disagreement was
    systematic rather than noisy, and compute_reserves ALREADY subtracts down payment and closing costs,
    so the judgment the tag was invented to supply is redundant with arithmetic that is already right.
    The threshold is TIER P: B3-4.1-01 (page dated 08/07/2024, fetched 2026-08-13) gives every encoded
    cell — none for a one-unit principal residence, 2 months for a second home, 6 for a two- to four-unit
    principal residence or an investment property. The prior occupancy-ONLY map carried a recorded
    false-green (a 2-4 unit primary read as requiring 0); it now abstains when the unit count is unknown.
    NOT MODELLED, and AS-4's `satisfied` is scoped accordingly: the 2%/4%/6%-of-aggregate-UPB overlay
    for other financed properties, and the 6-month cash-out-over-45%-DTI cell. Neither the financed-
    property count nor the aggregate UPB reaches the snapshot. Both can only RAISE the requirement, so
    the encoded figure is a FLOOR and the rule never under-abstains in the dangerous direction.

OC-1:
  # LP-406-4 — the first Bucket 2 rule, WRITTEN this ticket, HELD here. OC-1 is deterministic (structural), so
  # it ships AUTO — but its verdict rests on occupancy.consistent_with_signals (AI), which is UNSCORED: no
  # measured accuracy, no bar. LIVE OC-2 rides the SAME tag but RATIFIES every verdict (a human signs each), so
  # OC-2 never needed the tag CALIBRATED; OC-1's auto-ship does. So it is not-calibratable-yet (produced but
  # unscored), threshold null, validated false → is_eligible=false → NOT activated. Calibrating the tag against
  # Priya's occupancy labels is a separate ticket; until then OC-1 is written + producing, held.
  # ⚠️ LP-495a — ACTIVATED on a SELF-CONSISTENCY rate (ADR-378), not a measurement. The tag is NOT
  # re-kinded: `occupancy.consistent_with_signals` is SHARED with live OC-2, so re-kinding it is a
  # behaviour change on shipped code and needs its own regression evidence. It stays `ai`.
  status: ratify-pending
  self_consistency_rate: 0.9474
  self_consistency_cases: 19
  self_consistency_disagreements: 1
  self_consistency_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  self_consistency_date: "2026-08-13"
  input_resolves: true
  ships: auto
  threshold: null
  validated: false
  load_bearing_ai_tags: [occupancy.consistent_with_signals]
  fp_fn: >-
    FN (clears a file whose occupancy declarations conflict — an occupancy misrepresentation is the
    single most consequential borrower-side defect, since pricing, LTV limits and the reps-and-warrants
    all key on it) >> FP (a false conflict -> a human re-checks two 1003 answers). ⚠️ THE OBSERVED
    FALSE-POSITIVE DIRECTION IS THE ASYMMETRIC DECLARATION SET — see the disagreement below.
  rationale: >-
    ⚠️ THE ACTIVATION PRECONDITION LP-406-4 RAISED IS RESOLVED BY THE STATUS ITSELF, NOT BY A CHANGE TO
    OC-2. The precondition was that OC-1 would AUTO-ship while live OC-2 RATIFIES the same tag, so a "no"
    file would surface once auto and once ratified. On `ratify-pending`, `ratifies_every_finding` returns
    true for OC-1 too, so BOTH rules now route to a human and the double-surface is two ratified prompts
    rather than an auto-assertion racing a ratification. Live OC-2 is UNCHANGED — dropping
    consistent_with_signals from its reasoned_over is a domain call on shipped code and is NOT done here.
    ⚠️ THE RATE IS 0.9474 (18/19), AND IT IS THE FIRST NON-VACUOUS ONE IN THIS COHORT. Unlike PR-3/PR-4
    (n=2, single-valued), the spread is real: call 1 {yes 10, unknown 9}, call 2 {yes 9, no 1, unknown 9}.
    Zero calls failed (the LP-491 expired-token trap), and the abstains are STRUCTURAL, not degraded — 9 of
    the 19 files state an occupancy with NO other declaration to compare it against, so `unknown` is the
    correct answer there. input_resolves reflects the other 10, where the tag genuinely resolves.
    ⚠️ THE ONE DISAGREEMENT IS NOT NOISE, AND IT LOCATES THE WEAKNESS EXACTLY. LF-XU26 is the ONLY file in
    the corpus with an ASYMMETRIC declaration set: borrower 1 states intent-to-occupy "Yes" but carries NO
    fhasecondaryresidenceindicator, while borrower 2 carries both. Call 1 read "both intend to occupy" ->
    yes; call 2 read the missing indicator as a contradiction -> no. ⚠️ Call 2 is arguably WRONG on the
    prompt's own terms — a MISSING declaration is "missing or genuinely ambiguous", which the prompt
    assigns to `unknown`, not to `no`. So the residual risk is a FALSE CONFLICT on an incompletely-stated
    1003, which is the cheap direction and is why ratification is the right safety here.
    ⚠️ WHAT THE RATE DOES NOT SHOW: every one of the 10 answerable files states `primary_residence` with
    intent-to-occupy "Yes". THE INCONSISTENT ("no") PATH HAS NEVER BEEN OBSERVED ON A REAL FILE — the only
    "no" produced in this exercise is the disagreement above, which is probably a false positive. The rate
    measures verdict agreement between two independent derivations; it is NOT evidence of correctness, and
    a Priya-labelled measurement remains the exit (ADR-378).

AS-5:
  # LP-390-7 fail-closed check: validated MUST stay false here — AS-5 is not-calibratable-yet with a null
  # threshold, so the loader REJECTS validated:true on it (parse_bar: "only a calibratable-now rule may be
  # validated"). A mis-set flag cannot leak AS-5 live; the gate holds it even were the flag true.
  status: not-calibratable-yet
  ships: auto
  threshold: null
  validated: false
  load_bearing_ai_tags: [txn.apparent_category]
  fp_fn: "FN (accepts an undocumented gift) > FP"
  rationale: >-
    LP-390-5a: apparent_category is now MEASURED (100% concrete, n=17) — but AS-5 gates on apparent_category ==
    gift, and LF-6T3N has ZERO gift transactions (n=0 on the trigger value), AND the LP-335 / ADR-302 D2
    question stands: 'gift' is arguably a rule CONCLUSION, not a tag value. So AS-5's blocker is no longer
    'apparent_category unscored' — it is a DESIGN question (should AS-5 fire on a gift tag at all?) plus a gift
    n=0 coverage gap. Held (not calibratable) until that design call is made — not a calibration gap. No bar.

AS-6:
  # LP-429 — VALIDATED. Priya SIGNED OFF the 0.95 bar (the LP-412 pattern: her ruling IS the activation). FOUR
  # things her sign-off covers, recorded:
  # (1) HEIGHT — 0.95 (LP-397's proposal). The routing driver owner_matches_borrower measures 1.0 (11/11 after
  #     LP-402/403 added the six negative cases; was 5/5 one-sided at proposal).
  # (2) ships:auto AND THE FACT THAT CHANGED — LP-397 proposed auto but recommended RATIFY-ONLY "until a negative
  #     case is tested." That condition is NOW MET: LP-398 built six negative statements and LP-404 shows four
  #     firing correctly (N1/N3/N4/N6). The ratify caveat is satisfied, so AS-6 ships AUTO. (Structural -> auto is
  #     legal; the LP-424 kind cross-check passes.)
  # (3) WHAT THE BAR MEASURES (AS-6 is the FIRST multi-tag rule — ADR-338). Its ROUTING (fired / needs_review /
  #     satisfied) rests on owner_matches_borrower (11/11) + non_borrower_co_holder (11/11), BOTH 1.0. measured_
  #     accuracy is the min of those ROUTING DRIVERS = 1.0. The third read tag holder_name_variance (5/11 vs her
  #     exact labels, LP-403) is NOT a routing driver — so it is EXCLUDED from measured_accuracy (taking the
  #     weakest of ALL read tags, 0.45, would wrongly block a rule whose VERDICT routing is 11/11).
  #     ⚠️ CORRECTION (LP-429 review): holder_name_variance is NOT purely reason-only — the SPEC gates on it
  #     (gated_tags: [stmt.holder_name_variance]): at runtime `holder_name_variance == unknown` → AS-6
  #     COULDNT_CHECK (the name could not be compared), and only a non-unknown value lets AS-6 proceed to the
  #     owner_matches routing. So it IS verdict-affecting via the couldnt_check GATE. The 5/11 is accuracy vs
  #     Priya's exact variance CATEGORY (nickname/other/none) — the reason-string dimension; the GATE dimension
  #     is only unknown-vs-not, and its reliability is NOT separately measured here. ACCEPTED because the failure
  #     is BOUNDED and safe-direction: a false-unknown → a VISIBLE couldnt_check (never a false pass — a genuinely
  #     unreadable holder name would also leave owner_matches unknown → needs_review), and the routing verdict is
  #     owner_matches-driven at 11/11. Measuring the gate's unknown-vs-not accuracy is a follow-up refinement.
  # (4) VARIANCE RESIDUAL (LP-403) — she labeled N2 (Roberta)=nickname, P2 (Bob)=other; the AI says the reverse,
  #     and the conventional reading favours the AI (Bob is Robert's classic nickname; Roberta is a distinct given
  #     name). Affects the variance SCORE + some reason wording, NOT the routing — a known refinement AS-6 ships
  #     with (a Priya taxonomy round, its own ticket).
  status: calibratable-now
  ships: auto
  threshold: 0.95
  validated: true   # LP-429 — Priya approved 0.95, weighing the four items recorded above
  measured_accuracy: 1.0   # min of the ROUTING drivers owner_matches_borrower + non_borrower_co_holder (both 11/11)
  # The ROUTING drivers only (ADR-338). holder_name_variance is EXCLUDED from measured_accuracy — its 5/11 is
  # category (reason-string) accuracy, not a routing driver. ⚠️ It is NOT unmeasured-and-harmless, though: the
  # spec gates couldnt_check on it (gated_tags: [stmt.holder_name_variance]) — a wrong unknown-vs-not gate value
  # is a verdict effect, bounded to a VISIBLE couldnt_check (never a false verdict; see item (3) above).
  load_bearing_ai_tags: [stmt.owner_matches_borrower, stmt.non_borrower_co_holder]
  fp_fn: "FN (accepts a statement NOT owned by the borrower -> someone else's assets counted) >> FP (a false 'not the borrower's account' -> a human re-checks a legit statement)"
  rationale: >-
    LP-404 turned AS-6 into the FIRST multi-tag rule delivering Priya's surface-don't-reject ruling: owner=no ->
    fired, owner=unknown -> needs_review, co_holder=yes -> needs_review, owner=yes -> satisfied (the middle rows
    COUNT — needs_review, not fired). LP-429: Priya APPROVED the 0.95 bar and AS-6 is now validated:true. She
    signed weighing four things (recorded in the comment above): the 0.95 HEIGHT; ships AUTO because the
    ratify-only condition LP-397 attached ("until a negative case is tested") is now MET (LP-398's six negatives,
    four firing in LP-404); WHAT THE BAR MEASURES — the ROUTING drivers owner_matches_borrower + non_borrower
    _co_holder (both 11/11 = 1.0), NOT holder_name_variance (5/11 category accuracy), the first multi-tag
    precedent (ADR-338). NB (LP-429 review) holder_name_variance is the spec's couldnt_check GATE, not reason-
    only — a wrong gate value is bounded to a visible couldnt_check, never a false verdict (see the comment
    above); and the N2/P2 variance taxonomy RESIDUAL (a refinement it ships with). ⚠️ SYNTHETIC-DATA basis:
    the 4-fired/5-needs_review/2-satisfied proof is on the LP-401 fixture (constructed), and the 5 REAL LF-6T3N
    statements are all `yes` (the FP direction) — the negative FN direction is proven only on synthetic cases. ⚠️
    D5 COVERAGE GAP: stmt_facts runs only on bank_statement/money_market, so investment/brokerage statements are
    NOT ownership-checked at all (its own ticket — widen stmt_facts' applicability). Validating this bar ACTIVATES
    the rule (LP-393-6 coupling) — the sign-off IS the activation.

FR-5:
  # LP-547 — BUILT, HELD ON MEASUREMENT. The blocker this file recorded for FR-5 is GONE: "its declared
  # 'pattern across statements' is unanswerable from a context that shows one transaction" was true of
  # an AI group, and LP-546 answered it with a deterministic producer that sees the whole snapshot. So
  # `txn.is_recurring` is now a COUNT — no model, no calibration round, no per-transaction call.
  #
  # WHAT REMAINS UNMEASURED is the rule's own judgment, and one input it leans on. `txn.apparent_category`
  # is an AI tag and `debt_payment` is one of its twelve values; nothing has scored how reliably it tells
  # a creditor payment from a utility or a subscription, which is the single distinction this rule rests
  # on. A self-consistency round over constructed cases with a full three-value spread is the same gate
  # every other judgment rule passed, and it has not been run.
  #
  # ⚠️ THE MEASUREMENT WILL NOT SETTLE THE THING THAT MATTERS MOST. On the only corpus that carries bank
  # statements (ONE loan file, LP-543) every recurring creditor payment is already disclosed on the 1003,
  # so this rule would fire four times and add nothing. That is a statement about one compliant borrower,
  # not about the rule — a debt that is undisclosed is by construction absent from the file we would
  # measure against. Do not read a quiet result on that corpus as evidence the rule is unnecessary.
  # LP-551 — MEASURED AND ACTIVATED. Held at not-calibratable-yet until it had a rate; it now has one,
  # taken AFTER `txn.stated_liability_match` joined the judgment context. The earlier 1.0000 (LP-547,
  # same cases, no comparison tag) is NOT the number recorded here: adding a predicate changes what
  # reaches the model, and carrying a rate measured against a different context forward is the
  # stale-number habit LP-496a exists to warn about. Both runs agreed 5/5; only the second describes
  # the rule as it ships.
  status: ratify-pending
  self_consistency_rate: 1.0000
  self_consistency_cases: 5
  self_consistency_disagreements: 0
  self_consistency_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  self_consistency_date: "2026-08-18"
  input_resolves: true
  measured_accuracy: null
  ships: ratify
  threshold: null
  validated: false
  load_bearing_ai_tags: [txn.apparent_category]
  fp_fn: >-
    FP > FN, INVERTED FOR THIS COHORT and following FR-3's bar. A fraud-adjacent finding names a person:
    a false "this looks like an undisclosed obligation" costs a borrower and a processor real time and
    trust, while a missed one costs a review a human was going to do at underwriting anyway. So the rule
    surfaces rather than asserts — needs_review only, never fired, and an unreadable payee abstains
    instead of being read as clean.
  rationale: >-
    THE ONLY RULE THAT READS MONEY OUT. All three active transaction rules scope `txn.is_money_in eq in`,
    so on the file that exposed this 41 withdrawals were never looked at while 10 deposits produced five
    findings. A debt visible only as a recurring bank debit — a private or family loan, a rent-to-own,
    anything not reported to the bureaus — is invisible today, and it is the category most likely to be
    undisclosed.
    IT CANNOT SEE THE DISCLOSED DEBTS, AND ITS WORDING SAYS SO. `_build_context` hands a judgment rule the
    SUBJECT's tags and nothing else, so the file's stated liabilities are out of reach from a transaction
    subject. The rule therefore asks what it can answer — is this recurring payment to an apparent creditor
    shaped like a monthly obligation — and asks the PROCESSOR to reconcile it against the 1003. The prompt
    forbids the words undisclosed, unreported and hidden for that reason. Closing the gap properly needs a
    loan-level tag carrying the payee-versus-stated-liability comparison, which is a vocabulary addition
    and therefore the domain expert's call.
    NO THRESHOLD, deliberately. A recurring $40 debit is a subscription and a recurring $450 debit is a car
    payment, but unlike the deposit floor there is no agency text to derive the line from, so the rule
    surfaces every recurring creditor payment and the ratifying human weighs an amount already in front of
    them.

AS-7:
  status: not-calibratable-yet
  ships: auto
  threshold: null
  validated: false
  load_bearing_ai_tags: [txn.is_nsf_or_overdraft]   # via the derived stmt.nsf_count — chain VERIFIED (LP-497)
  fp_fn: "FP (a false NSF flag) > FN, low stakes"
  rationale: >-
    Chain VERIFIED end to end (LP-497): txn.is_nsf_or_overdraft (AI, its own statement-scoped txn_nsf
    group) -> stmt.nsf_count (derived, _stmt_nsf_count) -> AS-7. Both producers exist and the aggregator
    already abstains rather than reporting 0 when the tag is on no transaction, and when ANY transaction
    reads "unknown" (a count that could be an undercount is not asserted).
    HELD FOR TWO INDEPENDENT REASONS, neither of them calibration.
    (1) THE ENUM DEFECT, unfixed. txn.is_nsf_or_overdraft is declared ["yes","no"] while its prompt
    offers "unknown", so _build_tag coerces an honest abstain to confidence=None — exactly the marker
    _scan_tag_degradations matches (value=="unknown" + produced_by==AI + confidence is None) — flipping
