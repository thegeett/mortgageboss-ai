# DOMAIN (Priya, Aug 2026): see docs/domain/priya-rulings-2026-08.md — Ruling 5 (reserve eligibility — the retirement haircut is AGENCY-SPECIFIC; no blanket 60/70%). Recorded LP-456; NOT yet implemented.
rule_id: AS-4
name: Reserves adequacy
category: Assets
kind: calculative        # rule_kinds.csv: AS-4 = calculative
numeric_check: true
criteria: >-
  The loan file's reserve-eligible assets, expressed in months of PITIA, must meet the reserve requirement
  for this loan's occupancy/property. Fewer months than required means the file lacks adequate reserves.
  The requirement is a MATRIX — this encodes B3-4.1-01's occupancy × unit-count cells: none for a
  one-unit principal residence, 2 months for a second home, and 6 months for a two- to four-unit
  principal residence or an investment property. An un-encoded cell, an absent occupancy, and a
  principal residence whose unit count is unknown all yield couldnt_check, never a guessed requirement
  — for that last cell the answer is 0 or 6 months and nothing between, so a default would decide the
  verdict rather than inform it.
applicability:
  scope: the loan file's reserve-eligible assets and its reserve requirement
  trigger: once per loan, comparing reserve months available to months required
required_inputs:
  - name: months_available
    snapshot_path: 'calculations.reserves.value["months_available"]'
    description: reserve-eligible assets in months of PITIA (the wired reserves calculator — gated → couldnt_check)
  - name: required_months
    snapshot_path: 'tags.by_subject["loan"]["reserves.required_months"]'
    description: >-
      the required reserve months, selected from occupancy AND financed unit count (derived, LP-497;
      abstains on an unknown occupancy, an unknown unit count for a principal residence, and any
      property above four units)
reference_values:
  priya_validated: false
  # LP-497 — dropped to false. Every encoded cell is TIER P, read from Fannie's own B3-4.1-01 page
  # (dated 08/07/2024, fetched 2026-08-13). Nothing here is a recalled or secondary figure, so there is
  # no pending threshold for an expert to sign off; the cells that are NOT encoded abstain rather than
  # waiting under a bar.
  threshold_needs_signoff: false
  values:
    # A test pins all five against the recipe constants.
    reserve_months_one_unit_primary: "0"
    reserve_months_second_home: "2"
    reserve_months_multi_unit_primary: "6"
    reserve_months_investment: "6"
    reserve_max_residential_units: "4"
  guideline_text: >-
    There is no minimum reserve requirement for one-unit principal residence transactions. A second
    home requires two months' reserves. A two- to four-unit principal residence, an investment
    property, or a cash-out refinance with a DTI over 45% requires six months' reserves. Where the
    borrower owns other financed properties, additional reserves of 2% (1-4 properties), 4% (5-6) or
    6% (7-10, DU only) of the aggregate unpaid principal balance are required (Fannie Mae Selling
    Guide B3-4.1-01, Minimum Reserve Requirements, page dated 08/07/2024).
subject_enumeration: loan
subject_key_fields:
  - loan
evidence_required: >-
  The reserve months available (from the calculator) and the months required, WITH the occupancy and
  unit count that selected the requirement — so a processor can see which B3-4.1-01 cell applied. A
  `satisfied` must not be read as "every reserve requirement is met": the financed-property overlay is
  not evaluated (see below), so the finding names what was checked.
guideline_reference: "Fannie Mae Selling Guide B3-4.1-01 (Minimum Reserve Requirements)."
# LP-541 — the documents this rule's inputs come from, for read-time grouping of a couldnt_check
# into "request this" vs "read what is already here". Each entry is a group of ALTERNATIVES (any
# one satisfies it); every group must be satisfied. Nothing in evaluation reads this.
requires_documents:
  - [bank_statement]
  - [retirement_account, brokerage_statement, investment_account]

spec_version: 1
deterministic:
  load_bearing_tags:
    - reserves.required_months
  gated_tags:
    - reserves.required_months
  operands:
    months_available: {calc: [reserves, months_available]}
    required_months: {tag: reserves.required_months}
  outcomes:
    - verdict: fired
      # A GATED reserves calc → the operand is None → couldnt_check (the LP-318 path, generic since
      # LP-324) — never a fabricated adequacy. required_months "unknown" (a Priya-pending cell) → the gate
      # → couldnt_check. So AS-4 fires ONLY on a real, computed shortfall.
      when_compare: {op: "<", left: months_available, right: required_months}
      reasoning: >-
        reserves cover {months_available} months but {required_months} months are required for this
        occupancy — the file lacks adequate reserves
      how_to_fix: >-
        Document additional reserve-eligible assets, or confirm the reserve requirement for this
        occupancy/property is correctly applied.
    - verdict: satisfied
      default: true
      # NOT a blanket all-clear, and the wording is deliberate. B3-4.1-01 also requires reserves of
      # 2%/4%/6% of aggregate UPB when the borrower owns other financed properties, and 6 months for a
      # cash-out refinance over 45% DTI. Neither the financed-property count nor the aggregate UPB
      # reaches the snapshot, so neither overlay is evaluated. Both can only RAISE the requirement, so
      # this verdict is scoped to what was actually checked.
      reasoning: >-
        reserve months available meet or exceed the {required_months} months required for this
        occupancy and unit count
