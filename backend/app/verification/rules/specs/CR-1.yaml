# CR-1 — Undisclosed liability — AI structural rule SPEC (LP-490). ⚠️ BUILDS INERT.
#
# ⚠️ INERT BY DESIGN, NOT BY OVERSIGHT. CR-1 gates on `liab.in_application`, an AI tag with NO measured
# accuracy. Its bar is `not-calibratable-yet`, for which `is_eligible()` returns False (LP-484), so CR-1
# is NOT in ACTIVE_RULE_IDS and does not run on a live file. The deliverable is a correct, CALIBRATABLE
# build; scoring is a later run against it.
#
# ⚠️ ONE MATCHER, TWO VIEWS — the reason this spec adds no producer of its own. LP-483 built the
# comparison once, as the `credit_profile` AI group on the LIABILITY subject (ADR-375). CR-1 reads that
# per-liability judgment DIRECTLY, so the finding names WHICH debt; CR-4 reads
# `credit.undisclosed_tradeline`, a deterministic borrower-level rollup OVER THE SAME TAG. Writing a
# second matcher here would let CR-1 and CR-4 disagree about one file — the thing a shared source of
# truth exists to prevent. `test_cr1_and_cr4_cannot_disagree` pins it.
#
# ⚠️ THE DIRECTION THIS RULE CHECKS. CR-1 asks, of each tradeline the CREDIT REPORT reports: is this debt
# on the application? A MISMO STATED liability with no matching tradeline is the REVERSE direction and is
# NOT a CR-1 finding — the applicability predicate below scopes the subject set to
# `credit_report_reported` so a stated-only liability produces no finding at all, rather than a
# permanent, unfixable couldnt_check. That is CR-12's lesson (LP-486): a file with 8 stated liabilities
# produced 8 unanswerable couldnt_checks before its predicate was added.
#
# ⚠️ THE FAILURE DIRECTION IS TWO-SIDED, and whoever sets the bar must weigh both. A false MATCH hides a
# real undisclosed debt — Priya's #1 source of underwriting conditions and the reason this rule exists.
# A false NON-MATCH fabricates a condition on a clean file and sends a processor chasing a debt that was
# always disclosed. Neither is the safe direction; the prompt says so in those words.
#
# ⚠️ MATCHING HAS NO ACCOUNT NUMBER TO WORK WITH. The MISMO side carries only type, monthly_payment,
# unpaid_balance and holder_name — no account number — so the match rests on name, amounts and type.
# Names differ by convention ("NR/SMS/CAL" against "PENNYMAC LOAN SERVICES"), which is precisely the
# narrow judgment the AI is asked for, one pair at a time.

rule_id: CR-1
name: Undisclosed liability (MISMO vs app)
category: Credit

kind: structural            # must equal rule_kinds.csv (CR-1 = structural, ai_fuzzy_match)
numeric_check: false        # must equal rule_kinds.csv

criteria: >-
  Every payment-bearing debt the credit report reports must be reflected in the liabilities stated on the
  application, or documented as excluded. This reads the per-liability AI judgment liab.in_application —
  one narrow question per tradeline, "is this debt on the application?" — so the finding names the
  specific debt rather than the borrower. A tradeline the AI cannot resolve against the stated
  liabilities resolves to couldnt_check on that debt alone; the rule does not need to be certain about
  every debt to be useful on the others.

applicability:
  scope: each credit-report tradeline
  trigger: >-
    Any tradeline reported on a credit report in the file. A file with no credit report yields no
    tradeline subjects. A MISMO stated liability is out of scope — CR-1 checks report-against-application,
    not the reverse.

reference_values:
  priya_validated: false          # must equal rule_kinds.csv
  threshold_needs_signoff: false  # must equal rule_kinds.csv — a match judgment, not a threshold
  values: {}
  guideline_text: >-
    All of the borrower's debts must be reflected in the application so the qualifying ratios are
    complete. A debt the credit report reports but the application omits changes the debt-to-income
    picture, and is one of the most common sources of an underwriting condition. Where a debt is
    genuinely excludable — paid by another party, a duplicate of a stated liability, or closed — that
    exclusion is documented rather than assumed.

required_inputs:
  - name: in_application
    snapshot_path: 'tags.by_subject[<tradeline row_id>]["liab.in_application"]'
    description: >-
      whether THIS tradeline is reflected in the application's stated liabilities (AI, LP-483, the
      `credit_profile` group on the liability subject): "yes" / "no", or "unknown" when the match cannot
      be determined. ⚠️ UNCALIBRATED — no measured accuracy, which is why CR-1 is inert.

subject_enumeration: per_liability   # LP-480 — one subject per tradeline row (and per stated liability)
subject_key_fields: [liability]

evidence_required: >-
  The tradeline's creditor, balance and monthly payment, and the stated liabilities it was compared
  against — inline on the finding, so a processor can settle a naming-convention difference without
  reopening the report.

guideline_reference: "Fannie Mae Selling Guide B3-6-02 (Debt-to-Income Ratios) — all of the borrower's debts must be reflected in the qualifying ratios; an omitted liability is reconciled against the credit report before submission."

# LP-541 — the documents this rule's inputs come from, for read-time grouping of a couldnt_check
# into "request this" vs "read what is already here". Each entry is a group of ALTERNATIVES (any
# one satisfies it); every group must be satisfied. Nothing in evaluation reads this.
requires_documents:
  - [credit_report]

spec_version: 1

# The MACHINE-READABLE body (LP-324). An "unknown" tag coerces through the gate to couldnt_check BEFORE
# this body runs, so an unresolvable pair can never reach the default and read as disclosed.
deterministic:
  # ⚠️ SCOPE THE SUBJECT SET — CR-12's lesson. per_liability UNIONS credit-report tradelines with the
  # application's MISMO stated liabilities, and only the report leg has an "is this on the application?"
  # question to answer. Without this predicate every stated liability became a permanent, unfixable
  # couldnt_check. This narrows the SUBJECTS, never the abstain: a tradeline the AI could not resolve
  # still gates to couldnt_check.
  applicability:
    tag: liability.source
    op: eq
    value: credit_report_reported
  load_bearing_tags:
    # LP-556 — provenance only, NOT gated: it names WHICH debt this finding is about. Gating on it
    # would make a liability with no holder name abstain instead of being evaluated.
    - liab.creditor_name
    - liab.monthly_payment  # LP-563 — what Apply writes into the DTI (provenance, not gated)
    - liab.in_application
  # LP-563 — what Apply writes: the undisclosed liability, added to the application. This is the
  # canonical interlock example — a debt the file carries and the 1003 does not, so the DTI recomputes
  # HIGHER once it lands, which is the conservative direction every apply moves.
  #
  # `holder_name` names WHICH debt (LP-556's tag) and `monthly_payment` is what the DTI reads. A
  # subject missing either resolves to no apply at all rather than creating a debt with no payment.
  apply:
    action: add_liability
    fields:
      holder_name: {tag: liab.creditor_name}
      monthly_payment: {tag: liab.monthly_payment}
  gated_tags:
    - liab.in_application
  operands: {}
  outcomes:
    - verdict: fired
      when_tags:
        - {tag: liab.in_application, op: eq, value: "no"}
      reasoning: >-
        the credit report reports this debt but the application does not state it — an undisclosed
        liability that changes the debt-to-income picture
      how_to_fix: >-
        Add the liability to the 1003, or document why it is excluded — paid by another party with
        twelve months of proof, a duplicate of a liability already stated, or a closed account. Then
        re-check the debt-to-income ratio, which this debt's payment will move.
    - verdict: satisfied
      when_tags:
        - {tag: liab.in_application, op: eq, value: "yes"}
      reasoning: >-
        this debt is reflected in the liabilities stated on the application
    - verdict: couldnt_check
      # ⚠️ THE CATCH-ALL IS AN ABSTAIN, NOT A PASS. A `satisfied` default would read an unresolvable
      # pair as "disclosed" — the false match that hides the undisclosed debt this rule exists to catch.
      default: true
      reasoning: >-
        this debt could not be matched against the application's stated liabilities — the creditor
        naming, the amounts, or the account type did not resolve clearly enough to decide
      how_to_fix: >-
        Compare this tradeline with the stated liabilities by hand. Creditor names commonly differ
        between the report and the application (a servicer's abbreviation against the full legal name),
        so match on the balance and monthly payment as well as the name.
