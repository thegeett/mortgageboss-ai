rule_id: AS-2
name: Earnest money deposit sourcing
category: Assets
kind: structural
numeric_check: false
criteria: >-
  An earnest-money deposit paid from the borrower's funds must be sourced (traceable to a verified
  account). An unsourced EMD may be undisclosed borrowed funds. NOTE (LP-323-AS-B): the true shape is a
  cross-document MATCH (contract EMD amount ↔ a debit) which is not cleanly expressible today; this
  approximates it via the AS-1 txn sourcing vocabulary and is reported for -C.
applicability:
  scope: the loan file's bank-statement transactions
  trigger: per transaction, on earnest-money / large outflows and their sourcing
required_inputs:
  - name: has_identified_source
    snapshot_path: tags.by_subject[<txn content_id>]["txn.has_identified_source"]
    description: whether the transaction has a traceable source (AI, reused from AS-1)
  - name: apparent_category
    snapshot_path: tags.by_subject[<txn content_id>]["txn.apparent_category"]
    description: the transaction category (AI, reused from AS-1)
reference_values:
  priya_validated: false
  threshold_needs_signoff: false
  guideline_text: >-
    Fannie Mae Selling Guide B3-4.2-02 — an earnest-money deposit must be sourced from verified funds.
    Agency-default; confirm the EMD sourcing requirements with Priya.
subject_enumeration: per_deposit
subject_key_fields:
  - account
  - date
  - amount
evidence_required: the earnest-money transaction and whether its source is traceable
guideline_reference: "Fannie Mae Selling Guide B3-4.2-02 (Earnest money)."
# LP-541 — the documents this rule's inputs come from, for read-time grouping of a couldnt_check
# into "request this" vs "read what is already here". Each entry is a group of ALTERNATIVES (any
# one satisfies it); every group must be satisfied. Nothing in evaluation reads this.
requires_documents:
  - [bank_statement]

spec_version: 1
deterministic:
  load_bearing_tags:
    - txn.is_money_in
    - txn.has_identified_source
    - txn.apparent_category
    # LP-555 — PROVENANCE ONLY, deliberately NOT in `gated_tags`. The read path builds a transaction
    # subject's label from its inline tags, and without an amount every finding on this rule reads
    # "a transaction" — AS-12 shipped nine distinct deposits as nine identical rows that way, and four
    # passes and five reviews looked like the same item in two buckets. Gating on them instead would be
    # the wrong fix: a transaction with no parsed date would then ABSTAIN rather than be evaluated.
    # `txn.source_strength` on AS-1 is the precedent — carried for provenance, never gated.
    - txn.amount
    - txn.date
  gated_tags:
    - txn.is_money_in
    - txn.has_identified_source
  # LP-509-A1: `per_deposit` enumerates one subject per bank-statement TRANSACTION, not per deposit,
  # so without this the rule asked "the deposit's source could not be found" of a Geico premium, an
  # AT&T bill and an ATM fee — 57 subjects where 10 are money-in. AS-1 has gated on this since it was
  # written; AS-2 and AS-12 were the two that never did. != in → not_applicable; absent/unknown →
  # couldnt_check (the §8 honesty contract: scope-false must never absorb data-missing).
  # LP-517: a CONJUNCTION — money-in AND a purchase. Earnest money is a purchase concept; a refinance
  # has none, so AS-2 was checking earnest-money sourcing on loans that cannot have any. LP-509-A5 named
  # this ("AS-2 shares this root cause") and scoped PC-2/PC-3/PC-7 but not AS-2. On the first real file —
  # a refinance — it produced 10 `satisfied` findings for a check that does not apply, which is false
  # assurance rather than noise: a processor reading "satisfied" is told earnest-money sourcing was
  # verified on a loan with no earnest money.
  #
  # ⚠️ Refinance scoping is NOT symmetric across the assets family, and the guide is explicit. B3-4.2-02
  # waives large-deposit DOCUMENTATION on a refinance but expressly RETAINS the borrowed-funds duty:
  # "the lender remains responsible for ensuring that any borrowed funds, including any related
  # liability, are considered". So AS-12 (borrowed funds) must NOT be scoped out of refinances — only
  # the documentation-shaped checks are. Scoping AS-2 out and leaving AS-12 in is the guideline, not an
  # inconsistency.
  #
  # Either predicate DEFINITELY false -> not_applicable; either absent/unknown -> couldnt_check.
  applicability:
    - {tag: txn.is_money_in, op: eq, value: in}
    - {loan_tag: loan.purpose, op: eq, value: purchase}   # LOAN-level: AS-2 is per-deposit
  outcomes:
    - verdict: fired
      when_tags:
        - {tag: txn.apparent_category, op: eq, value: loan_proceeds}
        - {tag: txn.has_identified_source, op: ne, value: "yes"}
      reasoning: an earnest-money / large outflow appears to be from an unverified (possibly borrowed) source
      how_to_fix: Source the earnest-money deposit to a verified account (a debit from the borrower's own funds).
    - verdict: satisfied
      default: true
      reasoning: the earnest-money deposit is sourced from verified funds
