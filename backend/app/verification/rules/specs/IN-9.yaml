rule_id: IN-9
name: Future employment (offer letter)
category: Income
kind: structural         # rule_kinds.csv: IN-9 = structural, exact_match=true (deterministic_only)
numeric_check: false
criteria: >-
  Income from FUTURE employment must be supported by an offer/employment letter with a start date.
  Scoped to offer-letter documents (LP-329): an offer-letter document without a valid start-date offer
  fires. A file with no offer-letter document is not_applicable (future employment is the exception, not
  every file has it) — the conditional-on-future-employment scoping is a deferred refinement (IN-B).
applicability:
  scope: the loan file's offer-letter / future-employment documents
  trigger: once per offer-letter document
required_inputs:
  - name: offer_letter_present
    snapshot_path: tags.by_subject[<offer content_id>]["income.offer_letter_present"]
    description: whether an offer letter with a start date is present (yes/no/n/a)
reference_values:
  priya_validated: false
  threshold_needs_signoff: false
  guideline_text: >-
    Fannie Mae Selling Guide B3-3.3-03, Employment Offers or Contracts (page dated 03/04/2026) — income
    from employment that begins AFTER the loan closes may be used only with a fully executed offer or
    contract identifying the employer, the borrower, the position, the pay type/rate and the START DATE,
    plus a verbal VOE. Two paths: with a paystub obtained before loan delivery (purchase, principal
    residence, one-unit, start date within 30 days before to 90 days after the note date), or without
    one, which additionally requires a non-contingent offer, Special Feature Code 707, and either six
    months' PITIA reserves or resources covering liabilities plus PITIA from the note date through the
    start date plus one month. The offer letter's monthly income amount is the qualifying income.
subject_enumeration: per_document
subject_key_fields:
  - content_id
evidence_required: whether an offer letter with a start date is present for future employment
guideline_reference: "Fannie Mae Selling Guide B3-3.3-03, Employment Offers or Contracts (page dated 03/04/2026) — offer/contract with a start date for employment beginning after closing. Supersedes the former B3-3.1-09 citation, which does not resolve: B3-3.1 now ends at -04, and offer-letter employment moved to the B3-3.3 family."
spec_version: 1
deterministic:
  applicability:
    tag: document.document_type
    op: eq
    value: employment_offer_letter  # LP-333: the classifier emits "employment_offer_letter"
  load_bearing_tags:
    - income.offer_letter_present
  gated_tags:
    - income.offer_letter_present
  outcomes:
    - verdict: fired
      when_tags:
        - {tag: income.offer_letter_present, op: eq, value: "no"}
      reasoning: future employment is claimed but a valid offer letter with a start date is not present
      how_to_fix: >-
        Obtain an offer/employment letter stating the position and start date (and confirm the program's
        future-income conditions, e.g. a paystub before or shortly after closing).
    - verdict: satisfied
      default: true
      reasoning: an offer letter with a start date is present for the future employment
