# PC-7 — Closing date realistic / current — DETERMINISTIC structural rule SPEC (LP-406-1b).
#
# LP-406-1 STOPPED PC-7 at Phase 0: its "closing date vs today" check needed a `today` operand the resolver
# has no source for. LP-410 built the derived loan-level tag contract.days_until_closing — a SIGNED integer
# (positive = future, negative = the closing date has PASSED, "unknown" = no parseable/agreed closing date).
# PC-7 is now a deterministic rule that compares that NUMBER to a window (the IN-2 number-vs-threshold shape).
#
# ⚠️ UNLIKE AS-8 / IN-6, this rule compares a NUMBER to a THRESHOLD (it uses the operand path, not an enum
# branch), and its window is TWO-SIDED with ASYMMETRIC meaning (LP-406-1b D2, ADR-326):
#   * PAST side  — the closing date is BEHIND the file date. A purchase cannot close in the past, so this is a
#                  finding at (almost) any magnitude. Fires when days_until_closing < min_days_until_closing
#                  (default 0 → any strictly-past date fires). ⚠️ SIGNED BOUND, NOT a "grace count": to
#                  TOLERATE a closing up to N days past, LOWER the bound to -N (e.g. -2), never set a positive
#                  value (a positive bound would fire on realistic NEAR-FUTURE closings, e.g. 0/1 days out).
#   * FUTURE side — a closing date implausibly far ahead is premature for a file in pre-submission processing.
#                  Fires when days_until_closing > max_days_until_closing (default 90).
# BOTH windows are DEFENSIBLE DEFAULTS, PRIYA'S TO DECIDE — the rule ships with its bar HELD (pending her
# sign-off, activation_bars.yaml). The window lives HERE, never in the tag (LP-410 left it out — tags describe,
# rules judge). WHAT PRIYA MUST DECIDE (plain language): (1) is a closing date even 1-2 days in the past
# acceptable (a timing grace), or does ANY past date warrant a flag? (2) how many days ahead is "unrealistically
# far" for a file still in processing — 90? 120?
#
# SCOPE (D4) — RESOLVED by LP-509-A5. This used to read: "PC-7 is LOAN-WIDE, not applicability-scoped. There is
# NO loan-purpose / transaction-type tag to scope it purchase-only, so a REFINANCE (which has no purchase
# agreement → no contract.closing_date → contract.days_until_closing == 'unknown') resolves to COULDNT_CHECK,
# not not_applicable. That is honest ... but not ideal; a loan.purpose tag would let a refi be not_applicable
# instead (a reported gap — LP-406-1b)." LP-424 declared that tag and deferred wiring it for want of a
# refinance fixture; LF-WCHG supplied one, where the missing scope produced a live false finding. The
# `applicability` predicate in the deterministic block below is the fix.
#
# REGISTRY DRIFT (mirrors AS-8/IN-6): rule_tags.csv maps PC-7 -> contract.closing_date (the Phase-0 planned
# input), NOT contract.days_until_closing. The evaluator uses THIS spec; reconcile the row upstream in the xlsx.

rule_id: PC-7
name: Closing date realistic/current
category: Contract

kind: structural          # must equal rule_kinds.csv (PC-7 = structural, deterministic_only)
numeric_check: false      # a date-window comparison, not a ratio (mirrors rule_kinds numeric_check=false)

criteria: >-
  The purchase contract's closing date must be CURRENT and REALISTIC for a file in pre-submission processing:
  not already in the PAST (a purchase cannot close before the file date — the date moved and the contract was
  not updated, or it expired), and not implausibly FAR in the future (premature for a file being processed).
  This compares the derived contract.days_until_closing (signed days from the file date to the closing date)
  against a two-sided window. Both window sides are DEFAULTS pending the domain expert: how many days in the
  past (if any) are tolerated, and how many days ahead is "too far". Absent/unparseable closing date →
  couldnt_check, never a guessed pass.

applicability:
  scope: the loan's purchase-contract closing date vs the file (snapshot) date
  trigger: >-
    Evaluated once per loan, comparing contract.days_until_closing to the past/far-future window. A file with
    no contract closing date (e.g. a refinance, or a missing purchase agreement) couldnt_checks — there is no
    loan-purpose tag to scope it not_applicable (a reported gap).

required_inputs:
  - name: days_until_closing
    snapshot_path: 'tags.by_subject["loan"]["contract.days_until_closing"]'
    description: >-
      signed days from the file (snapshot) date to the loan's closing date (derived, LP-410): positive =
      future, negative = the closing date has passed, "unknown" = no parseable/agreed closing date.

# The two window sides are DATA (reference values), each a DEFAULT flagged for Priya. priya_validated /
# threshold_needs_signoff mirror rule_kinds.csv (both false — the CSV predates PC-7 carrying a window; the
# ACTIVATION bar, not this field, is what holds PC-7 pending her sign-off, see activation_bars.yaml + D7).
reference_values:
  priya_validated: false
  threshold_needs_signoff: false
  values:
    # SIGNED days-until-closing BOUNDS (not directional day-counts): the PAST outcome fires below min, the
    # FAR-FUTURE outcome fires above max. For an N-day past grace set min to -N (e.g. -2); a POSITIVE min
    # would wrongly fire on near-future closings (LP-406-1b review). Both are Priya's defaults to confirm.
    min_days_until_closing: "0"   # fire the PAST outcome when days_until_closing < 0 (any strictly-past date)
    max_days_until_closing: "90"  # fire the FAR-FUTURE outcome when days_until_closing > 90. Priya: 90 / 120 / …?
  guideline_text: >-
    Loan-processing documentation standard — the purchase contract's closing date must be current (not passed)
    and realistic for a file in pre-submission processing. The min (default 0) and max (default 90)
    days-until-closing bounds are DEFAULTS pending the domain expert's confirmation.

subject_enumeration: loan          # contract.days_until_closing is produced at the loan subject (LP-410 / D1)
subject_key_fields: [loan]

evidence_required: >-
  The signed days from the file date to the closing date, and which side of the window it fell outside (past
  or far-future) — inline on the finding.

guideline_reference: "Loan-processing documentation standard — the purchase-contract closing date must be current (not passed) and realistic; the past-grace and far-future windows are Priya-pending."

# LP-541 — the documents this rule's inputs come from, for read-time grouping of a couldnt_check
# into "request this" vs "read what is already here". Each entry is a group of ALTERNATIVES (any
# one satisfies it); every group must be satisfied. Nothing in evaluation reads this.
requires_documents:
  - [purchase_agreement]
  - [closing_disclosure]

spec_version: 1

# LP-324 — the MACHINE-READABLE deterministic body (the generic evaluator runs THIS, zero per-rule Python).
# The NUMBER-vs-THRESHOLD (operand) path, not an enum branch. contract.days_until_closing "unknown" → the
# operand coerces to None → couldnt_check (the gate catches it first, over gated_tags). TWO fired outcomes with
# DIFFERENT reasons (past vs far-future are different problems for a processor), ordered first-match-wins.
deterministic:
  # LP-608 — see AS-4. The closing date can come from either document, so both are named rather than
  # presuming which one the file will have.
  # LP-610 — the second branch. PC-7's two document groups are ALTERNATIVES for one fact — the
  # closing date comes from the purchase agreement OR the Closing Disclosure — not two sides of a
  # comparison like the other eight. "Upload only the other" would be wrong here: neither is owed
  # once one is present. See AS-4 for why the alternative must live in the template at all.
  couldnt_check_fix: >-
    Upload the purchase agreement stating the contract closing date, or the Closing Disclosure or
    settlement statement if one has been issued. The closing date is taken from whichever of the two
    the file carries, and measured against the file date.
    Either document answers this, so if one of them is already in the file nothing further is
    needed for the date.
  load_bearing_tags:
    - contract.days_until_closing
  gated_tags:
    - contract.days_until_closing
  # LP-509-A5: PURCHASE-ONLY — see PC-2. The spec's own SCOPE note said "there is NO loan-purpose /
  # transaction-type tag to scope it purchase-only, so a REFINANCE … → couldnt_check". There is one
  # now (LP-424 declared `loan.purpose`), and this is it being wired.
  applicability: {tag: loan.purpose, op: eq, value: purchase}
  operands:
    days: {tag: contract.days_until_closing}       # signed days (decimal); negatives coerce cleanly (D3)
    min_days: {reference: min_days_until_closing}  # signed lower bound (fire the PAST outcome below it)
    max_days: {reference: max_days_until_closing}  # signed upper bound (fire the FAR-FUTURE outcome above it)
  outcomes:
    - verdict: fired
      # PAST: the closing date is behind the file date (days < min_days, default 0 → any strictly-past date).
      when_compare: {op: "<", left: days, right: min_days}
      reasoning: >-
        the loan's closing date has already passed — it is {days} day(s) from the file date; a purchase
        cannot close in the past, so confirm the current closing date with the borrower or settlement agent
      how_to_fix: >-
        Obtain the updated purchase contract (or an addendum) with the current closing date, or confirm the
        loan is closing on the stated date.
    - verdict: fired
      # FAR FUTURE: the closing date is implausibly far ahead (days > max_days, default 90).
      when_compare: {op: ">", left: days, right: max_days}
      reasoning: >-
        the loan's closing date is {days} day(s) out — unusually far ahead for a file in processing; confirm
        the closing date on the contract is current and not a stale or placeholder date
      how_to_fix: >-
        Confirm the contract's closing date is current; if the file will not close for that long, verify the
        timeline with the borrower or settlement agent.
    - verdict: satisfied
      default: true
      reasoning: >-
        the loan's closing date sits in a realistic window ahead of the file date
