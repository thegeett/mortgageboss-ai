# LO-2 — Letter of explanation completeness — DETERMINISTIC structural rule SPEC (LP-495a).
#
# A letter of explanation an underwriter can rely on states WHAT is being explained, WHEN it happened, and
# carries the borrower's SIGNATURE. LO-2 reads those three legs off the letter's own extracted fields.
#
# ⚠️ THE APPROVED BUILD DIRECTIVE SAID "explanation_summary + referenced_date + borrower_signature_present,
# document_type-scoped across ALL SIX LOX TYPES". THOSE THREE FIELDS EXIST ON EXACTLY ONE OF THEM, and
# building the rule as written would have produced a false finding on most letters in the corpus. Verified
# against every extractor in app/ai/extraction/ AND against the bench corpus (not one query — LP-494's
# lesson and LP-495a's own):
#
#     document type                     docs  has the three legs?
#     letter_of_explanation                9  ALL THREE — summary 9/9, referenced_date 6/9, signature 7/9
#     letter_of_explanation_misc           9  NO — issue_orquestion / reason_or_cause / signature_date
#     letter_of_explanation_asset          7  NO — source_or_origin_of_funds / letter_date
#     letter_of_explanation_property       7  NO — reason_or_cause / letter_date / signature_date
#     letter_of_explanation_income         2  NO — reason_or_cause / letter_date / signature_date
#     letter_of_explanation_child_care     0  NO — no_expense_reason / letter_date
#     credit_explanation_letter            4  ⚠️ NO EXTRACTOR AT ALL (bench status: `no_extractor`)
#     application_loe                      0  signature only — no summary, no referenced_date
#
# ⚠️ PHASE A'S MEASURED "9/34 · 6/34 · 7/34" ARE CORRECT, BUT THEIR DENOMINATOR IS THE WHOLE FAMILY WHILE
# THEIR NUMERATOR CAN ONLY COME FROM THE 9 BASE LETTERS. Read as a sparse fill across 34 letters they
# invite a rule that reports 25 of 34 incomplete; read correctly they are 9/9, 6/9 and 7/9 on the only
# type whose extractor HAS the fields. Same shape of error as LP-494's CO-3 drop and LP-495a's own RE-1 /
# DT-6 drop: a number trusted without checking what its denominator ranged over.
#
# The other types' fields are NOT aliased onto the three legs, deliberately. `letter_date` is when the
# letter was WRITTEN; `referenced_date` is the date of the EVENT being explained — different facts.
# `borrower_certification` / `accuracy_certification` are a prose attestation; `borrower_signature_present`
# is whether a signature is on the page — different facts. Aliasing would answer LO-2's question with a
# fact that is not its answer, which is precisely what the fidelity-coverage lesson (LP-494) warns about.
#
# ⚠️ SO EVERY LOE TYPE IS IN SCOPE AND NONE IS SILENTLY SKIPPED — THREE STATES, NOT TWO:
#     "no explanation letter exists"       -> not_applicable, NO finding (see applicability_expected below)
#     "a letter exists, unreadable"        -> couldnt_check  ("present; completeness cannot be read")
#     "a letter exists and is incomplete"  -> needs_review
# These must not collapse into each other, and a test proves all three.
#
# ⚠️ `applicability_expected` IS FALSE, AND THAT IS LO-1's HELD QUESTION SHOWING THROUGH. Declaring a
# missing LOE a gap would require knowing WHICH conditions require one — the lender- and AUS-driven list
# that nothing in the file enumerates, and the exact reason LO-1 is held for Priya. LO-2 therefore never
# reports a missing letter; it only judges letters that are there.
#
# ⚠️ THE AMOUNT LEG IS DELIBERATELY ABSENT. `referenced_amount` fills 0/34 across the family and 0/9 on
# the one type that declares it — the TI-3/4/5 block. A leg that never resolves cannot be load-bearing,
# and asserting on it would make every letter incomplete.
# Only `letter_of_explanation_asset` produces list rows (transfer_path_or_chronology, 8 rows across 7
# documents); the base type's `explanation_items` produces NONE, so no per-item completeness read exists.
#
# ⚠️ INCOMPLETE ROUTES TO needs_review, NOT fired — AND THAT IS AN EVIDENCE-DRIVEN CHOICE. On the one type
# with the fields, `referenced_date` fills 6/9 and `borrower_signature_present` 7/9. An empty field cannot
# be distinguished from a field the extractor missed, so a `fired` verdict would assert a defect on a
# letter that may well state its date on the page. `needs_review` costs a processor one glance and never
# an automatic finding. ⚠️ Whether an unsigned LOE is a FINDING or a CONDITION is a genuine domain
# question and is logged in docs/domain/priya-open-questions.md rather than decided here.
#
# `borrower_signature_present` is a TYPED extractor field, so the catalog's "signature (AI for scans)"
# rationale is STALE — LP-487's question answering yes a sixth time. Reported, NOT re-kinded: re-kinding
# needs its own Phase A, and rule_kinds.csv stays at 135 rows this ticket.
#
# No numeric threshold, and that is a checked conclusion (ADR-361), not an omission — this is a three-way
# presence check with nothing to cite a limit for.

rule_id: LO-2
name: Letter of explanation completeness
category: Letters of explanation

kind: structural          # must equal rule_kinds.csv (LO-2 = structural)
numeric_check: false      # a presence check across three legs, not a ratio

criteria: >-
  A letter of explanation in the file must state what is being explained, the date of the event being
  explained, and carry the borrower's signature. This reads the derived loe.completeness. A letter missing
  one of those legs is surfaced for confirmation rather than reported as a defect, because an empty
  extracted field cannot be distinguished from a field the extraction missed. A letter whose document type
  carries no completeness fields at all — including credit_explanation_letter, which has no extractor —
  resolves to couldnt_check: the letter is PRESENT and its completeness cannot be READ, which is a
  different answer from "no letter exists" and from "this letter is incomplete". A file with no
  explanation letter is not_applicable, never a gap.

applicability:
  scope: every letter of explanation in the loan file (all eight LOE-family document types)
  trigger: >-
    loe.is_explanation_letter == yes. A non-letter document is not_applicable; an UNCLASSIFIED document
    couldnt_checks rather than being assumed not to be a letter. ⚠️ The predicate is a separate derived tag
    rather than document.document_type because the applicability DSL has only eq/ne and this scope is
    eight document types — gating on one type would silently drop the other seven.

reference_values:
  priya_validated: false          # must equal rule_kinds.csv
  threshold_needs_signoff: false  # must equal rule_kinds.csv — a presence check has no threshold
  values: {}
  guideline_text: >-
    Where a loan file carries a borrower's letter of explanation, the letter must identify what is being
    explained and when it occurred, and must be signed by the borrower, so that an underwriter can rely on
    it as the borrower's own statement of record. A letter that does not identify its subject or its date,
    or that is unsigned, does not support the condition it was obtained for.

required_inputs:
  - name: is_explanation_letter
    snapshot_path: 'tags.by_subject[<document content_id>]["loe.is_explanation_letter"]'
    description: >-
      whether this document is one of the eight LOE-family document types (derived, LP-495a) — LO-2's
      applicability predicate. "unknown" for an unclassified document.
  - name: completeness
    snapshot_path: 'tags.by_subject[<document content_id>]["loe.completeness"]'
    description: >-
      whether this letter states its explanation and referenced date and carries the borrower's signature
      (derived, LP-495a): "complete" / "incomplete" on the one document type whose extractor carries all
      three legs, and "unknown" on every other LOE type — the letter is present but its completeness
      cannot be read from what was extracted.

subject_enumeration: per_document
subject_key_fields: [document]

evidence_required: >-
  Which of the three legs — the explanation, the referenced date, the borrower's signature — is missing,
  named inline on the finding, so a processor knows what to request without reopening the letter. For a
  letter whose type carries no completeness fields, the document type itself, so the abstain is not
  mistaken for a pass.

guideline_reference: "A borrower's letter of explanation must identify what is being explained and when, and must be signed by the borrower, for an underwriter to rely on it as the borrower's statement of record."

spec_version: 1

# The MACHINE-READABLE deterministic body (LP-324). An "unknown" tag coerces through the gate to
# couldnt_check BEFORE this body runs.
deterministic:
  # ⚠️ AN APPLICABILITY PREDICATE, NOT AN OUTCOME (LP-487). The applicability layer resolves an ABSENT or
  # "unknown" predicate to COULDNT_CHECK and only a definitely-false one to not_applicable — so an
  # unclassified document is surfaced rather than silently skipped as "not a letter".
  applicability:
    tag: loe.is_explanation_letter
    op: eq
    value: "yes"
  load_bearing_tags:
    - loe.completeness
  gated_tags:
    - loe.completeness
  operands: {}
  outcomes:
    - verdict: satisfied
      when_tags:
        - {tag: loe.completeness, op: eq, value: "complete"}
      reasoning: >-
        this letter of explanation states what is being explained and when, and carries the borrower's
        signature
    # ⚠️ needs_review, NEVER fired — an empty extracted field is not proof the page is blank (see header).
    - verdict: needs_review
      when_tags:
        - {tag: loe.completeness, op: eq, value: "incomplete"}
      reasoning: >-
        this letter of explanation appears to be missing one of the three things an underwriter relies on
        — what is being explained, the date of the event, or the borrower's signature — so it should be
        confirmed against the letter itself before submission
      how_to_fix: >-
        Open the letter and confirm which element is genuinely absent. If the letter is unsigned, obtain a
        signed copy. If it does not identify the event or its date, request a corrected letter that states
        both. If the element is on the page and was simply not captured, no new document is needed.
    - verdict: couldnt_check
      # ⚠️ THE CATCH-ALL IS AN ABSTAIN, NOT A PASS — and it is the verdict for EVERY LOE type but one.
      # A letter whose extraction captures no completeness fields must not read as complete, and must not
      # read as incomplete either. This is the "present but unreadable" state, distinct from "no letter".
      default: true
      reasoning: >-
        this explanation letter is in the file but its completeness could not be read — the document type
        it was classified as captures no explanation summary, referenced date or signature indicator
      how_to_fix: >-
        Review the letter directly to confirm it states what is being explained and when, and that the
        borrower signed it. This check reads only the letter-of-explanation document type today; the other
        explanation-letter types capture different fields and one captures none at all.
