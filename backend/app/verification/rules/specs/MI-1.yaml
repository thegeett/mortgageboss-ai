# MI-1 — PMI required (conventional, LTV > 80%) — DETERMINISTIC calculative rule SPEC (LP-488).
#
# A conventional loan above 80% LTV requires mortgage insurance. This computes the LTV from the base loan
# amount and the value basis, and surfaces the requirement.
#
# ⚠️ THE FIRST USE OF THE PROGRAM AXIS. LP-501 established that conventional-vs-FHA IS expressible today
# (`LoanProgram` is a two-value enum reaching the snapshot as `program.type`), while Fannie-vs-Freddie and
# DU-vs-manual are NOT — no field carries either. MI-1 is conventional-only and MI-4 is FHA-only; both
# scope with an APPLICABILITY PREDICATE, never an outcome.
#
# ⚠️ WHY A PREDICATE AND NOT AN OUTCOME (LP-487's finding, and it is load-bearing here). The applicability
# layer resolves an ABSENT or "unknown" predicate tag to COULDNT_CHECK and only a DEFINITELY-FALSE one to
# not_applicable. As an outcome, a file that does not state its program would be SILENTLY SKIPPED. On this
# rule that is the difference between "we could not tell whether this loan needs MI" and saying nothing at
# all. LF-6T3N states no program and correctly returns couldnt_check.
#
# ⚠️ MI-1 CANNOT CONFIRM THAT MI IS PRESENT — the honest limit of this rule, and the reason it never fires.
# The catalog rationale reads "LTV>80 test + PMI present". The LTV test is fully buildable. The PRESENCE
# half has NO deterministic source in the system today:
#   • NO document type carries an MI certificate or an MI factor. The only mortgage-insurance field
#     anywhere in the 121 schema specs is `form_1098.mortgage_insurance_premiums` — a PRIOR-YEAR figure
#     for an EXISTING mortgage, not this loan's coverage.
#   • `mi.certificate_present` (fact_tags.csv) is an AI tag with no calibration; an uncalibrated AI tag
#     cannot gate a live rule (LP-484).
#   • `housing.mi_monthly` is undeclared, has no recipe, and reaches nothing.
# So an LTV above 80 resolves to NEEDS_REVIEW — "MI is required on this loan, confirm the file carries
# it" — not to `fired`. Firing would assert that MI is MISSING, which this rule cannot know. That is the
# IH-2 shape: report what is true, ask for what cannot be verified.
#
# ⚠️ MI-1 reads the BASE loan amount, never the note amount. On an FHA file the note amount includes
# financed upfront MIP; dividing by it would overstate LTV. (MI-4 reads the difference deliberately.)

rule_id: MI-1
name: PMI required (Conv >80% LTV)
category: MI

kind: calculative           # must equal rule_kinds.csv (MI-1 = calculative, deterministic_bookend)
numeric_check: true         # must equal rule_kinds.csv — an LTV ratio against a threshold

criteria: >-
  A conventional mortgage with a loan-to-value above 80% requires mortgage insurance. This reads the
  derived loan.ltv_percent — the base loan amount over the value basis (the lesser of purchase price and
  appraised value on a purchase, the appraised value on a refinance) — and compares it with the 80%
  threshold. An LTV above 80% is surfaced for confirmation that the file carries mortgage insurance; the
  rule cannot verify the coverage itself, because no document type in the system carries an MI
  certificate. A missing loan amount or value basis resolves to couldnt_check, never a guessed pass.

applicability:
  scope: the loan, when the program is conventional
  trigger: >-
    program.type == conventional. An FHA file is not_applicable (MI-4 covers FHA). A file that does not
    state its program couldnt_checks rather than being skipped.

reference_values:
  priya_validated: false          # must equal rule_kinds.csv
  threshold_needs_signoff: true   # must equal rule_kinds.csv
  values:
    # ⚠️ PROVENANCE TIER P — the publisher's own page, READ 2026-08-13 (LP-491 follow-up). It shipped at
    # LP-488 as tier S with the page date marked NOT OBTAINED; the page has since been fetched and the
    # value confirmed verbatim, so the tier is raised. ADR-361: a value is cited or it is marked
    # unobtained — never recalled and dressed as read.
    #   value:     MI required when LTV > 80%
    #   source:    Fannie Mae Selling Guide B7-1-01, "Provision of Mortgage Insurance"
    #   page date: 04/02/2025
    #   verbatim:  "the lender must obtain a primary mortgage insurance policy for a conventional first
    #              mortgage loan that has an LTV ratio greater than 80% at the time it is purchased"
    #   ⚠️ NOTE THE MEASUREMENT POINT: the guide states the test "at the time it is purchased" (by
    #   Fannie). MI-1 evaluates the LTV on the file before closing, which is the processor-facing
    #   question and the earlier of the two. Recorded so the difference is not mistaken for the same
    #   moment; logged for Priya.
    # Coverage AMOUNTS are B7-1-02 and are out of scope: MI-1 asks whether MI is required, not how much.
    mi_required_above_ltv_percent: "80"
  guideline_text: >-
    Mortgage insurance is required on a conventional first mortgage when the loan-to-value ratio exceeds
    80%. LTV is measured against the lesser of the purchase price and the appraised value on a purchase,
    and against the appraised value on a refinance. The required coverage AMOUNT is a separate matter
    (Fannie Mae Selling Guide B7-1-02) and is not evaluated here.

required_inputs:
  - name: ltv_percent
    snapshot_path: 'tags.by_subject["loan"]["loan.ltv_percent"]'
    description: >-
      the loan-to-value as a percent (derived, LP-488): the base loan amount over the value basis.
      "unknown" when the file states no base loan amount, or no purchase price and no appraised value.

subject_enumeration: loan
subject_key_fields: [loan]

evidence_required: >-
  The computed LTV, the base loan amount, and the value basis with which side it came from (purchase
  price or appraised value) — inline on the finding, so a processor can see the arithmetic without
  reopening the file.

guideline_reference: "Fannie Mae Selling Guide B7-1-01, Provision of Mortgage Insurance (page dated 04/02/2025) — the lender must obtain a primary mortgage insurance policy for a conventional first mortgage loan with an LTV ratio greater than 80%."

# LP-541 — the documents this rule's inputs come from, for read-time grouping of a couldnt_check
# into "request this" vs "read what is already here". Each entry is a group of ALTERNATIVES (any
# one satisfies it); every group must be satisfied. Nothing in evaluation reads this.
requires_documents: []

spec_version: 1

# The MACHINE-READABLE deterministic body (LP-324). An "unknown" tag coerces through the gate to
# couldnt_check BEFORE this body runs, so a missing loan amount can never reach the default.
deterministic:
  # ⚠️ THE PROGRAM PREDICATE — see the header. Absent/"unknown" → couldnt_check; FHA → not_applicable.
  applicability:
    tag: program.type
    op: eq
    value: conventional
  load_bearing_tags:
    - loan.ltv_percent
  gated_tags:
    - loan.ltv_percent
  operands:
    ltv: {tag: loan.ltv_percent}
    mi_threshold: {reference: mi_required_above_ltv_percent}
  outcomes:
    # ⚠️ needs_review, NOT fired — the rule knows MI is REQUIRED; it cannot know whether MI is PRESENT.
    - verdict: needs_review
      when_compare: {op: ">", left: ltv, right: mi_threshold}
      reasoning: >-
        the loan-to-value is {ltv}%, above the {mi_threshold}% threshold, so this conventional loan
        requires mortgage insurance — confirm the file carries an MI certificate and that the premium is
        included in the qualifying housing payment
      how_to_fix: >-
        Check that an MI certificate is in the file and that the monthly premium is in the qualifying
        housing payment. If the borrower is putting more down, confirm the final loan amount — at or below
        {mi_threshold}% the requirement falls away. If the loan uses lender-paid MI, note that on the file:
        the coverage exists but no borrower-paid premium will appear in the payment.
    # ⚠️ THE DEFAULT IS REACHED ONLY WITH A RESOLVED, PARSEABLE LTV. A numeric compare has no third
    # state — the tag is either above the threshold or not — and the gate routes an absent, "unknown" or
    # unparseable value to couldnt_check BEFORE this body runs. This is PR-6's structure, deliberately.
    - verdict: satisfied
      default: true
      reasoning: >-
        the loan-to-value is {ltv}%, at or below the {mi_threshold}% threshold, so no mortgage insurance
        is required on this conventional loan
