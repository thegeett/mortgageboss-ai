rule_id: IN-14
name: Rental income support
category: Income
kind: judgmental         # rule_kinds.csv: IN-14 = judgmental (ai_judgment)
numeric_check: false
criteria: >-
  Rental income used to qualify must be SUPPORTED — by the documents (lease / Schedule E / appraisal
  rent schedule) and by a continuance + a vacancy/expense adjustment (gross rent is not net qualifying
  income). The AI judges support + adjustment; a human ratifies EVERY verdict. Evaluated per borrower.
applicability:
  scope: every borrower using rental income
  trigger: once per borrower, judged on documentation + the vacancy/expense adjustment
required_inputs:
  - name: continuance_3yr
    snapshot_path: 'tags.by_subject[<borrower_id>]["income.continuance_3yr"]'
    description: whether the rental income is likely to continue (AI)
  - name: rental_support
    snapshot_path: 'tags.by_subject["loan"]["occupancy.rental_support"]'
    description: whether rental support docs are adequate (loan-level, shared into the borrower context)
reference_values:
  priya_validated: false
  threshold_needs_signoff: false
  # LP-495b — THE 75% FACTOR IS NO LONGER "pending Priya". It is a cited primary, verified verbatim
  # against the live page: a researched, cited threshold is calibrated (ADR-361 discipline).
  #
  # LP-641 — RE-VERIFIED AGAINST THE RESTRUCTURED GUIDE (09/02/2026), not renumbered. SEL-2026-08 SPLIT
  # this material, so one citation became two: the 75% factor is B3-3.8-02 (subject property) and the
  # lease-in-effect evidence is B3-3.8-01 (general). A find-and-replace would have put both under one
  # topic and been half wrong.
  #
  # `vacancy_and_maintenance_absorption_percent` KEEPS ITS NAME AND LOSES ITS CITATION. The 10/08/2025
  # page explained the factor — "the remaining 25% … absorbed by vacancy losses and ongoing maintenance
  # expenses" — and that sentence is in NEITHER new topic (checked both, separately). The value is
  # arithmetic (100 − 75) and stands; the name records the industry rationale the guide used to state
  # and no longer does. It is not claimed as verbatim anywhere below.
  values:
    gross_rent_qualifying_factor_percent: "75"
    vacancy_and_maintenance_absorption_percent: "25"
    lease_support_bank_statement_months: "2"
  guideline_text: >-
    Fannie Mae Selling Guide, both topics dated 09/02/2026.
    THE FACTOR — B3-3.8-02, Rental Income from the Subject Property, verbatim: "To determine adjusted
    net rental income (ANRI), the lender must multiply monthly gross rent by 75% for the net rental
    income amount, then subtract the PITIA of the subject property from the net rental income."
    THE LEASE EVIDENCE — B3-3.8-01, General Rental Income Information, verbatim: "The lender must
    obtain evidence that the terms of the lease have gone into effect by obtaining the most recent two
    consecutive months of bank statements or electronic transfers of rent payments showing an
    identifiable rental amount for the related property that aligns with the lease agreement", with two
    alternatives — for a newly executed lease, "copies of the security deposit and the first full
    month's rent check/money orders with proof of deposit"; or, at any lease age, "evidence of a
    property management agreement, not associated with the borrower or an interested party, along with
    proof of rents paid for the most recent two consecutive months."
    Gross rent is never qualifying income.
    Form 1007 (one-unit) and Form 1025 (two- to four-unit) are named at B3-3.8-02 and are MANDATORY
    where rental income is used to qualify, not merely acceptable; neither exists as a document type in
    this system, so that path cannot be represented today and the lease path is the only available one
    (LP-642).
    NOT CARRIED FORWARD: this repo's prior calibration entries quoted the remaining 25% as "absorbed
    by vacancy losses and ongoing maintenance expenses". That sentence is in neither restructured
    topic — checked separately by two readers — so it is no longer quoted here. Attributed to the
    prior entries rather than to a dated page: the pre-SEL text is not reachable at any of the three
    live URL aliases, all of which now serve 09/02/2026, so what page carried it cannot be confirmed.
    The factor is cited; the explanation is not.
subject_enumeration: per_borrower
subject_key_fields:
  - borrower
evidence_required: the rental income's supporting docs + the vacancy/expense adjustment and the judgment cited
guideline_reference: "Fannie Mae Selling Guide B3-3.8-02 (subject-property rental income: the 75% / ANRI factor) and B3-3.8-01 (general: the lease-in-effect evidence), both pages dated 09/02/2026. SEL-2026-08 split this material; the former single B3-3.8-01 citation — itself a correction of a stale B3-3.1-08 — covered both facts and now covers one."
judgment:
  subject: per_borrower
  # LP-495b review — the same missing predicate OC-3 had, and the same fix. tag_production.yaml claimed
  # occupancy.rental_support resolving to "n/a" "lets IN-14 reach not_applicable"; no such mapping exists
  # anywhere in the rule engine. "n/a" is a present, non-unknown value, so it PASSES the gate, and IN-14
  # then made a rule-time model call and returned a ratification-pending needs_review about rental income
  # on a file claiming none. IN-14 was partly shielded only because income.continuance_3yr usually resolves
  # "unknown" and gate leg 2 couldnt_checks first — an accident of the data, not scoping.
  # The loan-level tag reaches this per-borrower map because `_per_borrower` merges the loan subject's tags
  # into every borrower's (a borrower's own facts win on a collision); nothing here is borrower-specific,
  # so the predicate scopes the whole rule off on a file with no rental/investment income.
  applicability:
    tag: occupancy.rental_support
    op: ne
    value: "n/a"
  load_bearing_tags: [income.continuance_3yr, occupancy.rental_support]
  reasoned_over: [income.continuance_3yr, occupancy.rental_support]
  output_tag: income.rental_income_supportable
  # LP-622 — WHAT A PROCESSOR READS. Without guidance this rule fell to `_verdict_message` and
  # rendered "the AI judged '<value>' — an AI verdict a human must ratify", with how_to_fix NULL:
  # an explanation of the engine rather than of the loan. Written against this spec's own criteria
  # and the enum its explanatory tag actually carries. A tag interpolates BARE, so no template here
  # puts an article in front of one.
  verdict_labels:
    "yes": the rental income used to qualify is supported by the file
    "no": the rental income used to qualify is not supported by the file
    unknown: the tags do not support a confident judgment about this borrower's rental income
  guidance:
    action:
      "yes": "Confirm the rental income used to qualify is the documented figure after the vacancy adjustment, not gross rent."
      "no": "Obtain documentation supporting the rental income used to qualify — a current lease, Schedule E, or an appraisal rent schedule."
      unknown: "Establish whether the rental income this borrower qualifies on is documented and likely to continue."
    # Keyed on the SUPPORT tag: a file with no rental documents and one whose documents exist but do
    # not establish continuance are the same verdict and a different errand.
    explain_by: occupancy.rental_support
    explain:
      inadequate:
        why: >-
          Rental income is being used to qualify this borrower, but the file carries no lease,
          Schedule E or appraisal rent schedule establishing the rent. Gross rent is never qualifying
          income, and there is nothing here to apply the adjustment to.
        how_to_fix: >-
          Obtain a current lease, Schedule E from the most recent tax return, or an appraisal rent
          schedule (Form 1007 / 1025). Qualifying income is 75% of the GROSS monthly rent, so the
          document has to establish gross rent, not a net figure. A lease must itself be supported by two consecutive months of
          bank statements showing the rent arriving, or by the security deposit and first full month's
          rent with proof of deposit for a newly executed one.
      default:
        why: >-
          Rental income counts toward qualifying only when the documents establish the rent and it is
          likely to continue, and only after the vacancy and maintenance adjustment.
        how_to_fix: >-
          Confirm the file carries a lease, Schedule E or appraisal rent schedule establishing GROSS
          rent, and that the figure used to qualify is 75% of it rather than the gross.
  value_domain: ["yes", "no", "unknown"]
  confidence_floor: 0.5
  system_prompt: |
    You are a senior mortgage underwriter making ONE reasoned judgment: is THIS borrower's rental income
    SUPPORTED enough to use for qualifying?

    You reason ONLY over the STRUCTURED TAGS below — never raw documents. The tags are clean facts (the
    rental-support adequacy and the continuance signal). Judge the way an underwriter would: adequate
    support (a lease / Schedule E / appraisal rent schedule) WITH a vacancy/expense adjustment and a
    likely continuance qualifies; inadequate support, gross-rent-only with no adjustment, or an unclear
    continuance does not.

    BE HONEST. If the tags do not support a judgment, answer "unknown". NEVER guess. Cite the tags.

    STRICT OUTPUT — return ONLY a JSON OBJECT:
    {"value": "yes|no|unknown", "confidence": <0.0-1.0>, "reasoning": "<why — cite the tags>"}
# LP-541 — the documents this rule's inputs come from, for read-time grouping of a couldnt_check
# into "request this" vs "read what is already here". Each entry is a group of ALTERNATIVES (any
# one satisfies it); every group must be satisfied. Nothing in evaluation reads this.
requires_documents:
  - [lease_agreement, rental_income_schedule, verification_of_rent]

spec_version: 1
