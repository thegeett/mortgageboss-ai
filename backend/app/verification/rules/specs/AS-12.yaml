rule_id: AS-12
name: Borrowed funds detection
category: Assets
kind: judgmental
numeric_check: false
criteria: >-
  Do the borrower's deposit patterns suggest an undisclosed BORROWED source (a large round-dollar deposit
  with no payroll/transfer trace, a wire from an unverified party, a rapid liquidation)? The AI reasons
  over the transaction tags; a human ratifies EVERY verdict. Borrowed funds not disclosed as a loan can
  understate the DTI and misstate the source of funds.
applicability:
  scope: the loan file's bank-statement deposits
  trigger: per deposit, judged for a borrowed-funds pattern
required_inputs:
  - name: apparent_category
    snapshot_path: tags.by_subject[<txn content_id>]["txn.apparent_category"]
    description: the AI's classification of the deposit (payroll / gift / loan_proceeds / …)
  - name: has_identified_source
    snapshot_path: tags.by_subject[<txn content_id>]["txn.has_identified_source"]
    description: whether the deposit has a traceable source
  - name: counterparty
    snapshot_path: tags.by_subject[<txn content_id>]["txn.counterparty"]
    description: the other party, if visible (context)
reference_values:
  priya_validated: false           # mirrors rule_kinds.csv; no rule in the repo is flipped yet
  threshold_needs_signoff: false   # LP-518 — both fractions are DECIDED; the decision IS the sign-off
  guideline_text: >-
    Fannie Mae Selling Guide B3-4.2 / B3-6 — undisclosed borrowed funds must be identified and their
    payment counted in the DTI. The judgment flags a pattern; a human confirms.
  # LP-518 — the MATERIALITY floor as machine data, one fraction per loan purpose. Both are DECIDED (no
  # pending sign-off), but they have DIFFERENT PROVENANCE and the spec must not blur that:
  #
  #  * PURCHASE 50% is the guideline's own figure. B3-4.2-02: "A large deposit is defined as a single
  #    deposit that exceeds 50% of the total monthly qualifying income for the loan." Quotable.
  #  * REFINANCE 10% is an OVERLAY with no guideline behind it, chosen deliberately. The same page
  #    waives large-deposit DOCUMENTATION on a refinance — "Documentation or explanation for large
  #    deposits is not required; however, the lender remains responsible for ensuring that any borrowed
  #    funds, including any related liability, are considered" — so the 50% test is precisely the part
  #    set aside here, and inheriting its height would import a test the guide withdrew. The surviving
  #    borrowed-funds duty carries NO threshold, so any floor on a refinance is a triage choice; a
  #    LOWER one is the point, since it is the only test still running on that loan purpose. The
  #    finding text shows the arithmetic so a processor can judge the number themselves.
  #
  # Agencies size this test on DIFFERENT DENOMINATORS, not merely different numbers — Freddie on
  # eligible assets, FHA on Adjusted Value. Only Fannie's income basis is implementable here because no
  # fact on any file records the destination investor; do not assume 50% is universal.
  values:
    materiality_floor_pct_purchase: "50%"
    materiality_floor_pct_refinance: "10%"
subject_enumeration: per_deposit
subject_key_fields:
  - account
  - date
  - amount
evidence_required: the deposit pattern and why it suggests (or does not) a borrowed source
guideline_reference: "Fannie Mae Selling Guide B3-4.2 / B3-6 (source of funds / undisclosed debt)."
judgment:
  subject: per_deposit
  load_bearing_tags: [txn.is_money_in, txn.apparent_category, txn.has_identified_source]
  # LP-516: +txn.amount +txn.date. The prompt below asks the model to find "a large round-dollar
  # deposit" and "funds appearing just before closing" — it was given neither the amount nor the date,
  # so it was being asked about signals it could not observe. `_build_context` builds the judgment
  # context from THIS list alone, so adding them here is what puts them in front of the model.
  # ⚠️ Two of the prompt's three signals, not all three: "proximity to closing" also needs the loan's
  # closing date (contract.loan_closing_date), which is loan-level and absent on the file this ticket
  # came from — the same gap that makes IH-3 abstain there.
  reasoned_over: [txn.apparent_category, txn.has_identified_source, txn.counterparty, txn.amount, txn.date]
  # LP-516 — Fannie B3-4.2-02's READILY-IDENTIFIABLE exemption, with the guide's own escape hatch.
  #
  #   "If the source of a large deposit is readily identifiable on the account statement(s), such as a
  #    direct deposit from an employer (payroll) ... the lender does not need to obtain further
  #    explanation or documentation. However, if ... the lender still has questions as to whether the
  #    funds may have been borrowed, the lender should obtain additional documentation."
  #
  # ASK-THEN-SUPPRESS, not scope-before-asking: the model is still consulted on every deposit, and only
  # a NON-"yes" answer is suppressed. That preserves the second sentence — a readily-identifiable source
  # the model still flags reaches a human. The clearing is done by the deterministic predicate, so this
  # is NOT "auto-clearing a confident no": the model's answer can only ever ADD a review, never remove
  # one. An absent or "unknown" predicate leaves the verdict at needs_review (fail-closed).
  # ⚠️ Predicates on txn.apparent_category DIRECTLY, not on a derived tag. LP-516 first introduced
  # `txn.readily_identifiable_source` for this and it NEVER MATERIALIZED on a real run: the generic
  # materialization pass is scoped by `_MATERIALIZED_SUBJECTS`, which excludes `transaction` because
  # Stage A/B produces the txn.* tags through its own dedicated producer. A NEW transaction-subject
  # declaration therefore falls between the two — skipped by the generic pass, unknown to Stage A/B.
  # Measured on staging: all four payroll deposits answered "no" and none was exempted.
  # `txn.apparent_category` is produced by Stage A/B, so predicating on it directly works and needs no
  # new tag, no vocabulary entry and no widening of the AI scope (txn_stage_a is a required group, so
  # widening it would re-run the Stage-A model on every transaction at real cost).
  # LP-518 — ALTERNATIVES (any holds → exempt), matching how the guide lists them. `interest` joins
  # `payroll`: a bank's own interest posting is printed on the statement and readily identifiable by the
  # same clause, and it is not borrowed funds by construction. It survives the materiality floor below
  # only on a low-income refinance (a 10% floor of a small income can sit under a month's interest on a
  # large balance), which is exactly the case where clearing it by CITATION beats clearing it by size.
  # NOT extended to the guide's other named sources (SSA, IRS/state tax refund): `txn.apparent_category`
  # has no value for either, so declaring them would be a predicate that never matches.
  exempt_when:
    - {tag: txn.apparent_category, op: eq, value: payroll}
    - {tag: txn.apparent_category, op: eq, value: interest}
  exempt_unless_judgment_in: ["yes"]
  # LP-518 — the SIZE floor, sized per loan purpose. Runs AFTER `applicability` and BEFORE the gate and
  # the AI call, so a deposit too small for the borrowed-funds question to mean anything costs nothing.
  #
  # ⚠️ THIS SCOPES BEFORE ASKING, WHERE `exempt_when` ABOVE DELIBERATELY DOES NOT. The two sit adjacent
  # and resolve opposite ways, and the difference is the guideline's, not ours: the readily-identifiable
  # exemption is about the deposit's SOURCE and the guide attaches an escape hatch to it ("if the lender
  # still has questions ..."), so the model must be asked. The materiality floor is about the deposit's
  # SIZE, and the guide's own words are a SCOPE test — "a large deposit is defined as a single deposit
  # that EXCEEDS 50% of the total monthly qualifying income". Below the floor it is not a large deposit,
  # so there is nothing for an escape hatch to preserve. Hence strict `>`, matching "exceeds", and
  # matching AS-1's hard-fire branch on the same guideline.
  #
  # §8: below the floor is the ONLY not_applicable, and the gate NEVER produces a couldnt_check. When
  # the floor cannot be sized — no loan purpose, or no qualifying income — the deposit is reviewed at
  # any amount exactly as it was before this gate existed, and the finding says so. That path is common,
  # not a corner case: `dti.qualifying_income_monthly` derives from MISMO STATED income lines and
  # abstains to "unknown" whenever no import states one. Failing those files to couldnt_check would stop
  # asking the model altogether and hand the processor less than they had before.
  materiality:
    observed: {tag: txn.amount}
    basis: {loan_tag: dti.qualifying_income_monthly}
    fraction_by_loan_purpose:
      purchase: materiality_floor_pct_purchase
      refinance: materiality_floor_pct_refinance
  # LP-509-A1: see AS-2. `per_deposit` is per TRANSACTION, so without this the borrowed-funds
  # judgment was run against every outgoing bill payment in the file. Not in `reasoned_over`: the
  # predicate has already filtered the subjects the AI sees, so it carries no signal for the
  # judgment itself. != in → not_applicable; absent/unknown → couldnt_check.
  applicability: {tag: txn.is_money_in, op: eq, value: in}
  output_tag: as.borrowed_funds
  value_domain: ["yes", "no", "unknown"]
  confidence_floor: 0.5
  system_prompt: |
    You are a senior mortgage underwriter making ONE reasoned judgment about a single bank-statement
    deposit: do its characteristics suggest an UNDISCLOSED BORROWED source?

    You reason ONLY over the STRUCTURED TAGS below — never raw documents. The tags are clean facts other
    checks produced (the deposit's category, whether it has a traceable source, the counterparty). Judge
    the way an underwriter would: a large round-dollar deposit with no payroll/transfer trace, a wire from
    an unverified or interested party, or funds appearing just before closing with no source are
    borrowed-funds signals; a payroll deposit, a documented transfer from the borrower's own account, or a
    small ordinary credit are not.

    BE HONEST. If the tags do not support a judgment — missing, unknown, or genuinely ordinary — answer
    "no" or "unknown". NEVER guess, and NEVER treat an unlabeled deposit as automatically borrowed. Cite
    the tags you relied on.

    STRICT OUTPUT — return ONLY a JSON OBJECT:
    {"value": "yes|no|unknown", "confidence": <0.0-1.0>, "reasoning": "<why — cite the tags>"}
spec_version: 1
