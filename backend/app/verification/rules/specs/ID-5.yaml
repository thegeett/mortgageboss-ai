rule_id: ID-5
name: ID expiration
category: Identity
kind: structural
numeric_check: false
criteria: >-
  The borrower's government photo ID must be UNEXPIRED at closing: its expiration date must be on or
  after the loan's closing date. An ID that expires before closing is not acceptable evidence of
  identity. A non-expiring ID (no expiration date) cannot be judged expired — that is couldnt_check,
  never a fired finding.
applicability:
  scope: the loan file's government ID + closing date
  trigger: once per loan, comparing the ID expiration to the closing date
required_inputs:
  - name: id_expiration
    snapshot_path: 'tags.by_subject["loan"]["id.id_expiration"]'
    description: the government-ID expiration date (parsed date)
  - name: closing_date
    snapshot_path: 'tags.by_subject["loan"]["contract.closing_date"]'
    description: the loan's closing date (parsed date)
reference_values:
  priya_validated: false
  # PRIYA / HUMAN-VERIFY: the `>=` vs `>` boundary at closing (is an ID expiring ON the closing date
  # valid?) and any acceptable grace period are UNSURE guideline values. The encoded DEFAULT is
  # `>=` (valid ON the closing date); it is documented in guideline_text + LP-328's Priya list.
  # threshold_needs_signoff mirrors rule_kinds.csv (false — ID-5 carries no NUMERIC threshold to
  # sign off; its unsure value is the date-operator boundary, tracked in the Priya list, not here).
  threshold_needs_signoff: false
  guideline_text: >-
    Government photo identity documents must be unexpired at closing. The encoded rule is
    id_expiration >= closing_date (an ID valid ON the closing date is accepted) — a DEFAULT pending
    the domain expert's confirmation of the >=/> boundary and any grace period. No single
    Selling-Guide numeric threshold; identity-evidence acceptability is lender/investor-doc-driven.
subject_enumeration: loan
subject_key_fields:
  - loan
evidence_required: the ID expiration date and the closing date the comparison used
guideline_reference: >-
  Identity documentation — a government photo ID must be unexpired at closing (id_expiration >=
  closing_date). The >=/> boundary + any grace period are a lender/investor documentation standard
  pending Priya (threshold_needs_signoff).
spec_version: 1
deterministic:
  load_bearing_tags:
    - id.id_expiration
    - contract.closing_date
  gated_tags:
    - id.id_expiration
    - contract.closing_date
  operands:
    id_expiration:
      tag: id.id_expiration
      type: date
    closing_date:
      tag: contract.closing_date
      type: date
  outcomes:
    - verdict: fired
      # Expired at closing: expiration strictly BEFORE the closing date. `>=` is the encoded validity
      # rule, so `==` closing is NOT fired (valid on the day) — the Priya-pending boundary.
      when_compare:
        op: "<"
        left: id_expiration
        right: closing_date
      reasoning: >-
        the ID expiration {id_expiration} is before the closing date {closing_date} — the ID is
        expired at closing
      how_to_fix: >-
        Obtain a current, unexpired government photo ID for the borrower before closing (or confirm
        the closing date).
    - verdict: satisfied
      default: true
      reasoning: the ID is unexpired at closing (expiration is on or after the closing date)
