# OC-2 — Occupancy reasonableness — AI-at-rule-time JUDGMENT rule SPEC (LP-319 → LP-324)
#
# OC-2 is now DATA: the generic judgment evaluator runs THIS spec (no per-rule Python). The
# procedural armor (reason over tags, MANDATORY ratification, confidence-gated, fail-closed) lives
# in the evaluator; this spec supplies the question + the tags it reasons over.

rule_id: OC-2
name: Occupancy reasonableness
category: Occupancy

kind: judgmental          # must equal rule_kinds.csv (OC-2 = judgmental)
numeric_check: false      # a judgment rule has no deterministic numeric bookend

criteria: >-
  Is the borrower's STATED occupancy (primary / second home / investment) plausible for this loan,
  judged against the structured signals — address consistency, the type of the current address, and
  the subject-property address consistency across the file? A stated primary the signals contradict
  is not reasonable; a stated occupancy the signals support is. The AI judges plausibility; a human
  ratifies every verdict.

applicability:
  scope: >-
    Any loan file with a stated occupancy and the occupancy structural-fact tags produced
    (occupancy.stated + at least the consistency signal). Absent structural tags → couldnt_check.
  trigger: >-
    Evaluated once per loan (the loan-level occupancy subject), after the occupancy structural tags
    are produced.

required_inputs:
  - name: stated_occupancy
    snapshot_path: 'tags.by_subject["loan"]["occupancy.stated"]'
    description: The occupancy the borrower stated (primary / second / investment).
  - name: consistency_signal
    snapshot_path: 'tags.by_subject["loan"]["occupancy.consistent_with_signals"]'
    description: Whether address/other signals are consistent with the stated occupancy.

# A judgment rule has no numeric threshold. priya_validated / threshold_needs_signoff mirror
# rule_kinds.csv (both false for OC-2).
reference_values:
  priya_validated: false
  threshold_needs_signoff: false

subject_enumeration: loan          # the loan-level subject (LP-324 executable key)
subject_key_fields: [loan]

evidence_required: >-
  The stated occupancy + the consistency signals the judgment cited, inline on the finding, so the
  ratifying human sees WHY the AI judged reasonable / not reasonable.

guideline_reference: "Fannie Mae Selling Guide B2-1.1 (Occupancy Types) — occupancy must be reasonable and consistent with the file."

# LP-324 / LP-319 — the MACHINE-READABLE judgment body. The generic judgment evaluator runs THIS.
judgment:
  subject: loan                    # the tags-layer subject the loan-level tags live under
  # Gated (fail-closed) structural inputs — without a stated occupancy + a consistency signal there
  # is nothing to judge (absent/unknown → couldnt_check).
  load_bearing_tags: [occupancy.stated, occupancy.consistent_with_signals]
  # The structural-fact tags the AI reasons over (never raw docs).
  reasoned_over: [occupancy.stated, occupancy.consistent_with_signals, id.current_address_type, property.address_normalized_match]
  output_tag: occupancy.reasonable     # the rule_judgment tag produced
  value_domain: ["yes", "no", "unknown"]     # ALWAYS includes unknown (quoted: YAML reads bare yes/no as bool)
  # LP-522 — action first, in a processor's language.
  #
  # OC-2 asks whether the STATED occupancy is reasonable given what the file shows. Its `no` is the bad
  # answer, so the actions diverge sharply: a reasonable occupancy needs confirming, an unreasonable one
  # needs resolving. Occupancy drives pricing, LTV limits and reserve requirements, so the fix says what
  # is at stake rather than just asking for a document.
  guidance:
    action:
      "yes": "Confirm the file supports the stated occupancy ({stated})."
      "no": "Resolve the conflict between the stated occupancy ({stated}) and the file's own signals."
      "unknown": "Establish whether the stated occupancy ({stated}) is supported by the file."
    explain_by: occupancy.consistent_with_signals
    explain:
      "no":
        why: >-
          The address and other signals in the file point away from a {stated} occupancy — the borrower's
          documented address, the subject property's address, or both disagree with what was stated.
        how_to_fix: >-
          Confirm with the borrower which property this will be, and correct the 1003 if the stated
          occupancy is wrong. Occupancy changes pricing, the LTV limit and the reserves required, so a
          misstatement is not a paperwork error. If the stated occupancy is right, document why the
          signals differ — a pending move, a recently purchased home, an employment relocation.
      # ⚠️ EVIDENCE ONLY, no clause about why this is listed. `explain` is keyed on the TAG, so this
      # same sentence renders under an `unknown` verdict too — a "nothing to worry about here" ending
      # would then contradict the action above it, which is asking the processor to establish something.
      # The why says what the file shows; the action says what to do about it.
      "yes":
        why: The file's address signals agree with a {stated} occupancy.
        how_to_fix: Confirm the stated occupancy is what the borrower intends, and clear this.
      default:
        why: >-
          Whether the file's signals agree with a {stated} occupancy could not be established, so the
          stated occupancy has not been corroborated.
        how_to_fix: >-
          Check the borrower's current address on the 1003 against the subject property and any address
          on the supporting documents, and confirm the intended occupancy with the borrower.
  confidence_floor: 0.5
  system_prompt: |
    You are a senior mortgage underwriter making a REASONED JUDGMENT about ONE question: is the
    borrower's STATED occupancy plausible for this loan?

    You reason ONLY over the STRUCTURED TAGS handed to you below — never raw documents. The tags are
    clean facts other checks already produced: what occupancy the borrower stated, whether address and
    other signals are consistent with it, the type of the borrower's current address, and whether the
    subject-property address is consistent across the file. Judge plausibility the way an underwriter
    would: a stated PRIMARY residence that the signals contradict (e.g. the address signals point
    elsewhere, or the subject looks like a second home / investment) is NOT reasonable; a stated
    occupancy the signals support IS reasonable.

    BE HONEST. If the tags do not support a judgment — they are missing, unknown, or genuinely
    ambiguous — answer "unknown". NEVER guess, and NEVER treat a stated value as self-proving (the
    borrower's claim is the thing under scrutiny, not the evidence).

    Your reasoning MUST cite the SPECIFIC tags you relied on (by their tag id) and say what each
    implied. Give a confidence that reflects genuine certainty.

    STRICT OUTPUT — return ONLY a JSON OBJECT (no markdown fences, no prose before or after):
    {
      "value": "yes|no|unknown",
      "confidence": <0.0-1.0>,
      "reasoning": "<why — cite the specific tags (occupancy.stated, occupancy.consistent_with_signals,
                     …) and what each implied>"
    }

spec_version: 1
