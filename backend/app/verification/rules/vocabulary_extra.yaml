# LP-328 (GAP-E) — the HAND-EDITABLE fact-tag vocabulary overlay.
#
# `fact_tags.csv` is GENERATED from `docs/snapshot-fact-tags.xlsx` (the human/Priya authoring form) —
# a binary a PR cannot review, and re-running the generator would OVERWRITE a hand-added row. So the
# waves ADD a NEW tag HERE instead: a version-controlled YAML, reviewed in a PR, that the generator
# never touches. This is the vocabulary's hand-editable source of truth for wave-added tags; the xlsx
# remains the bulk-authoring view. A tag_id declared here that already exists in fact_tags.csv fails
# loud (never shadow an xlsx tag). Pair a new tag with its production declaration in
# `tag_production.yaml` (LP-326) so it also MATERIALIZES.
#
# Each entry (keyed by tag_id under `tags:`):
#   entity:        the logical entity (borrower | doc | loan | transaction | property | …) — REQUIRED
#   value_type:    number | date | string | enum | match_hash | object — REQUIRED
#   allowed_values: a list (for enum) or null
#   description:   one line
#   produced_by:   parsed | derived | AI (documentation; production MODE is in tag_production.yaml)
#
# Example (commented — a real add just uncomments + fills it in):
#   id.residency_eligible:
#     entity: borrower
#     value_type: enum
#     allowed_values: ["yes", "no", "unknown"]
#     description: Is the borrower's residency status eligible for the loan program (ID-8 verdict).
#     produced_by: AI
#
# =============================================================================================
# THE `*_normalized` TAG CONVENTION (LP-340 / ADR-281) — binds EVERY `*_normalized` tag, present
# and future (employer, name, address, and every family's future ones). Read this before minting a
# new one; do not re-decide it by accident.
#
#   GENERAL RULE (D3): a `*_normalized` tag reports the value THE DOCUMENT STATES, canonicalized for
#   FORMAT ONLY — casing, whitespace, punctuation, abbreviation expansion (St->Street). Normalize
#   FORMAT, NOT CONTENT: content differences (a different name, a different street) are the SIGNAL the
#   consistency rules exist to catch — never erase them in the tag. The tag reports; the RULE decides
#   how to compare (LP-335's principle — no downstream-matching concern in a tag prompt/exemplar).
#
#   RECORDED EXCEPTION (D1, Geet's decision): a corporate ENTITY SUFFIX (Inc/LLC/Corp/Co/Ltd) is
#   declared to be FORMAT, not content, for EMPLOYER matching — a suffix change is a restructuring,
#   not an employer change. It is stripped by the RULE via the declared `drop_entity_suffix` normalizer
#   (currently IN-5 only), NOT by the tag — the tag still reports `Acme Logistics Inc` in full. This
#   is a deliberate, recorded exception to the general rule, chosen (not overlooked). ACCEPTED
#   TRADE-OFF / PRIYA ITEM: `Acme Inc` and `Acme LLC` then compare equal — reversible by removing the
#   one `drop_entity_suffix` line from the rule's chain.
#
#   NAME (D2): a name `*_normalized` tag reports the document's PRIMARY printed name of record; it does
#   NOT prefer a fuller asserted/alternate form (the fuzzy consistency judge reconciles variants).
#
#   SCORING (D4): genuine content variance (nicknames, maiden vs married) still cannot be string-equality
#   scored (FINDING-2) — that is the fuzzy-scoring method's own ticket, not this convention.
# =============================================================================================

tags:
  # ID-9's rule_judgment output tag (LP-329). A NEW verdict tag added via the hand-editable overlay —
  # the GAP-E fix (LP-328) makes this possible without editing the generated fact_tags.csv / xlsx.
  id.poa_acceptable:
    entity: doc
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: Is the power of attorney acceptable under investor rules (ID-9 judgment verdict).
    produced_by: AI
  # ID-8's rule_judgment output tag (LP-331, per-borrower citizenship/residency eligibility). Added
  # via the hand-editable overlay (the GAP-E fix, LP-328).
  id.residency_eligible:
    entity: borrower
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: Is the borrower's citizenship/residency eligible for the loan program (ID-8 verdict).
    produced_by: AI

  # --- LP-389-A — ID-5's per-borrower inputs (the fix for the document→loan subject mismatch). The DL
  #     expiration STAYS a document fact (id.id_expiration, document subject); these two DERIVED tags
  #     promote it to the subjects ID-5 actually reads — the borrower's attributed ID, and the file's
  #     one closing date — reusing LP-385's per-borrower-over-documents shape (belongs_to). "unknown"
  #     always legal (the recipes abstain, never fabricate). --------------------------------------- #
  id.borrower_id_expiration:
    entity: borrower
    value_type: date
    allowed_values: null
    description: >-
      The borrower's government photo ID expiration date, resolved from the driver's-licence
      ATTRIBUTED to that borrower (belongs_to) — the per-borrower promotion of the document-subject
      id.id_expiration (LP-389-A). Feeds ID-5. "unknown" when the borrower has no attributable ID, or
      its ID documents disagree on the expiration.
    produced_by: derived
  contract.loan_closing_date:
    entity: loan
    value_type: date
    allowed_values: null
    description: >-
      The loan's single closing date, promoted to loan level from the contract document's
      contract.closing_date (LP-389-A — contract.closing_date itself stays a document fact). Feeds
      ID-5. "unknown" when no closing date is in the file, or documents disagree on it.
    produced_by: derived
  # LP-407-2 — the loan-level promotion of the contract SALES PRICE (contract.sales_price stays a document
  # fact). PC-2 enumerates the loan subject and cannot read a per-document tag, so it reads THIS and compares
  # it to the MISMO property.purchase_price. Mirrors contract.loan_closing_date exactly.
  contract.loan_sales_price:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The loan's single contract sales price, promoted to loan level from the purchase-agreement document's
      contract.sales_price (LP-407-2 — contract.sales_price itself stays a document fact). Feeds PC-2.
      "unknown" when no contract sales price is in the file, or documents disagree on it.
    produced_by: derived
  # LP-417 — the loan-level promotion of the homeowners-insurance effective date (ins.effective_date stays a
  # document fact). IH-3 (loan-enumerated) compares it to contract.loan_closing_date. Mirrors
  # contract.loan_closing_date; abstains ("unknown") when binders disagree (the multi-binder discipline).
  ins.loan_effective_date:
    entity: loan
    value_type: date
    allowed_values: null
    description: >-
      The loan's single homeowners-insurance effective date, promoted to loan level from the binder's
      ins.effective_date (LP-417 — ins.effective_date itself stays a document fact). Feeds IH-3.
      "unknown" when no binder states an effective date, or binders disagree on it.
    produced_by: derived
  # LP-447 — the homeowners binder's DWELLING loss-settlement basis, normalised from the free-form typed-core
  # replacement_cost_or_coinsurance_basis field (LP-446) to a controlled vocabulary. Feeds IH-1 (ADR-340 —
  # Priya's replacement-cost-basis adequacy ruling). Per-document (the binder subject). "unknown" for a
  # non-binder subject, an absent basis, or an UNRECOGNISED value (fail closed — IH-1 couldnt_check, never a
  # guessed pass). Reads ONLY the typed field, never the forms_and_endorsements list (the anti-conflation).
  ins.dwelling_settlement_basis:
    entity: doc
    value_type: enum
    allowed_values: ["replacement_cost", "actual_cash_value", "unknown"]
    description: >-
      The homeowners binder's dwelling loss-settlement basis (replacement cost vs actual cash value),
      normalised from the typed-core replacement_cost_or_coinsurance_basis field (LP-446/LP-447). Feeds IH-1.
      "unknown" when no binder states the basis, or the stated basis is not a recognised term.
    produced_by: derived

  # --- LP-323-IN-B — the income family's DERIVED arithmetic tags (loan-level aggregates; the derived
  #     producer is loan-only, so per-borrower granularity is deferred — see the LP-323-IN-B doc).
  #     value_type number, "unknown" always legal (the derived recipe abstains, never fabricates). --- #
  income.documented_income_shortfall_pct:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      (stated − documented) monthly income / stated, loan-level. SIGNED — negative = documented
      exceeds stated (a raise, not a shortfall). Feeds IN-1. "unknown" when inputs are absent/incomplete.
    produced_by: derived
  income.ytd_annualized_shortfall_pct:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      (documented − YTD-annualized-monthly) / documented, loan-level. Positive = the paystub YTD does
      not support the documented monthly income. Feeds IN-3. "unknown" when inputs are missing.
    produced_by: derived
  income.max_employment_gap_days:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      Largest gap in days between consecutive employment records. Feeds IN-4. "unknown" when fewer than
      two dated records exist.
    produced_by: derived
  income.days_since_most_recent_pay:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      Days from the most recent pay date to the file (snapshot) date. Feeds IN-2. "unknown" when no pay
      date is present.
    produced_by: derived

  # --- LP-444 — the FIRST consumer of list visibility (CR-4). A per-borrower AI verdict comparing the
  #     credit report's tradelines (a generic list, now visible) against the app's file-level stated
  #     liabilities (the MISMO comparison set). Ships INERT (CR-4 is not in ACTIVE_RULE_IDS) pending
  #     calibration + Priya's bar — a new AI judgment is never activated on arrival. ------------------- #
  credit.undisclosed_tradeline:
    entity: borrower
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      Does the credit report show a tradeline with a monthly payment > 0 that is NOT reflected in the
      app's stated liabilities (CR-4, report-vs-app)? "yes" = an undisclosed tradeline exists; "no" =
      every payment-bearing tradeline is disclosed; "unknown" = cannot compare (a truncated list, no
      credit report, or no stated liabilities). NEVER a confident "no" over a list marked truncated.
    produced_by: AI

  # --- LP-410 — the derived-producer wave: three descriptive tags that unblock PC-7 / AS-8 / IN-6. The
  #     rules were blocked not on inputs but on EXPRESSIBILITY (PC-7 no `today`; AS-8 ordered-pairwise,
  #     ADR-322; IN-6 set-coverage, ADR-323). These DERIVE the fact so a trivial rule branches on it. The
  #     tags DESCRIBE (a number / an observed-state enum); the rules JUDGE — no threshold lives here. ---- #
  contract.days_until_closing:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      Signed days from the file (snapshot) date to the loan's closing date (negative = the closing date
      is in the past). Feeds PC-7 (whose realistic-window judgment is the rule's, not the tag's).
      "unknown" when no parseable closing date is stated, or documents disagree on it.
    produced_by: derived
  stmt.continuity:
    entity: loan
    value_type: enum
    allowed_values: ["chained", "broken", "nothing_to_chain", "unknown"]
    description: >-
      Do each account's consecutive statements chain (ending balance == next opening balance)? Grouped
      per account via resolve_accounts, fire-if-any. Feeds AS-8. "chained" all carry over; "broken" some
      account's do not; "nothing_to_chain" no account has >=2 statements (lets AS-8 reach not_applicable);
      "unknown" a balance/period is unreadable or statements cannot be grouped. Balance-carryover only
      (the missing-period dimension is AS-10's).
    produced_by: derived
  # LP-418 — a DETERMINISTIC per-borrower self-employment signal (promotes the measured income.type), for
  # IN-12. "yes" = the borrower has self-employment income; "no" = income documents but none self-employment
  # (lets IN-12 reach not_applicable); "unknown" = no readable income type. No new AI — no calibration round.
  income.is_self_employed:
    entity: borrower
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      PER BORROWER: does the borrower have self-employment income (any attributed income document's
      income.type == "self_employment", OR — LP-422 — a Schedule C present on an attributed tax return)? A
      derived signal for IN-12. "no" (income but none self-employment) lets IN-12 reach not_applicable;
      "unknown" when no signal is readable.
    produced_by: derived
  income.has_rental_income:
    entity: borrower
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      PER BORROWER: does the borrower have rental income? The rental analog of income.is_self_employed (LP-422),
      for IN-13's rental scope. "yes" = a Schedule E present on an attributed tax return (LP-421 surfaced), OR an
      attributed income document typed income.type == "rental" (the 1003 can carry it — income_amounts reads the
      1003). "no" = a rental-relevant signal that is definitively not rental (a tax return with no Schedule E, or
      readable income types none rental) → lets IN-13 reach not_applicable. "unknown" = no tax return and no
      readable income type. Presence, not amount (ADR-324).
    produced_by: derived
  # LP-430 — the terminated-employment documentation check (Priya's B14 ruling: a terminated job's 2 years
  # still count as HISTORY — IN-11's concern — but the documentation standard is a SEPARATE check, this one).
  # DETERMINISTIC (two date/presence facts, no judgment → the ADR-334 escape hatch, no calibration round). A
  # per-borrower status: does the borrower have a PAST employment end date, and if so is it cleared by a
  # subsequent pay stub? "needs_pay_stub" fires IN-15 (the documentation is missing); "cleared" satisfies;
  # "not_terminated" (no past end date — no VOE, or only future/current) → IN-15 not_applicable; "unknown" only
  # if the snapshot cannot be read (fail-closed). Paired with income.terminated_employment_end_date (the date
  # IN-15 interpolates into its reason). NO AI — the reason ASKS FOR THE DOCUMENT, never asserts unemployment.
  income.terminated_employment:
    entity: borrower
    value_type: enum
    allowed_values: ["cleared", "needs_pay_stub", "not_terminated", "unknown"]
    description: >-
      PER BORROWER: does the borrower have a terminated (any PAST end date) employment that a subsequent pay
      stub has NOT cleared? "needs_pay_stub" = a past VOE end date with no later pay stub (IN-15 fires — the
      documentation is missing); "cleared" = a past end date + a pay stub dated after it; "not_terminated" = no
      readable past end date (no VOE / current / future end date) → IN-15 not_applicable; "unknown" = the
      documents/tags cannot be read. Derived from income.employment_end + income.pay_date over the borrower's
      attributed documents. No AI, no calibration.
    produced_by: derived
  income.terminated_employment_end_date:
    entity: borrower
    value_type: date
    allowed_values: null
    description: >-
      PER BORROWER: the most recent PAST employment end date (the termination IN-15 documents), for its reason
      interpolation. A real date when income.terminated_employment is "cleared"/"needs_pay_stub"; "unknown"
      otherwise (no past end date to name). Derived alongside income.terminated_employment (LP-430).
    produced_by: derived
  # LP-433 — the pay-stub-only documentation check (Priya's B12 ruling, the sibling of IN-15's B14 check): a
  # borrower's 2-year history cannot rest on pay stubs alone — a W-2 or 1099 is required. DETERMINISTIC (a
  # document-type presence read, no judgment → ADR-334, no calibration). PER BORROWER over the borrower's
  # attributed income documents. "pay_stub_only" fires IN-16 (documentation insufficient); "w2_or_1099"
  # satisfies; "no_pay_stubs" (no pay-stub-based history to challenge — no pay stubs, and no W-2/1099) → IN-16
  # not_applicable; "unknown" only if the documents cannot be read (fail-closed). NO AI — the reason ASKS FOR
  # THE DOCUMENT, never asserts the borrower cannot document their income.
  income.history_documentation:
    entity: borrower
    value_type: enum
    allowed_values: ["w2_or_1099", "pay_stub_only", "no_pay_stubs", "unknown"]
    description: >-
      PER BORROWER: what documents evidence the borrower's income history? "w2_or_1099" = a W-2 or a 1099 is
      attributed (the two-year history can be established → IN-16 satisfied); "pay_stub_only" = pay stubs are
      attributed but NO W-2 and NO 1099 (IN-16 fires — pay stubs alone cannot show a two-year history);
      "no_pay_stubs" = no pay stubs attributed (no pay-stub-only history for this check — no income docs, or a
      VOE only) → IN-16 not_applicable; "unknown" = the documents cannot be read. Derived from document-type
      PRESENCE (w2 / 1099 / pay_stub) over the borrower's attributed documents. No AI, no calibration.
    produced_by: derived
  income.employer_coverage:
    entity: borrower
    value_type: enum
    allowed_values: ["covered", "uncovered", "one_sided", "unknown"]
    description: >-
      PER BORROWER: do the borrower's pay-stub employers and W-2 employers cover each other? Feeds IN-6.
      "covered" both types present and their normalized employer sets cover each other; "uncovered" a
      normalized employer on one side has no match on the other; "one_sided" the borrower lacks pay stubs
      OR W-2s (lets IN-6 reach not_applicable); "unknown" an employer name is unreadable. Matches with
      IN-5's measured normalizers (no new judgment); the AI fuzzy-residue is a documented refinement.
    produced_by: derived

  # --- LP-323-IN-B — the income JUDGMENT verdict tags (the rule_judgment output the judgment evaluator
  #     writes; NOT materialized by a producer, so declared here only, like id.residency_eligible). ---- #
  income.job_change_acceptable:
    entity: borrower
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: Is a borrower's job change to the same line of work / stable (IN-7 judgment verdict).
    produced_by: AI
  income.other_income_continues:
    entity: borrower
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: Will other income (e.g. support, award) continue 3+ years and is documented (IN-13 verdict).
    produced_by: AI
  income.rental_income_supportable:
    entity: borrower
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: Is claimed rental income supported by docs + a continuance/vacancy adjustment (IN-14 verdict).
    produced_by: AI

  # --- LP-323-AS-B — the assets family's NEW derived + judgment tags (not in fact_tags.csv). ----------
  reserves.required_months:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      Required reserves in months of PITIA, selected from occupancy (AS-4 threshold). Derived; abstains
      ("unknown") for any occupancy/property cell not in the agency-standard map (the full matrix is Priya's).
    produced_by: derived
  stmt.nsf_count:
    entity: loan
    value_type: number
    allowed_values: null
    description: The count of NSF/overdraft transactions across the file's statements (AS-7). Derived.
    produced_by: derived
  stmt.min_account_months:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The fewest distinct statement months any ONE account has (AS-10 recency) — grouped per account via
      resolve_accounts, min across accounts (a short account is never masked by a well-documented one).
    produced_by: derived
  as.borrowed_funds:
    entity: loan
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: Do deposit patterns suggest an undisclosed borrowed-funds source (AS-12 judgment verdict)?
    produced_by: AI
  # LP-400 — surface name discrepancies + non-borrower co-holders instead of swallowing them (Priya's ruling:
  # a name variance FLAGS for attention but the document still COUNTS; a joint account flags a non-borrower
  # co-holder). Separate from stmt.owner_matches_borrower (whose yes/no/unknown + 13 goldens are UNCHANGED):
  # these DESCRIBE the observable (what KIND of difference / is there an extra holder); a RULE decides which
  # warrant attention (Priya's, later — this ticket only makes them produce). See ADR-319.
  stmt.holder_name_variance:
    entity: statement
    value_type: enum
    # DESCRIPTIVE taxonomy (not verdicts): middle_differs is a DIFFERENT middle (the risky "relative?" case,
    # LP-398 N1) — deliberately SPLIT from middle_absent (a dropped middle, benign, LP-398 P1), else the tag
    # would re-collapse them. `none` = no meaningful person-name difference (an exact match, OR the holder is
    # not a borrower at all — owner_matches_borrower carries that). WHICH kinds flag is the RULE's call (Priya).
    allowed_values:
      ["none", "middle_absent", "middle_differs", "nickname", "surname_differs", "other", "unknown"]
    description: >-
      When the account holder resolves to a borrower, HOW the stated name differs from that borrower's name
      (a describe-only observable; the rule decides which kinds warrant attention). `none` when there is no
      meaningful difference or the holder is not a borrower. NOTE: `none` is overloaded (exact match vs holder
      is not a borrower) — a consuming rule MUST co-read stmt.owner_matches_borrower to disambiguate the two
      (owner=yes+none = clean match; owner=no+none = not a borrower).
    produced_by: AI
  stmt.non_borrower_co_holder:
    entity: statement
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      Is there an ADDITIONAL account holder on the statement (a joint account) who is NOT a borrower on the
      loan (LP-398 N5)? The reasoning names the non-borrower holder. `no` for a single-holder account.
    produced_by: AI
  # LP-424 (item 4) — the loan's PURPOSE (purchase vs refinance), a PARSED loan-level scope signal promoted from
  # the MISMO loan.purpose fact (loan_file.loan_purpose). Mirrors program.type (parsed, subject:loan). Purpose:
  # let a purchase-only rule (PC-2 contract-price match, PC-7 closing window) scope to not_applicable on a
  # REFINANCE (no purchase agreement) instead of couldnt_check — the AS-8/PC-3 applicability-predicate pattern.
  # ⚠️ The predicate is NOT yet wired to PC-2/PC-7 (LP-424 deferred it: LF-6T3N carries no loan.purpose, so the
  # predicate would regress it to couldnt_check, and no refinance fixture exists in the snapshot path). This
  # declares the reusable tag; the predicate is a follow-up once those fixtures exist.
  loan.purpose:
    entity: loan
    value_type: enum
    allowed_values: ["purchase", "refinance"]
    description: >-
      Why the loan is being taken out — purchase or refinance (LoanPurpose). A parsed promotion of the MISMO
      loan.purpose fact to a loan-subject tag, so a purchase-only rule can scope out a refinance. Absent when
      the file states no purpose.
    produced_by: parsed
  # LP-453 (step D.2) — DETERMINISTIC numeric OBSERVATIONS over the credit report's tradelines list (loan-level).
  # Pure aggregates only; the open-ended bureau vocabulary makes classification a Priya/AI question (ADR). Tags
  # describe, rules judge — no threshold. "unknown" when no tradelines are captured (never a fabricated 0). Both
  # values are numeric STRINGS (the derived numeric convention).
  credit.tradeline_count:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      How many tradelines the file's credit report(s) list — ALL of them, open and closed (a pure count
      observation, no classification). DISTINCT from the extractor's open_tradeline_count (the open/active
      subset); this counts every captured row. "unknown" when no tradelines are captured. Loan-level aggregate.
    produced_by: derived
  credit.tradeline_monthly_payment_total:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The sum of the tradelines' monthly_payment — the observation CR-1 cross-checks against the DTI's
      liability payments. A present 0 (paid-off account) contributes 0; "unknown" when no tradeline carries a
      payment figure (never a fabricated 0). Loan-level aggregate.
    produced_by: derived

  # ------------------------------------------------------------------ #
  # LP-485 — the date-compare family (CL-1 / CR-13 / PR-6). Every tag is DESCRIPTIVE: it emits a number or
  # a date. The acceptable WINDOW lives in each rule's reference_values, never here (a tag carrying a
  # threshold is a rule in disguise — five rules have died from that confusion).
  # ------------------------------------------------------------------ #
  rate_lock.days_to_closing:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      SIGNED days from the closing date to the rate lock's expiration. Positive = the lock still has room
      at closing; negative = it expires BEFORE closing. "unknown" when either date is absent, unparseable,
      or the file's documents disagree — never 0.
    produced_by: derived
  property.appraisal_age_months_at_closing:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      COMPLETE calendar months from the appraisal's effective date to the loan's closing date. Calendar
      months, not a 30-day approximation. "unknown" when either date is missing or disputed — never 0.
    produced_by: derived
  credit.report_age_months_at_closing:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      COMPLETE calendar months from the credit report's pull date to the loan's closing date. Calendar
      months, not a 120-day approximation. "unknown" when either date is missing or disputed — never 0.
    produced_by: derived

  # --- LP-487 — IH-2's and IH-7's PARSED inputs. The two CONCLUSION tags they gate on
  #     (ins.mortgagee_clause_correct, ins.condo_master_policy) already exist in the generated
  #     fact_tags.csv, so they are NOT redeclared here — only their inputs, which are new. ---------- #

  # IH-2. ⚠️ THE LENDER NAME IS READ FROM TWO DOCUMENT TYPES UNDER TWO TAG IDS, deliberately. A parsed
  # declaration carries ONE document_type filter, and `lender_name` is a field name shared by TEN
  # document types whose meanings differ: form_1098.lender_name is the CURRENT SERVICER of an existing
  # mortgage, voe.lender_name is whoever ORDERED the verification, other_property_note.lender_name is a
  # DIFFERENT property's lender. An unscoped declaration would match all of them and poison the compare
  # with a name that was never this loan's creditor. Two scoped tags, no inference.
  ins.mortgagee_name:
    entity: doc
    value_type: string
    allowed_values: null
    description: >-
      The mortgagee named on a homeowners binder's mortgagee clause, read from the typed-core
      mortgagee_name field. The RAW carrier wording, un-normalised — IH-2's recipe normalises it.
      Per binder (a file may carry several).
    produced_by: parsed
  loan.lender_name_cd:
    entity: loan
    value_type: string
    allowed_values: null
    description: >-
      The creditor named on the Closing Disclosure. The AUTHORITY for "this loan's lender" — the CD is
      the final, binding statement of the creditor, where a Loan Estimate is preliminary and supersedable.
    produced_by: parsed
  loan.lender_name_le:
    entity: loan
    value_type: string
    allowed_values: null
    description: >-
      The lender named on a Loan Estimate. IH-2's FALLBACK, used only when no Closing Disclosure states a
      creditor — early in processing the CD does not exist yet, and a file with only an LE should still be
      checkable rather than a permanent couldnt_check.
    produced_by: parsed

  # IH-7. The condo master policy's three adequacy inputs. Each is PARSED off the master-policy document,
  # so when the file carries NO master policy none of them materialise — which is exactly how the derived
  # recipe distinguishes "absent" from "present but inadequate".
  condo.master_policy_number:
    entity: doc
    value_type: string
    allowed_values: null
    description: >-
      The condominium master policy's policy number — IH-7's PRESENCE signal. A master policy document
      that states no policy number is not treated as evidence the policy exists.
    produced_by: parsed
  condo.master_policy_basis_raw:
    entity: doc
    value_type: string
    allowed_values: null
    description: >-
      The master policy's replacement_cost_indicator, RAW. Carrier wording varies ("Replacement Cost",
      "Guaranteed Replacement", "REPLACEMENT COST AT AG"), so IH-7's recipe matches a declared closed
      vocabulary and abstains on anything else (ADR-376). Never read as inadequate by default.
    produced_by: parsed
  condo.master_liability_limit:
    entity: doc
    value_type: number
    allowed_values: null
    description: >-
      The master policy's general liability limit per occurrence, in dollars. "unknown" when absent or
      unparseable — never 0, which would read as a real limit of zero and fire IH-7 wrongly.
    produced_by: parsed

  # --- LP-488 — MI-1's comparable LTV, and MI-4's note amount. --------------------------------------- #
  #
  # ⚠️ WHY loan.ltv_percent EXISTS WHEN calc.ltv ALREADY DOES. `calc.ltv` (fact_tags.csv) is an OBJECT —
  # {value, breakdown[]} — built for PR-1's transparent display, and a rule cannot compare an object with
  # a threshold. This is the same fact in the shape a rule can gate on: one number. `calc.ltv` stays
  # undeclared/inert; when it is wired for display it must read the SAME arithmetic (app/verification/ltv.py),
  # which this recipe calls rather than reimplements.
  loan.ltv_percent:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The loan-to-value ratio as a percent (e.g. 85.00), from the base loan amount over the value basis —
      the lesser of purchase price and appraised value on a purchase, the appraised value on a refinance.
      "unknown" when the loan amount or the value basis is missing — never 0, which would read as a
      fully-collateralised loan.
    produced_by: derived
  loan.refinance_type:
    entity: loan
    value_type: string
    allowed_values: null
    description: >-
      The MISMO refinance kind (cash_out / rate_term), or absent on a purchase. Read by the LTV purpose
      resolver so it mirrors app.services.ltv.ltv_purpose_for. It does not change the LTV denominator —
      both refinance kinds divide by the appraised value.
    produced_by: parsed
  loan.note_amount:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The MISMO note amount (TERMS_OF_LOAN/NoteAmount) — what the borrower signs for, INCLUDING any
      financed FHA upfront MIP. ⚠️ Distinct from loan.amount, which is the BASE loan amount
      (TERMS_OF_LOAN/BaseLoanAmount). MI-4 reads the difference between the two.
    produced_by: parsed

  # --- LP-488 — MI-4's FHA upfront MIP, expressed as a RATE. ---------------------------------------- #
  #
  # ⚠️ A RATE, NOT A DOLLAR VARIANCE, and that is deliberate. MI-4 must compare the financed UFMIP with
  # the 1.75% required by HUD ML 2023-05. Emitting a variance would mean computing "expected UFMIP"
  # inside the producer — putting the 175-bps RATE in a recipe, where it is neither reviewable nor
  # citable. Emitting the rate keeps the threshold in the spec's reference_values: the tag DESCRIBES what
  # the file charged, the rule JUDGES it against the published figure.
  #
  # `mi.fha_ufmip` (fact_tags.csv, "FHA upfront MIP (financed)") stays INERT for the same reason it is
  # not needed: it is the dollar amount, and MI-4 gates on the rate. The dollars appear in this tag's
  # reason text, so a processor still sees them on the finding.
  mi.fha_ufmip_percent:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The FHA upfront MIP financed into the loan, as a percent of the base loan amount — computed as
      (note amount - base loan amount) / base loan amount x 100. 0 when nothing was financed (the premium
      may have been paid in cash). "unknown" when either amount is missing or the base is not positive —
      never 0, which would read as a real "nothing financed".
    produced_by: derived

  # --- LP-488 — CO-1's condo questionnaire. ---------------------------------------------------------- #
  #
  # ⚠️ PRESENCE ONLY. Priya's standing point is that condo rules must distinguish WARRANTABLE from
  # non-warrantable, not merely confirm a questionnaire exists — but that is CO-3/CO-5's job, and
  # `property.is_warrantable_condo` has NO source field anywhere in the 121 schema specs (LP-487), so it
  # stays inert. CO-1 answers the question it can answer honestly: is the document there?
  #
  # ⚠️ A DOCUMENT-TYPE PRESENCE READ (the IN-8/IN-9/IN-16 discipline) — the TYPE LABEL, not extracted
  # fields. A questionnaire that classified correctly but extracted badly still EXISTS, and CO-1 is not
  # the rule that judges its contents.
  # LP-488 review — the MISMO-stated property values, so a rule's LTV denominator can fall back to the
  # SAME source the LTV worksheet uses. Mirrors property.purchase_price exactly (a MISMO fact promoted to
  # loan level). Without these MI-1 read ONLY the appraisal document's value, so a MISMO-imported file
  # with a valuation and no appraisal PDF showed a real LTV on the worksheet and couldnt_check on the rule.
  property.valuation_amount:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The MISMO-stated valuation amount for the subject property — the LTV worksheet's PRIORITY appraised
      basis (app/services/ltv.py: `appraised = valuation_amount or estimated_value`). Absent when MISMO
      states none; never defaulted.
    produced_by: parsed
  property.estimated_value:
    entity: loan
    value_type: number
    allowed_values: null
    description: >-
      The MISMO-stated estimated property value — the LTV worksheet's FALLBACK appraised basis, used only
      when valuation_amount is absent. Absent when MISMO states none; never defaulted.
    produced_by: parsed
  condo.questionnaire_present:
    entity: loan
    value_type: enum
    # ⚠️ "unknown" IS a member (reported finding): the recipe abstains on a file with no documents, and
    # allowed_values is projected into the tags table and rendered as the vocabulary column in the
    # calibration worksheet — so omitting it stated a vocabulary the tag demonstrably violates.
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      Whether the file carries a condo questionnaire (document-type presence). "no" when the file has
      documents but none is a questionnaire; "unknown" when the file carries no documents at all — an
      empty file is not evidence the questionnaire is missing.
    produced_by: derived

  # --- LP-490 — the credit AI cohort's NEW tags. The rest of the cohort's tags already exist in the
  #     generated fact_tags.csv and are declared in tag_production.yaml only.
  #     ⚠️ EVERY TAG HERE IS UNCALIBRATED. Every rule reading one is INERT. -------------------------- #

  # CR-8. ⚠️ PRIYA'S OWN GATE, and the most important tag in this cohort. `payment_history_24mo` runs
  # 0–84 characters across 17 distinct formats on the three real reports; position-parsing it is the
  # ADR-353 trap and the field name is misleading. So the model states whether it could read the history
  # RELIABLY, and CR-8 routes "no" to needs_review — it NEVER converts an ambiguous string into a late.
  liab.structured_history_confident:
    entity: liability
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      Could this tradeline's payment history be interpreted reliably? "no" when the history string is
      absent, truncated, or in a format whose positions cannot be read with confidence. CR-8 evaluates
      automatically only on "yes".
    produced_by: ai
  # ⚠️ NEVER creditor name alone — Priya was explicit. Account type, creditor type, MORTGAGE / REAL
  # ESTATE indicators, HELOC markers, original/current balance and term, Metro 2 classification.
  liab.is_mortgage:
    entity: liability
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      Is this tradeline a mortgage (including a HELOC secured by real estate)? Judged from account type,
      creditor type, balance/term shape and Metro 2 classification — never from the creditor's name
      alone, which is how a mortgage servicer and a card issuer get confused.
    produced_by: ai
  liab.mortgage_late_60_plus_last_12mo:
    entity: liability
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      Does this mortgage tradeline show a 60-, 90-, 120- or 150-day delinquency in the previous twelve
      months? Fannie's excessive prior mortgage delinquency definition. "unknown" whenever the history
      could not be read reliably — the same abstention as structured_history_confident.
    produced_by: ai

  # CR-10.
  liab.is_medical_collection:
    entity: liability
    value_type: enum
    allowed_values: ["yes", "no", "unknown"]
    description: >-
      Is this collection a MEDICAL collection? Medical collections are EXCLUDED from Fannie's payoff
      limits and treated differently under FHA, so misreading one changes the requirement.
    produced_by: ai
  liab.collection_balance:
    entity: liability
    value_type: number
    allowed_values: null
    description: >-
      The outstanding balance of THIS collection or charged-off account, in dollars. "unknown" when the
      balance is not stated — never 0, which would read as a settled account and drop it out of the
      aggregate.
    produced_by: ai
  credit.collection_aggregate_balance:
    entity: borrower
    value_type: number
    allowed_values: null
    description: >-
      The sum of NON-MEDICAL collection balances for this borrower (derived). "unknown" when any
      contributing balance is unreadable — a partial sum would understate the aggregate and could clear
      a threshold the file does not actually clear.
    produced_by: derived

  # CR-6.
  credit.derogatory_months_elapsed:
    entity: liability
    value_type: number
    allowed_values: null
    description: >-
      Complete calendar months from THIS derogatory event's own date (discharge, dismissal or
      completion) to the loan's closing date. ⚠️ "unknown" when the event has no date — the seasoning is
      NEVER computed from the credit report's date, which would season an event to whenever the report
      happened to be pulled.
    produced_by: derived

  # --- LP-490 — the two RULE-JUDGMENT output tags (CR-8, CR-10). These are produced by the judgment
  #     evaluator at rule time, not by the materializer, so they are NOT declared in tag_production.yaml
  #     (the as.borrowed_funds precedent). ⚠️ Both rules are INERT. ------------------------------------ #
  credit.mortgage_history_assessment:
    entity: liability
    value_type: enum
    allowed_values: ["acceptable", "one_30_day_late", "multiple_30_day_lates", "excessive_60_plus", "not_interpretable", "unknown"]
    description: >-
      CR-8's judgment on ONE mortgage tradeline's payment history. ⚠️ "not_interpretable" is Priya's own
      gate — when the payment history cannot be read reliably the rule says so rather than converting an
      ambiguous string into a delinquency.
    produced_by: AI
  credit.collection_treatment:
    entity: borrower
    value_type: enum
    allowed_values: ["no_payoff_required", "payoff_required", "payment_plan_or_5pct_may_apply", "manual_underwriting_not_supported", "unknown"]
    description: >-
      CR-10's judgment on how this borrower's collections must be treated. ⚠️ The DU-vs-manual axis does
      not exist as a fact (LP-501), so "manual_underwriting_not_supported" is the honest abstention for a
      manually underwritten file rather than a guessed branch.
    produced_by: AI

  property.occupancy:
    entity: loan
    value_type: string
    allowed_values: null
    description: >-
      The stated occupancy of the subject property (primary_residence / second_home / investment), from
      MISMO. CR-10's Fannie DU branch is occupancy-keyed: a one-unit primary requires no collection
      payoff at all, while an investment property requires payoff at $250 individually or $1,000 in
      aggregate. ⚠️ Absent occupancy must ABSTAIN, never default to the permissive cell.
    produced_by: parsed
