# DISTRUSTED EXTRACTION FIELDS (LP-508 / ADR-377) — the gate's FIFTH defence.
#
# ⚠️ WHY THIS FILE EXISTS. `gate.py` has four defences: absent, "unknown", contradiction, and low
# confidence. A confidently-WRONG parsed value defeats all four by construction — it is present, it is not
# "unknown", nothing contradicts it, and the parsed producer sets `confidence=None`, which the confidence
# minimum FILTERS OUT (and skips entirely when every load-bearing tag is parsed). It reaches the rule body
# indistinguishable from a certain fact.
#
# So: a field with a CONFIRMED wrong value in the corpus is listed here. Any rule whose load-bearing tag
# reads it degrades to needs_review with ratification_pending — the finding still reaches the processor,
# marked, never suppressed and never fired.
#
# ⚠️ THIS IS CRUDER THAN A PER-EXTRACTION FLAG, DELIBERATELY. It keys on the FIELD, not on whether this
# particular extraction was wrong — so every file's value degrades, not just the bad ones. That is the
# trade: LP-474's per-extraction checks are precise but cover only 3 of the 9 ledger items and do NOT
# cover doc 104, the case that motivated this work. See ADR-377.
#
# ⚠️ EVERY ENTRY CARRIES ITS REASON — the document and what was wrong. A bare field name is unreviewable
# later, and this list MUST be prunable when an extractor improves. An entry with no evidence behind it
# should be deleted, not kept "just in case".
#
# ⚠️ THE DIVISION OF LABOUR WITH LP-474 — why 088 / 049 / 096 are NOT listed here.
# LP-474's per-extraction `must_differ` checks catch those three PRECISELY, with 0 false positives across
# the corpus (088: state tax == federal; 049: a row's amount == its running balance; 096: a Box-12 amount
# == Medicare). A field-level entry would be strictly worse for them: it degrades EVERY file's value, not
# the wrong ones. `txn.amount` was measured — it is load-bearing on AS-1, the flagship live rule, so
# listing it degraded every deposit on every file (39 tests moved) to protect a case that already has an
# exact check. Removed.
#
# So: LP-474 handles a wrong value with an INTERNAL SIGNATURE; this list handles a wrong value with NONE
# (doc 104's basis, the hallucinated licence values, the single-source dates). They are complements, and
# neither covers doc 253 — a lone amount with no sibling to contradict it (ADR-377).
#
# TWO SECTIONS:
#   fields:  keyed by document_type -> field -> reason. The loader resolves each to the PARSED tags that
#            read it, through tag_production.yaml — so a tag reading the same field name on a DIFFERENT
#            document type is unaffected.
#   tags:    tag_id -> reason, for a tag whose link to a distrusted field is NOT a direct parsed read —
#            a DERIVED tag whose recipe reads the field, or a list-row field the declaration names
#            differently. ⚠️ These are stated EXPLICITLY rather than inferred: guessing what a recipe
#            reads is exactly the kind of inference this layer exists to avoid.

fields:
  homeowners_insurance:
    replacement_cost_or_coinsurance_basis: >-
      doc 104 — the extractor read "coinsurance contract" as the loss-settlement basis on a replacement-cost
      HO3 policy. IH-1's ONLY gated tag reads this field, and it fills on 46.7% of binders, so IH-1 had no
      confidence defence at all: a wrong basis auto-asserted an insurance-adequacy verdict.

  drivers_license:
    expiration_date: >-
      docs 146 and 294 — hallucinated licence values. ID-5 (ships auto) reads the expiration to decide whether
      the borrower's ID is expired; a fabricated date auto-asserts a valid ID.
    date_of_birth: >-
      docs 146 and 294 — hallucinated licence values. ID-3 compares the DOB across sources; a fabricated one
      corrupts an identity match rather than failing it.



  credit_report:
    report_date: >-
      dates are on the accuracy ledger (docs 293 wrong check dates, 294 a fabricated date), and CR-13 (ships
      auto) auto-asserts credit-document validity off this single date. A plausible-but-wrong pull date
      silently ages the file correctly-looking and wrongly.

  appraisal:
    appraisal_effective_date: >-
      the same class as credit_report.report_date — docs 293 (wrong check dates) and 294 (a fabricated
      date) put extracted dates on the accuracy ledger. PR-6 (ships auto) decides the appraisal's validity
      band (acceptable / update required / new appraisal) entirely from this ONE date, with no second
      source to contradict it, so a plausible-but-wrong effective date silently picks the wrong band.

tags:
  # ⚠️ IH-1's tag — THE MOTIVATING CASE. ins.dwelling_settlement_basis is DERIVED from
  # homeowners_insurance.replacement_cost_or_coinsurance_basis (the field listed above), so field-name
  # resolution does not reach it. Named explicitly: this is the tag IH-1 gates on, and doc 104 is why this
  # whole layer exists.
  ins.dwelling_settlement_basis: >-
    doc 104 — derived from replacement_cost_or_coinsurance_basis, which the extractor read as "coinsurance
    contract" on a replacement-cost HO3. IH-1's ONLY gated tag, filling on 46.7% of binders, with no
    confidence defence because a parsed passthrough carries confidence=None.
